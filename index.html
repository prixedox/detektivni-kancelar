0 300 L330 160 L370 110\" stroke=\"#c0392b\" stroke-width=\"4\" fill=\"none\" stroke-linejoin=\"round\"/>\n<text x=\"90\" y=\"380\" fill=\"#c0392b\" font-weight=\"700\">tram 4<\/text>\n<circle cx=\"80\" cy=\"470\" r=\"7\" fill=\"#fff\" stroke=\"#c0392b\" stroke-width=\"3\"/><text x=\"94\" y=\"474\" font-weight=\"600\">Nemocnice<\/text>\n<circle cx=\"80\" cy=\"300\" r=\"6\" fill=\"#fff\" stroke=\"#c0392b\" stroke-width=\"3\"/><text x=\"94\" y=\"292\">Envelopa<\/text>\n<circle cx=\"220\" cy=\"300\" r=\"6\" fill=\"#fff\" stroke=\"#c0392b\" stroke-width=\"3\"/><text x=\"226\" y=\"320\">nám. Hrdinů<\/text>\n<circle cx=\"330\" cy=\"160\" r=\"6\" fill=\"#fff\" stroke=\"#c0392b\" stroke-width=\"3\"/><text x=\"252\" y=\"152\">Žižkovo nám.<\/text>\n<circle cx=\"370\" cy=\"110\" r=\"7\" fill=\"#fff\" stroke=\"#c0392b\" stroke-width=\"3\"/><text x=\"300\" y=\"100\" font-weight=\"600\">U Sadů<\/text>\n<rect x=\"40\" y=\"485\" width=\"120\" height=\"50\" fill=\"#d3dbe5\" stroke=\"#5f656d\"/><path d=\"M95 490 h10 M100 485 v10\" stroke=\"#b3261e\" stroke-width=\"3\"/><text x=\"48\" y=\"505\" font-weight=\"600\">NEMOCNICE<\/text><text x=\"48\" y=\"522\" font-size=\"10.5\">vrátnice, příjem<\/text>\n<rect x=\"170\" y=\"500\" width=\"62\" height=\"32\" fill=\"#eef0f2\" stroke=\"#5f656d\" stroke-dasharray=\"3 2\"/><text x=\"176\" y=\"520\" font-size=\"10.5\">parkoviště P2<\/text>\n<rect x=\"470\" y=\"420\" width=\"60\" height=\"34\" fill=\"#e0ccb3\" stroke=\"#6f5d3f\"/><text x=\"476\" y=\"441\" font-size=\"10.5\">Na Hradbách 7<\/text>\n<path d=\"M30 140 L10 140\" stroke=\"#333\" stroke-width=\"2\" marker-end=\"url(#ar)\"/>\n<defs><marker id=\"ar\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"4\" orient=\"auto\"><path d=\"M0 0 L8 4 L0 8z\" fill=\"#333\"/><\/marker><\/defs>\n<text x=\"34\" y=\"144\" font-size=\"10.5\">Nové Sady 4 km<\/text>\n<g transform=\"translate(36 52)\"><circle r=\"13\" fill=\"#fbfaf6\" stroke=\"#333\" stroke-width=\".8\"/><path d=\"M0 -11 L4.5 6 L0 3Z\" fill=\"#333\"/><path d=\"M0 -11 L-4.5 6 L0 3Z\" fill=\"#fbfaf6\" stroke=\"#333\" stroke-width=\".8\"/><text y=\"-17\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\">S<\/text><\/g>\n<g transform=\"translate(290 530)\"><rect x=\"-6\" y=\"-8\" width=\"214\" height=\"32\" fill=\"#fbfaf6\" opacity=\".9\"/><rect x=\"0\" y=\"0\" width=\"100\" height=\"5\" fill=\"#333\"/><rect x=\"100\" y=\"0\" width=\"100\" height=\"5\" fill=\"#fff\" stroke=\"#333\"/><text x=\"0\" y=\"20\" font-size=\"10\">0<\/text><text x=\"86\" y=\"20\" font-size=\"10\">300 m<\/text><text x=\"180\" y=\"20\" font-size=\"10\">600 m<\/text><\/g>\n<\/svg>\n<div class=\"box\" style=\"margin-top:5mm\">Hlavní cesta sadů vede od zastávky U Sadů podél hradeb až k domu Na Hradbách 7. Z nemocnice do sadů se dá dojít i pěšky přímo ulicemi (na plánku nezakresleno), asi 1,6 km.<\/div><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 6<\/div><div class=\"pcr\"><div><b>POLICIE ČESKÉ REPUBLIKY<\/b><span>Okresní ředitelství Olomouc · SKPV, odbor kriminalistické techniky<\/span><\/div><span>č. j. ORO-2071/KT-2004<\/span><\/div>\n<div class=\"pt\">PROTOKOL O OHLEDÁNÍ MÍSTA ČINU<\/div><div class=\"ps\">Hradební sady, úsek u bašty · zahájeno 13. 3. 2004 v 00:50, ukončeno 03:40 · umělé osvětlení<\/div>\n<p><b>1. Místo.<\/b> Mlatová cesta podél hradeb, šíře 3 m, osvětlení: lampa u laviček (v provozu), další lampa 80 m severně (nesvítí, rozbitá). Mezi cestou a hradbou pás keřů (tavolník), za ním travnatý pruh šíře asi 4 m. Místo, kde byla poškozená nalezena: travnatý pruh za keři, 9 m jižně od rohu bašty.<\/p>\n<p><b>2. Povrch.<\/b> Tráva i mlat mokré. Podle údajů ČHMÚ (stanice Olomouc-Holice) slabě mrholilo od 19:20 do 23:05, poté bez srážek, teplota kolem 4 °C.<\/p>\n<p><b>3. Stopy na cestě a v trávě.<\/b> V trávě četné stopy obuvi, většinou rozšlapané. Dvě čitelné stopy sportovní obuvi s rybinovým vzorkem, velikost odhadem 43–44, zajištěny sádrovým odlitkem. Stopy dámské obuvi (odpovídají obuvi poškozené). Stopy psa a pánské obuvi oznamovatele.<\/p>\n<p><b>4. U bašty.<\/b> V mezeře mezi rohem bašty a keři nalezeny <b>tři nedopalky cigaret Marlboro<\/b> v okruhu 40 cm. Nedopalky leží na mokré trávě a zespodu jsou vlhké, svrchu jsou ale suché a papír není zvlněný deštěm. Zde rovněž sešlapaná tráva a stopy téže sportovní obuvi. Zajištěno, odesláno k analýze DNA (sliny).<\/p>\n<p><b>5. Ostatní.<\/b> Na cestě u laviček nalezena ulomená plastová spona do vlasů (dle poškozené její). V keři roztržený rukáv světlé bundy poškozené. Bez stop krve. Zbraň ani jiný předmět pachatele nenalezen. Na lavičce u bašty prázdná láhev od vína a dva plastové kelímky, mokré.<\/p>\n<p><b>6. Zajištěno.<\/b> Odlitky stop č. 1–2, nedopalky č. 3–5, spona, vzorky trávy, stěry z oděvu poškozené (předáno z nemocnice). Vše odesláno do KÚP Praha.<\/p>\n<div class=\"sig\"><div><span class=\"s\">Musil<\/span>vedoucí ohledání<\/div><div><span class=\"s\">Vaňková<\/span>technik<\/div><\/div><p class=\"small muted\" style=\"margin-top:4mm\">kpt. Petr Musil · prap. Dana Vaňková<\/p><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 7<\/div><div class=\"pt\">NEMOCNICE OLOMOUC — VÝPISY Z TECHNICKÝCH SYSTÉMŮ<\/div><div class=\"ps\">vyžádáno obhajobou 15. 3. 2004 · personální oddělení a ústředna<\/div>\n<h3 class=\"s\">Docházkový systém — interní příjem a vybrané osoby, pátek 12. 3. 2004<\/h3>\n<table class=\"t m\"><tr><th>jméno<\/th><th>útvar<\/th><th>příchod<\/th><th>odchod<\/th><\/tr><tr><td>Vrbová Ilona<\/td><td>sestra, interna B<\/td><td>06:52<\/td><td>15:07<\/td><\/tr><tr><td>Kalina Ondřej<\/td><td>sanitář, interní příjem<\/td><td>14:51<\/td><td>23:00:41<\/td><\/tr><tr><td>Burešová Hana<\/td><td>sestra, interní příjem<\/td><td>14:48<\/td><td>23:01:12<\/td><\/tr><tr><td>Šindelářová Klára<\/td><td>brigádnice, interní příjem<\/td><td>14:56<\/td><td>23:19:55<\/td><\/tr><tr><td>MUDr. Brázda Tomáš<\/td><td>lékař, interní příjem<\/td><td>14:40<\/td><td>(služba do 07:00)<\/td><\/tr><tr><td>Novotná Věra<\/td><td>sestra, interní příjem<\/td><td>22:47<\/td><td>(noční)<\/td><\/tr><tr><td>MUDr. Řezníčková Jana<\/td><td>lékařka, interní příjem<\/td><td>14:36<\/td><td>(služba do 07:00)<\/td><\/tr><tr><td>Holeček Pavel<\/td><td>sanitář, interní příjem<\/td><td>23:02<\/td><td>(noční)<\/td><\/tr><tr><td>Dvořák Milan<\/td><td>vrátný<\/td><td>18:05<\/td><td>(do 06:00)<\/td><\/tr><tr><td>Vránová Petra<\/td><td>sestra, interní příjem<\/td><td>22:50<\/td><td>(noční)<\/td><\/tr><\/table>\n<p class=\"small muted\" style=\"margin-top:1.5mm\">Terminál docházky je u vrátnice hlavního vchodu. Odchod se zaznamenává přiložením karty při odchodu z budovy.<\/p>\n<h3 class=\"s\">Telefonní ústředna — odchozí hovory z linek interního příjmu, 12. 3. 2004 22:00–24:00<\/h3>\n<table class=\"t m\"><tr><th>čas<\/th><th>linka<\/th><th>volané číslo<\/th><th>délka<\/th><\/tr><tr><td>22:31:04<\/td><td>408<\/td><td>interní 215<\/td><td>0:41<\/td><\/tr><tr><td>22:52:10<\/td><td>412<\/td><td>604 318 772<\/td><td>2:48<\/td><\/tr><tr><td>23:12:47<\/td><td>401<\/td><td>interní 302<\/td><td>1:15<\/td><\/tr><tr><td>23:34:20<\/td><td>401<\/td><td>585 422 116<\/td><td>0:52<\/td><\/tr><tr><td>23:58:31<\/td><td>408<\/td><td>interní 215<\/td><td>0:20<\/td><\/tr><\/table>\n<p class=\"small muted\" style=\"margin-top:1.5mm\">Linky: 401 ambulance příjmu (lékař), 408 sesterna — pult, 412 sesterna — denní místnost (přístroj s hlasitým odposlechem).<\/p>\n<div class=\"box\">Pozn. personálního odd.: Studenti na brigádě nemají vlastní linku ani služební mobil. Soukromé hovory z linky 412 se tolerují.<\/div><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 8<\/div><div class=\"pcr\"><div><b style=\"color:var(--ink)\">JUDr. Eliška Marková<\/b><span>advokátka · Ztracená 14, Olomouc<\/span><\/div><span>obhajoba M. Vlka<\/span><\/div><div class=\"pt\">ZÁZNAM O ROZHOVORU<\/div><div class=\"ps\">Hana Burešová, nar. 1974, zdravotní sestra, interní příjem · 15. 3. 2004, 09:00, v kanceláři JUDr. Markové · pořídila JUDr. E. Marková<\/div><div class=\"rec\">\n<p>V pátek jsem měla narozeniny, tak jsem přinesla dort. Na denní místnost jsme se dostali až ke konci směny, provoz se uklidnil tak ve tři čtvrtě na jedenáct. Seděli jsme tam já, Ondra Kalina a Klárka. Lidi chodili sem a tam pro kousek, jak to v nemocnici bývá.<\/p>\n<p>Klárka měla vybitý mobil, tak volala z naší linky bráchovi kvůli odvozu. Držela talířek s dortem, tak to dala na hlasitý. Brácha nemohl, auto měl v servisu. Pak řekla, že teda půjde z tramvaje přes sady jako vždycky. Víc jsem neposlouchala, rozkrajovala jsem dort.<\/p>\n<p>V jedenáct jsme si s Ondrou píchli odchod. Já jezdím autobusem, zastávka je hned u vrátnice. Ondra šel na druhou stranu. Rozloučili jsme se u vrátnice. Klárka zůstala dodělat papíry.<\/p>\n<p class=\"q\">Jaký vztah má Kalina ke Kláře?<\/p><p>Normální. Líbí se mu, to ví celé oddělení, pozval ji do kina a ona nechtěla. Ale je to slušnej kluk, nosí mi tašky a dělá za ostatní noční.<\/p>\n<p class=\"q\">A doktor Brázda?<\/p><p>Na Klárku si dovoloval, ostatně nejen na ni. Stížnost řešila vrchní a od té doby je zticha.<\/p>\n<p class=\"q\">Kouří někdo z vás?<\/p><p>Na příjmu skoro všichni, kromě mě. Kouří se na rampě u sanitek.<\/p>\n<p class=\"q\">Co Marek Vlk?<\/p><p>Jednou si pro Klárku přišel na vrátnici a dělal scénu, vrátný ho vyvedl. To bylo v lednu.<\/p><\/div><div class=\"sig\"><div><span class=\"s\">H. Burešová<\/span>souhlasí s obsahem<\/div><div><span class=\"s\">E. Marková<\/span>zapsala<\/div><\/div><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 9<\/div><div class=\"pcr\"><div><b style=\"color:var(--ink)\">JUDr. Eliška Marková<\/b><span>advokátka · Ztracená 14, Olomouc<\/span><\/div><span>obhajoba M. Vlka<\/span><\/div><div class=\"pt\">ZÁZNAM O ROZHOVORU<\/div><div class=\"ps\">MUDr. Tomáš Brázda, nar. 1963, lékař interního příjmu · 15. 3. 2004, 13:30, v nemocnici · pořídila JUDr. E. Marková<\/div><div class=\"rec\">\n<p>V pátek jsem měl službu od tří odpoledne do sedmi ráno, s kolegyní Řezníčkovou. Z budovy jsem celou noc nevyšel, ostatně jsem ani nemohl, příjem byl plný.<\/p>\n<p class=\"q\">Kdy jste naposledy viděl Kláru Šindelářovou?<\/p><p>Tak kolem deseti minut před jedenáctou jsem se stavil na denní místnosti pro kus dortu, sestra Burešová měla narozeniny. Byl jsem tam pár minut. Paní Šindelářová zrovna telefonovala. Pak jsem šel zpátky na ambulanci.<\/p>\n<p class=\"q\">Paní Šindelářová si na vás stěžovala.<\/p><p>Ano. Bylo to nedorozumění, které jsme s vrchní sestrou vyřešili. Nemám k té dívce žádný vztah, ani dobrý, ani špatný. To, co se jí stalo, je hrozné.<\/p>\n<p class=\"q\">Kouříte?<\/p><p>Bohužel ano. Snažím se přestat.<\/p>\n<p class=\"q\">Máte auto?<\/p><p>Ano, ale v pátek jsem přijel tramvají, auto má žena.<\/p>\n<p class=\"q\">Kdo vás v noci může potvrdit?<\/p><p>Kdokoli z nočních. A příjmová kniha, tam je každý pacient s časem a podpisem.<\/p><\/div><div class=\"sig\"><div><span class=\"s\">Brázda<\/span>souhlasí s obsahem<\/div><div><span class=\"s\">E. Marková<\/span>zapsala<\/div><\/div><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 10<\/div><div class=\"pt\">PŘÍJMOVÁ KNIHA — INTERNÍ PŘÍJEM<\/div><div class=\"ps\">kopie listů 12.–13. 3. 2004 · iniciály pacientů ponechány · ověřeno vrchní sestrou<\/div>\n<table class=\"t\"><tr><th>čas<\/th><th>pacient<\/th><th>důvod<\/th><th>vyšetřil<\/th><th>sestra<\/th><\/tr><tr><td>22:21<\/td><td>J. P., 71 l.<\/td><td>dušnost, srdeční selhání<\/td><td class=\"hand\" style=\"font-size:11.5pt\">MUDr. Řezníčková<\/td><td class=\"hand\" style=\"font-size:11.5pt\">Burešová<\/td><\/tr><tr><td>22:58<\/td><td>M. K., 34 l.<\/td><td>bolest břicha<\/td><td class=\"hand\" style=\"font-size:11.5pt\">MUDr. Brázda<\/td><td class=\"hand\" style=\"font-size:11.5pt\">Novotná<\/td><\/tr><tr><td>23:14<\/td><td>F. Z., 80 l.<\/td><td>pád doma, kolaps<\/td><td class=\"hand\" style=\"font-size:11.5pt\">MUDr. Řezníčková<\/td><td class=\"hand\" style=\"font-size:11.5pt\">Novotná<\/td><\/tr><tr><td>23:36<\/td><td>L. H., 56 l.<\/td><td>bolest na hrudi, EKG<\/td><td class=\"hand\" style=\"font-size:11.5pt\">MUDr. Brázda<\/td><td class=\"hand\" style=\"font-size:11.5pt\">Novotná<\/td><\/tr><tr><td>23:47<\/td><td>K. M., 4 l.<\/td><td>febrilní křeče, 39,8 °C, 16 kg; Th: diazepam rekt. 5 mg, paracetamol sup. 250 mg — s matkou<\/td><td class=\"hand\" style=\"font-size:11.5pt\">MUDr. Brázda<\/td><td class=\"hand\" style=\"font-size:11.5pt\">Novotná<\/td><\/tr><tr><td>23:52<\/td><td>O. S., 45 l.<\/td><td>intoxikace alkoholem<\/td><td class=\"hand\" style=\"font-size:11.5pt\">MUDr. Řezníčková<\/td><td class=\"hand\" style=\"font-size:11.5pt\">Vránová<\/td><\/tr><tr><td>00:04<\/td><td>L. H., 56 l.<\/td><td>kontrola EKG, odběr na troponin<\/td><td class=\"hand\" style=\"font-size:11.5pt\">MUDr. Brázda<\/td><td class=\"hand\" style=\"font-size:11.5pt\">Novotná<\/td><\/tr><tr><td>00:21<\/td><td>B. N., 29 l.<\/td><td>alergická reakce<\/td><td class=\"hand\" style=\"font-size:11.5pt\">MUDr. Řezníčková<\/td><td class=\"hand\" style=\"font-size:11.5pt\">Novotná<\/td><\/tr><tr><td>00:40<\/td><td>K. M., 4 l.<\/td><td>předán na dětskou kliniku<\/td><td class=\"hand\" style=\"font-size:11.5pt\">MUDr. Brázda<\/td><td class=\"hand\" style=\"font-size:11.5pt\">Novotná<\/td><\/tr><\/table>\n<p class=\"small muted\" style=\"margin-top:3mm\">Převozy pacientů (sanitář): 23:30–23:58 F. Z. na RTG a zpět, doprovod P. Holeček · 00:35–00:52 K. M. na dětskou kliniku, doprovod P. Holeček. Čas se zapisuje při zahájení vyšetření. Lékař se podepisuje vlastní rukou; podpis sestry potvrzuje, že vyšetření probíhalo za její přítomnosti.<\/p><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 11<\/div><div class=\"pcr\"><div><b style=\"color:var(--ink)\">JUDr. Eliška Marková<\/b><span>advokátka · Ztracená 14, Olomouc<\/span><\/div><span>obhajoba M. Vlka<\/span><\/div><div class=\"pt\">ZÁZNAM O ROZHOVORU<\/div><div class=\"ps\">Ondřej Kalina, nar. 1975, sanitář, interní příjem · 15. 3. 2004, 15:00, v kanceláři JUDr. Markové · pořídila JUDr. E. Marková<\/div><div class=\"rec\">\n<p>Šichtu jsem měl od tří do jedenácti. Na konci jsme si dali s Hankou a Klárkou dort, Hanka měla narozeniny. V jedenáct jsem si píchnul odchod, šel jsem k autu a jel rovnou domů do Nových Sadů. Doma jsem byl tak ve čtvrt na dvanáct. Lenka už spala, tak jsem si pustil televizi a usnul na gauči.<\/p>\n<p class=\"q\">Slyšel jste, o čem Šindelářová telefonovala?<\/p><p>Nevšímal jsem si. Asi bráchovi, kvůli odvozu. Já jsem se bavil s Hankou.<\/p>\n<p class=\"q\">Jaký máte ke Kláře vztah?<\/p><p>Kamarádi z práce. Jednou jsem ji pozval do kina, nechtěla, v pohodě. Je to hodná holka. Když jsem v sobotu slyšel, co se stalo, nemohl jsem spát.<\/p>\n<p class=\"q\">Čím jezdíte do práce?<\/p><p>Fabií. Parkuju na zaměstnaneckém, mám kartu na závoru.<\/p>\n<p class=\"q\">Kouříte?<\/p><p>Jo. Na rampě se sanitkama, jako všichni.<\/p>\n<p class=\"q\">Znáte Marka Vlka?<\/p><p>Jen od vidění. Jednou dělal na vrátnici bordel kvůli Klárce.<\/p>\n<p class=\"q\">Viděl vás někdo cestou nebo doma?<\/p><p>Nevím. Bylo pozdě, ulice prázdný.<\/p><\/div><div class=\"sig\"><div><span class=\"s\">O. Kalina<\/span>souhlasí s obsahem<\/div><div><span class=\"s\">E. Marková<\/span>zapsala<\/div><\/div><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 12<\/div><div class=\"pcr\"><div><b style=\"color:var(--ink)\">JUDr. Eliška Marková<\/b><span>advokátka · Ztracená 14, Olomouc<\/span><\/div><span>obhajoba M. Vlka<\/span><\/div><div class=\"pt\">ZÁZNAM O ROZHOVORU<\/div><div class=\"ps\">Lenka Malá, nar. 1979, prodavačka v pekárně, družka O. Kaliny · 15. 3. 2004, 17:20, byt Nové Sady · pořídila JUDr. E. Marková<\/div><div class=\"rec\">\n<p>V pátek jsem šla spát kolem půl jedenácté, vstávám na šestou do pekárny. Neslyšela jsem ho přijít, spím tvrdě. Ráno spal na gauči a televize byla puštěná. Nic zvláštního jsem na něm neviděla.<\/p>\n<p class=\"q\">Kouří váš druh?<\/p><p>Kouří, ale doma ne, to mu nedovolím.<\/p>\n<p class=\"q\">Jaké nosí boty?<\/p><p>Do práce bílé zdravotní pantofle, jinak tenisky, čtyřiačtyřicítky. Na co to potřebujete?<\/p><\/div><div class=\"sig\"><div><span class=\"s\">L. Malá<\/span>souhlasí s obsahem<\/div><div><span class=\"s\">E. Marková<\/span>zapsala<\/div><\/div><div style=\"height:8mm\"><\/div><div class=\"pcr\"><div><b style=\"color:var(--ink)\">JUDr. Eliška Marková<\/b><span>advokátka · Ztracená 14, Olomouc<\/span><\/div><span>obhajoba M. Vlka<\/span><\/div><div class=\"pt\">ZÁZNAM O ROZHOVORU<\/div><div class=\"ps\">David Mrázek, nar. 1981, student VOŠZ, spolužák poškozené · 16. 3. 2004, 10:00, v kanceláři JUDr. Markové · pořídila JUDr. E. Marková<\/div><div class=\"rec\">\n<p>S Klárkou chodíme do stejného ročníku. Jsme kamarádi. V pátek večer jsem byl celou dobu na koleji, učil jsem se na farmakologii. Spolubydlící odjel na víkend domů, takže to nikdo nepotvrdí.<\/p>\n<p class=\"q\">Psal jste jí?<\/p><p>Někdy. Popřál jsem jí dobrou službu. To je snad normální.<\/p>\n<p class=\"q\">Kouříte?<\/p><p>Občas.<\/p><\/div><div class=\"sig\"><div><span class=\"s\">D. Mrázek<\/span>souhlasí s obsahem<\/div><div><span class=\"s\">E. Marková<\/span>zapsala<\/div><\/div><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 13<\/div><div class=\"pt\">EVIDENCE PARKOVACÍCH KARET<\/div><div class=\"ps\">zaměstnanecké parkoviště P2 · technicko-provozní úsek · stav k 1. 3. 2004 · výňatek<\/div>\n<table class=\"t m\"><tr><th>karta<\/th><th>držitel<\/th><th>pracoviště<\/th><th>SPZ<\/th><\/tr><tr><td>0112<\/td><td>MUDr. Brázda Tomáš<\/td><td>interní příjem<\/td><td>2M1 4420<\/td><\/tr><tr><td>0147<\/td><td>MUDr. Řezníčková Jana<\/td><td>interní příjem<\/td><td>1M7 0912<\/td><\/tr><tr><td>0203<\/td><td>Vrbová Ilona<\/td><td>interna B<\/td><td>OL 43-17<\/td><\/tr><tr><td>0251<\/td><td>Kratochvíl Jan<\/td><td>chirurgie<\/td><td>1M3 1135<\/td><\/tr><tr><td>0298<\/td><td>MUDr. Pospíšil Karel<\/td><td>chirurgie<\/td><td>2M8 2257<\/td><\/tr><tr><td>0317<\/td><td>Holeček Pavel<\/td><td>interní příjem<\/td><td>OL 08-92<\/td><\/tr><tr><td>0386<\/td><td>Kalina Ondřej<\/td><td>interní příjem<\/td><td>2M5 2217<\/td><\/tr><tr><td>0402<\/td><td>Mgr. Tichá Romana<\/td><td>vrchní sestra<\/td><td>1M0 5531<\/td><\/tr><tr><td>0419<\/td><td>Novotná Věra<\/td><td>interní příjem<\/td><td>OL 61-55<\/td><\/tr><tr><td>0455<\/td><td>Ing. Kubíček Aleš<\/td><td>technický úsek<\/td><td>1M2 9906<\/td><\/tr><tr><td>0471<\/td><td>Šrámková Eva<\/td><td>laboratoř<\/td><td>2M9 1442<\/td><\/tr><tr><td>0503<\/td><td>MUDr. Hlaváč Ivo<\/td><td>ARO<\/td><td>1M1 7310<\/td><\/tr><tr><td>0518<\/td><td>Bartoš Lukáš<\/td><td>ARO<\/td><td>2M4 3375<\/td><\/tr><tr><td>0533<\/td><td>Mgr. Hronová Lucie<\/td><td>chirurgie<\/td><td>1M7 4410<\/td><\/tr><tr><td>0560<\/td><td>Dvořák Milan<\/td><td>vrátnice<\/td><td>2M0 8821<\/td><\/tr><tr><td>0587<\/td><td>Zedník Martin<\/td><td>ARO<\/td><td>1M5 9023<\/td><\/tr><tr><td>0611<\/td><td>MUDr. Pešková Jitka<\/td><td>gynekologie<\/td><td>2M2 5108<\/td><\/tr><tr><td>0624<\/td><td>Kovář Radim<\/td><td>údržba<\/td><td>1M8 6601<\/td><\/tr><tr><td>0642<\/td><td>Sedláčková Iva<\/td><td>laboratoř<\/td><td>2M3 2289<\/td><\/tr><tr><td>0659<\/td><td>MUDr. Valenta Petr<\/td><td>chirurgie<\/td><td>1M6 1174<\/td><\/tr><\/table>\n<div class=\"box\" style=\"margin-top:5mm\">Provozní řád P2 (výňatek): Parkoviště je oploceno, vjezd a výjezd jen přes závoru na kartu. Karta je nepřenosná. Pěší vstup brankou od nemocnice.<br><br>Pozn. Ing. Kubíčka: Studenti a brigádníci karty nedostávají. Sestra Burešová kartu nemá, auto nevlastní.<\/div><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 14<\/div><div class=\"pt\">ZÁVORA P2 — VÝPIS UDÁLOSTÍ<\/div><div class=\"ps\">tisk z řídicí jednotky · 12. 3. 2004 18:00 – 13. 3. 2004 02:00 · VJ = vjezd, VÝ = výjezd<\/div>\n<table class=\"t m\"><tr><th>datum a čas<\/th><th>směr<\/th><th>karta<\/th><th>stav<\/th><\/tr><tr><td>12.03 18:02:11<\/td><td>VJ<\/td><td>0560<\/td><td>OK<\/td><\/tr><tr><td>12.03 19:02:44<\/td><td>VJ<\/td><td>0611<\/td><td>OK<\/td><\/tr><tr><td>12.03 19:15:30<\/td><td>VÝ<\/td><td>0402<\/td><td>OK<\/td><\/tr><tr><td>12.03 19:48:30<\/td><td>VÝ<\/td><td>0642<\/td><td>OK<\/td><\/tr><tr><td>12.03 20:05:14<\/td><td>VJ<\/td><td>0503<\/td><td>OK<\/td><\/tr><tr><td>12.03 20:07:48<\/td><td>VÝ<\/td><td>0298<\/td><td>OK<\/td><\/tr><tr><td>12.03 21:31:02<\/td><td>VÝ<\/td><td>0471<\/td><td>OK<\/td><\/tr><tr><td>12.03 21:58:12<\/td><td>VJ<\/td><td>0587<\/td><td>OK<\/td><\/tr><tr><td>12.03 22:15:40<\/td><td>VJ<\/td><td>0659<\/td><td>OK<\/td><\/tr><tr><td>12.03 22:44:13<\/td><td>VJ<\/td><td>0419<\/td><td>OK<\/td><\/tr><tr><td>12.03 22:46:59<\/td><td>VJ<\/td><td>0518<\/td><td>OK<\/td><\/tr><tr><td>12.03 22:59:12<\/td><td>VJ<\/td><td>0317<\/td><td>OK<\/td><\/tr><tr><td>12.03 23:04:21<\/td><td>VÝ<\/td><td>0251<\/td><td>OK<\/td><\/tr><tr><td>12.03 23:09:37<\/td><td>VÝ<\/td><td>0455<\/td><td>OK<\/td><\/tr><tr><td>12.03 23:22:05<\/td><td>VÝ<\/td><td>0533<\/td><td>OK<\/td><\/tr><tr><td>12.03 23:41:16<\/td><td>VJ<\/td><td>0298<\/td><td>OK<\/td><\/tr><tr><td>13.03 00:11:52<\/td><td>VÝ<\/td><td>0587<\/td><td>OK<\/td><\/tr><tr><td>13.03 00:24:37<\/td><td>VÝ<\/td><td>0386<\/td><td>OK<\/td><\/tr><tr><td>13.03 00:37:19<\/td><td>VÝ<\/td><td>0611<\/td><td>OK<\/td><\/tr><tr><td>13.03 00:58:03<\/td><td>VÝ<\/td><td>0298<\/td><td>OK<\/td><\/tr><tr><td>13.03 01:05:46<\/td><td>VJ<\/td><td>0624<\/td><td>OK<\/td><\/tr><tr><td>13.03 01:32:10<\/td><td>VÝ<\/td><td>0659<\/td><td>OK<\/td><\/tr><tr><td>13.03 01:47:22<\/td><td>VÝ<\/td><td>0503<\/td><td>OK<\/td><\/tr><tr><td>13.03 01:51:08<\/td><td>VÝ<\/td><td>0624<\/td><td>OK<\/td><\/tr><\/table>\n<p class=\"small muted\" style=\"margin-top:2mm\">Hodiny řídicí jednotky seřízeny 1. 3. 2004 podle signálu DCF77. Ruční otevření závory: v daném období žádné.<\/p>\n<div class=\"box\" style=\"margin-top:5mm\">Pozn. technického úseku: V pátek 12. 3. ráno vjelo na P2 31 vozidel. Výpis před 18:00 nebyl vyžádán.<\/div><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 15<\/div><div class=\"pcr\"><div><b style=\"color:var(--ink)\">JUDr. Eliška Marková<\/b><span>advokátka · Ztracená 14, Olomouc<\/span><\/div><span>obhajoba M. Vlka<\/span><\/div><div class=\"pt\">ZÁZNAM O ROZHOVORU<\/div><div class=\"ps\">Petr Šindelář, nar. 1977, bratr poškozené, Prostějov, tel. 604 318 772 · 14. 3. 2004, 11:00, Prostějov · pořídila JUDr. E. Marková<\/div><div class=\"rec\">\n<p>V pátek jezdím pro Klárku, když jedu z práce z Olomouce, ale od čtvrtka mám auto v servisu, spojka. V pátek večer jsem byl s kámošema na kvízu v hospodě U Tří lip tady v Prostějově. Klárka mi volala, nevím přesně, tak před jedenáctou. Z pevné, mobil prý měla vybitej. Řekl jsem, že nemůžu, ať si vezme taxíka. Ona že na to nemá a že pojede čtyřkou a půjde přes sady. Řekl jsem jí, ať si dá bacha.<\/p>\n<p>Kdybych měl auto…<\/p>\n<p class=\"q\">Kde jste byl mezi jedenáctou a půl jednou?<\/p><p>Na kvízu, dokud to neskončilo. Dělám kapitána, takže jsem nosil odpovědi. Pak jsem šel pěšky domů.<\/p>\n<p class=\"q\">Co víte o Markovi Vlkovi?<\/p><p>Že je to blbec, co neumí prohrávat. Psal jí, že toho bude litovat. Ale nevím, jestli by tohle udělal.<\/p>\n<p class=\"q\">Stalo se Kláře poslední dobou ještě něco divného?<\/p><p>V lednu jí v tramvaji ukradli peněženku i s klíčema od bytu. Zámek pak měnit nechtěla, že je to drahý.<\/p><\/div><div class=\"sig\"><div><span class=\"s\">P. Šindelář<\/span>souhlasí s obsahem<\/div><div><span class=\"s\">E. Marková<\/span>zapsala<\/div><\/div>\n<div class=\"box\" style=\"margin-top:6mm\">Pozn. JUDr. Markové: Autoservis Hrubý, Prostějov, potvrzuje, že vůz P. Šindeláře (Škoda Felicia) převzal ve čtvrtek 11. 3. a vydal v pondělí 15. 3.<\/div><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 16<\/div><div class=\"pt\">HOSPODSKÝ KVÍZ — U TŘÍ LIP, PROSTĚJOV<\/div><div class=\"ps\">originál výsledkové listiny, zapůjčen moderátorem kvízu 16. 3. 2004<\/div>\n<div class=\"quiz\"><div class=\"hand\" style=\"font-size:16pt;margin-bottom:2mm\">Kvíz 12. 3. 2004 — 6 kol<\/div>\n<table><tr><th>tým<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><th>6<\/th><th>Σ<\/th><\/tr><tr><td>Šindelářovi (kap. Petr Š.)<\/td><td>8<\/td><td>7<\/td><td>9<\/td><td>6<\/td><td>8<\/td><td>7<\/td><td>45<\/td><\/tr><tr><td>Mozkomoři<\/td><td>9<\/td><td>8<\/td><td>7<\/td><td>8<\/td><td>9<\/td><td>8<\/td><td>49<\/td><\/tr><tr><td>Pivní vědci<\/td><td>6<\/td><td>7<\/td><td>6<\/td><td>5<\/td><td>7<\/td><td>6<\/td><td>37<\/td><\/tr><tr><td>Tři lípy<\/td><td>7<\/td><td>6<\/td><td>8<\/td><td>7<\/td><td>6<\/td><td>8<\/td><td>42<\/td><\/tr><tr><td>Holky z ekonomky<\/td><td>8<\/td><td>9<\/td><td>8<\/td><td>9<\/td><td>7<\/td><td>9<\/td><td>50<\/td><\/tr><\/table>\n<div class=\"hand\" style=\"margin-top:3mm;font-size:12.5pt\">Odevzdání: 1. kolo 21:15 · 2. 21:40 · 3. 22:10 · 4. 22:45 · 5. 23:35 · 6. 23:55 · vyhlášení 00:15<br>Papíry nosí VŽDY kapitán osobně na bar a já mu je odškrtnu!! — Standa<\/div><\/div><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 17<\/div><div class=\"pcr\"><div><b>POLICIE ČESKÉ REPUBLIKY<\/b><span>Okresní ředitelství Olomouc · SKPV, 1. oddělení obecné kriminality<\/span><\/div><span>č. j. ORO-2071/TČ-2004<\/span><\/div><div class=\"pt\">PROTOKOL O VÝSLECHU PODEZŘELÉHO<\/div><div class=\"ps\">Marek Vlk, nar. 1977, ochranka v klubu, Olomouc, Dobrovského 22 · 13. 3. 2004, 13:10–13:50<\/div><div class=\"rec\">\n<p>V pátek jsem měl volno. Byl jsem celý večer doma, sám, koukal jsem na filmy. Nikam jsem nešel. Nikdo to nepotvrdí, bydlím sám.<\/p>\n<p>Klárce jsem psal, protože se mnou nemluví. Byl jsem naštvanej, psal jsem kraviny. Ale nikdy bych jí neublížil. Nikdy. Ať si to Klárka řekne sama, jestli si myslí, že jsem to byl já.<\/p>\n<p class=\"q\">Co znamená „Já si tě najdu“?<\/p><p>Že si s ní promluvím. Normálně. Že ji najdu po škole.<\/p>\n<p class=\"q\">Víte, kudy Šindelářová chodí z práce?<\/p><p>Vozí ji brácha, to vím. Nebo jezdí tramvají. Fakt nevím.<\/p><\/div><div class=\"sig\"><div><span class=\"s\">M. Vlk<\/span>podpis vyslýchaného<\/div><div><span class=\"s\">Krejčí<\/span>zapsala: nprap. Ivana Krejčí<\/div><\/div>\n<h3 class=\"s\">Výpis přijatých zpráv z telefonu poškozené (Nokia 3310), pátek 12. 3. 2004<\/h3>\n<div class=\"sms\"><div><i>12.03.2004 18:02 · od: Marek<\/i>Musime si promluvit. Zvedni to.<\/div><div><i>12.03.2004 19:15 · od: Marek<\/i>Ignorujes me? Jeste toho budes litovat.<\/div><div><i>12.03.2004 20:10 · od: David<\/i>Dobrou sluzbu Klarko :) D.<\/div><div><i>12.03.2004 21:38 · od: Marek<\/i>Ja si te najdu.<\/div><\/div>\n<p class=\"small muted\" style=\"margin-top:2mm\">Telefon předán policii z pracovní skříňky poškozené 13. 3. Podle operátora se naposledy odhlásil ze sítě 12. 3. ve 21:44 (vybitá baterie). Další zprávy nebyly doručeny.<\/p><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 18<\/div><div class=\"pcr\"><div><b>POLICIE ČESKÉ REPUBLIKY<\/b><span>Okresní ředitelství Olomouc · Obvodní oddělení Olomouc-střed<\/span><\/div><span>č. j. ORO-2071/ZAD-2004<\/span><\/div>\n<div class=\"pt\">PROTOKOL O ZADRŽENÍ OSOBY<\/div><div class=\"ps\">podle § 75 odst. 1 tr. ř.<\/div>\n<table class=\"t\"><tr><td style=\"width:46mm\"><b>Zadržený<\/b><\/td><td>Marek Vlk, nar. 14. 6. 1977, Olomouc, Dobrovského 22<\/td><\/tr>\n<tr><td><b>Čas a místo zadržení<\/b><\/td><td>13. 3. 2004, 10:20, v místě bydliště<\/td><\/tr>\n<tr><td><b>Důvod<\/b><\/td><td>podezření z trestného činu znásilnění (§ 241 tr. z.), nebezpečí opakování a působení na svědka<\/td><\/tr>\n<tr><td><b>Poučení<\/b><\/td><td>poučen, rozuměl, požádal o obhájce (JUDr. E. Marková, vyrozuměna v 10:45)<\/td><\/tr>\n<tr><td><b>Odebrané osobní věci<\/b><\/td><td>peněženka (340 Kč, OP, řidičský průkaz), svazek klíčů (4 ks), mobilní telefon Siemens C55, cigarety Marlboro (načatá krabička), zapalovač, opasek, tkaničky<\/td><\/tr>\n<tr><td><b>Ošacení při zadržení<\/b><\/td><td>tepláková souprava, pantofle; po výzvě se převlékl do džínů, mikiny a bundy<\/td><\/tr>\n<tr><td><b>Zajištěno v bytě se souhlasem<\/b><\/td><td>tenisky Nike, vel. 44 (pro srovnání stop), kožená bunda, pletená čepice. Kukla ani kožené rukavice nenalezeny.<\/td><\/tr>\n<tr><td><b>Lékařská prohlídka před umístěním do cely<\/b><\/td><td>MUDr. Pavel Hradil, 11:05: Při vědomí, orientován, klidný. Bez známek čerstvého poranění, bez škrábanců. Pravé předloktí a zápěstí v sádrové fixaci od kořenů prstů po loket, sádra suchá, neporušená (fraktura distálního radia, ošetřen na traumatologii 21. 2. 2004, fixace na 6 týdnů, kontrola 2. 4.). Prsty pravé ruky mírně oteklé. Způsobilý k pobytu v cele.<\/td><\/tr>\n<tr><td><b>Alkohol<\/b><\/td><td>dechová zkouška 0,00 ‰<\/td><\/tr>\n<tr><td><b>Umístěn<\/b><\/td><td>cela PZ č. 3, 11:20<\/td><\/tr><\/table>\n<div class=\"sig\"><div><span class=\"s\">M. Vlk<\/span>zadržený<\/div><div><span class=\"s\">Bureš<\/span>za policejní orgán<\/div><\/div><p class=\"small muted\" style=\"margin-top:4mm\">npor. Jan Kovařík<\/p><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 19<\/div><div class=\"pt\">DOPRAVNÍ PODNIK MĚSTA OLOMOUCE<\/div><div class=\"ps\">výňatek z jízdního řádu linky 4, pracovní dny, směr Hradby · a vyjádření řidiče<\/div>\n<table class=\"t m\"><tr><th>zastávka<\/th><th colspan=\"4\">odjezdy<\/th><\/tr><tr><td>Nemocnice<\/td><td>22:51<\/td><td>23:11<\/td><td>23:31<\/td><td>23:51<\/td><\/tr><tr><td>Envelopa<\/td><td>22:53<\/td><td>23:13<\/td><td>23:33<\/td><td>23:53<\/td><\/tr><tr><td>nám. Hrdinů<\/td><td>22:56<\/td><td>23:16<\/td><td>23:36<\/td><td>23:56<\/td><\/tr><tr><td>Žižkovo nám.<\/td><td>22:58<\/td><td>23:18<\/td><td>23:38<\/td><td>23:58<\/td><\/tr><tr><td>U Sadů<\/td><td>23:00<\/td><td>23:20<\/td><td>23:40<\/td><td>00:00<\/td><\/tr><\/table>\n<p class=\"small muted\" style=\"margin-top:2mm\">Dispečink DPMO: vůz ev. č. 172 (spoj 23:31) jel 12. 3. bez zpoždění; záznam tachografu vozu: U Sadů příjezd 23:40:05, odjezd 23:40:30.<\/p>\n<div class=\"pcr\"><div><b style=\"color:var(--ink)\">JUDr. Eliška Marková<\/b><span>advokátka · Ztracená 14, Olomouc<\/span><\/div><span>obhajoba M. Vlka<\/span><\/div><div class=\"pt\">ZÁZNAM O ROZHOVORU<\/div><div class=\"ps\">Jaroslav Kubeš, nar. 1956, řidič tramvaje DPMO · 15. 3. 2004, 07:30, vozovna DPMO · pořídila JUDr. E. Marková<\/div><div class=\"rec\">\n<p>Jel jsem čtyřku, spoj z Nemocnice ve 23:31. Vozem jelo asi šest lidí. U Sadů vystoupila jedna mladá holka ve světlé bundě, nikdo jiný. Na zastávce nikdo nečekal, to bych viděl, je tam lampa. Viděl jsem, jak jde do sadů, a jel jsem dál.<\/p>\n<p class=\"q\">Šel za ní někdo?<\/p><p>Nikdo. Zastávka byla prázdná, když jsem zavíral dveře. Holku jsem poznal na fotce, kterou mi ukázala paní doktorka; prý ji má od její spolubydlící.<\/p>\n<p class=\"q\">Kdo jel ve voze dál?<\/p><p>Nějaký starší pár a pár kluků, ti jeli až na konečnou. Kontrolovat lidi není moje práce.<\/p><\/div><div class=\"sig\"><div><span class=\"s\">Kubeš<\/span>souhlasí s obsahem<\/div><div><span class=\"s\">E. Marková<\/span>zapsala<\/div><\/div><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 20<\/div><div class=\"pcr\"><div><b style=\"color:var(--ink)\">JUDr. Eliška Marková<\/b><span>advokátka · Ztracená 14, Olomouc<\/span><\/div><span>obhajoba M. Vlka<\/span><\/div><div class=\"pt\">ZÁZNAM O ROZHOVORU<\/div><div class=\"ps\">Zdenka Pokorná, nar. 1936, důchodkyně, Na Hradbách 7, 1. patro · 16. 3. 2004, 14:00, byt svědkyně · pořídila JUDr. E. Marková<\/div><div class=\"rec\">\n<p>Já v noci nespím, sedím u okna a koukám na ulici. V pátek tam od půl dvanácté stál před naším domem mladý kluk, takový hubený, s kytkou v igelitu. Kouřil jednu za druhou a koukal nahoru do druhého patra, kde bydlí Klárka s kamarádkou. Bylo mi to divné, tak jsem ho hlídala. Kdyby šel ke dveřím, volám policii.<\/p>\n<p class=\"q\">Jak víte, že od půl dvanácté?<\/p><p>Zrovna odbilo půl na kostele a já jsem šla k oknu. A stál tam celou dobu, nehnul se, až do čtvrt na jednu. Pak hodil něco do schránek a šel pryč, ke kolejím. To už jezdila sanitka a policie dole u sadů, ale to jsem nevěděla, co je.<\/p>\n<p class=\"q\">Poznala byste ho?<\/p><p>Ten kluk na té fotce. Ten v brýlích.<\/p>\n<p class=\"q\">Stalo se ten večer ještě něco?<\/p><p>Holkám nahoře zvonil telefon, slyšela jsem ho přes strop. Tak ve dvacet minut po jedenácté. Dlouho, nikdo to nebral.<\/p><\/div><div class=\"sig\"><div><span class=\"s\">Z. Pokorná<\/span>souhlasí s obsahem<\/div><div><span class=\"s\">E. Marková<\/span>zapsala<\/div><\/div>\n<h3 class=\"s\" style=\"margin-top:7mm\">Dopis nalezený ve schránce poškozené v sobotu 13. 3. ráno (předala spolubydlící poškozené)<\/h3>\n<div class=\"note\">Klárko,<br>stál jsem tady od půl dvanácté, chtěl jsem Ti dát kytku, až půjdeš ze služby. Nepřišla jsi. Asi Tě zase vezl brácha někam jinam. Nevadí. Nechávám Ti tu aspoň básničku, kytka by do schránky nevlezla.<br>Nejsem divnej, fakt ne. Jen nevím, jak Ti to mám říct normálně.<br>D.<\/div><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 21<\/div><div class=\"pcr\"><div><b>POLICIE ČESKÉ REPUBLIKY<\/b><span>Okresní ředitelství Olomouc · SKPV, 1. oddělení obecné kriminality<\/span><\/div><span>č. j. ORO-2071/TČ-2004<\/span><\/div>\n<div class=\"pt\">PŘEHLED ÚKONŮ A STAV ZKOUMÁNÍ<\/div><div class=\"ps\">pro potřeby řízení o stížnosti proti vazbě · stav ke 16. 3. 2004<\/div>\n<table class=\"t\"><tr><th>úkon<\/th><th>stav<\/th><\/tr>\n<tr><td>Porovnání DNA (stěry z oděvu poškozené, nedopalky č. 3–5) s M. Vlkem<\/td><td>KÚP Praha, zadáno 13. 3., výsledek odhadem koncem dubna<\/td><\/tr>\n<tr><td>Porovnání odlitků stop obuvi s obuví M. Vlka (Nike, vel. 44)<\/td><td>KÚP Praha, zadáno 15. 3.<\/td><\/tr>\n<tr><td>Lékařská zpráva o vyšetření poškozené<\/td><td>doručena; podléhá ochraně, obhajobě nezpřístupněna<\/td><\/tr>\n<tr><td>Kamerový systém města, okolí sadů<\/td><td>v sadech ani na Hradbách kamery nejsou; kamera MP na Žižkově nám. mimo provoz od 2. 3.<\/td><\/tr>\n<tr><td>Lustrace mobilního telefonu M. Vlka (BTS)<\/td><td>vyžádáno 15. 3., operátor odpoví do 14 dnů<\/td><\/tr>\n<tr><td>Výslech svědků z tramvaje<\/td><td>neznámí, výzva v Olomouckém dni 16. 3.<\/td><\/tr><\/table>\n<div class=\"box\" style=\"margin-top:6mm\">Pozn. JUDr. Markové: Policie si vyžádala výpis BTS jen k Markovu telefonu. Ostatní osoby uvedené v tomto spisu policie nevyslýchala; jejich výpovědi jsem obstarala sama a nejsou podepsané úřední osobou.<\/div>\n<h3 class=\"s\" style=\"margin-top:7mm\">Počasí, Olomouc, 12.–13. 3. 2004 (ČHMÚ, výňatek)<\/h3>\n<table class=\"t m\"><tr><th>čas<\/th><th>teplota<\/th><th>srážky<\/th><\/tr>\n<tr><td>21:00<\/td><td>5,1 °C<\/td><td>slabé mrholení<\/td><\/tr><tr><td>22:00<\/td><td>4,6 °C<\/td><td>slabé mrholení<\/td><\/tr>\n<tr><td>23:00<\/td><td>4,2 °C<\/td><td>slabé mrholení, do 23:05<\/td><\/tr><tr><td>00:00<\/td><td>3,8 °C<\/td><td>bez srážek<\/td><\/tr><\/table><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 22<\/div><div class=\"pt\">OSOBY<\/div><div class=\"ps\">fotografie z dokladů a od svědků, přiloženo obhajobou · poškozená si nepřála být fotografována<\/div><div class=\"portr\"><figure><svg viewBox=\"0 0 100 125\" xmlns=\"http://www.w3.org/2000/svg\"><defs><radialGradient id=\"bg1\" cx=\"50%\" cy=\"38%\" r=\"75%\"><stop offset=\"0\" stop-color=\"#fff\" stop-opacity=\".45\"/><stop offset=\"1\" stop-color=\"#000\" stop-opacity=\".18\"/><\/radialGradient><radialGradient id=\"sh1\" cx=\"45%\" cy=\"40%\" r=\"65%\"><stop offset=\".55\" stop-color=\"#000\" stop-opacity=\"0\"/><stop offset=\"1\" stop-color=\"#000\" stop-opacity=\".22\"/><\/radialGradient><\/defs><g><rect width=\"100\" height=\"125\" fill=\"#dfe6ec\"/><rect width=\"100\" height=\"125\" fill=\"url(#bg1)\"/><path d=\"M4 125 C6 100 22 92 50 91 C78 92 94 100 96 125Z\" fill=\"#222\"/><path d=\"M50 92 V125\" stroke=\"#444\" stroke-width=\"1.5\"/><path d=\"M38 90 L44 100 L50 94 L56 100 L62 90\" fill=\"none\" stroke=\"#444\" stroke-width=\"2\"/><pat const KEY = 'detektivni-kancelar-v1';
const MAXPTS = 10;

/* ---------- storage ---------- */
let state = {};
try { const raw = localStorage.getItem(KEY); if (raw) state = JSON.parse(raw) || {}; } catch (e) { state = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
function ts(cid, tid){ state[cid] = state[cid] || {}; state[cid][tid] = state[cid][tid] || {hints:0, wrong:0, solved:false, ans:''}; return state[cid][tid]; }

/* ---------- crypto-lite (obfuscation so the answers are not readable in the source) ---------- */
const te = new TextEncoder(), td = new TextDecoder();
function fnv(str){ let h = 0x811c9dc5; for (const b of te.encode(str)) { h ^= b; h = Math.imul(h, 0x01000193) >>> 0; } return h >>> 0; }
function hex(n){ return ('00000000' + n.toString(16)).slice(-8); }
function b64bytes(s){ const bin = atob(s); const out = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
function unb64(s){ return td.decode(b64bytes(s)); }
function dec(blob, key){
  const data = b64bytes(blob); let a = fnv('k:' + key);
  for (let i = 0; i < data.length; i++) {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a) >>> 0;
    t = (((t + Math.imul(t ^ (t >>> 7), 61 | t)) >>> 0) ^ t) >>> 0;
    data[i] ^= ((t ^ (t >>> 14)) >>> 0) & 255;
  }
  return td.decode(data);
}

/* ---------- helpers ---------- */
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for (const k in (attrs || {})) {
    if (k === 'class') n.className = attrs[k];
    else if (k === 'html') n.innerHTML = attrs[k];
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== false && attrs[k] != null) n.setAttribute(k, attrs[k]);
  }
  for (const kid of kids.flat()) if (kid != null) n.append(kid);
  return n;
}
function points(s){ return Math.max(2, MAXPTS - 2 * s.hints - 3 * s.wrong); }
function caseScore(c){ let got = 0, done = 0; for (const t of c.tasks) { const s = ts(c.id, t.id); if (s.solved) { got += points(s); done++; } } return {got, done, max: c.tasks.length * MAXPTS}; }
function rank(pct){ return pct >= 90 ? 'Legenda kriminálky' : pct >= 75 ? 'Vrchní komisařka' : pct >= 55 ? 'Inspektorka' : 'Čekatelka'; }
function taskLabel(t){ return t.id === 'S' ? 'Sejf' : 'Úkol ' + t.id; }


function fieldValue(wrap, f){
  if (f.type === 'select' || f.type === 'proof') return wrap.querySelector('select').value;
  if (f.type === 'num') { const v = wrap.querySelector('input').value.trim(); return v === '' || isNaN(parseInt(v, 10)) ? '' : String(parseInt(v, 10)); }
  const picked = [...wrap.querySelectorAll('input:checked')].map(i => i.value).sort();
  return picked.join('+');
}

function renderField(c, t, f){
  const id = 'f-' + c.id + '-' + t.id + '-' + f.id;
  if (f.type === 'select' || f.type === 'proof') {
    return el('div', {class:'field' + (f.type === 'proof' ? ' proof' : ''), 'data-f': f.id},
      el('label', {for:id}, f.label),
      el('select', {id}, el('option', {value:''}, f.type === 'proof' ? 'Vyber list…' : 'Vyber…'), f.opts.map(o => el('option', {value:o[0]}, f.type === 'proof' ? 'List ' + o[0] + ' · ' + c.titles[+o[0] - 1] : o[1]))));
  }
  if (f.type === 'num') {
    return el('div', {class:'field', 'data-f': f.id},
      el('label', {for:id}, f.label),
      el('input', {id, type:'number', inputmode:'numeric', min:f.min, max:f.max, autocomplete:'off'}));
  }
  return el('div', {class:'field', 'data-f': f.id, role:'group', 'aria-label': f.label},
    el('div', {class:'lab'}, f.label),
    el('div', {class:'checks'}, f.opts.map(o => el('label', null, el('input', {type:'checkbox', value:o[0]}), o[1]))));
}

function describeAnswer(t, ans){
  const parts = ans.split('|');
  return t.fields.filter(f => f.type !== 'proof').map((f, i) => {
    const v = parts[i];
    if (f.type === 'num') return v;
    const name = id => (f.opts.find(o => o[0] === id) || [id, id])[1];
    return f.type === 'multi' ? v.split('+').map(name).join(', ') : name(v);
  }).join(' / ');
}

function renderTask(c, t, idx, justSolved){
  const s = ts(c.id, t.id);
  const prev = idx > 0 ? c.tasks[idx - 1] : null;
  const locked = prev && !ts(c.id, prev.id).solved;
  const card = el('section', {class:'task' + (s.solved ? ' solved' : locked ? ' locked' : ''), id:'task-' + t.id});
  card.append(el('header', null,
    el('span', {class:'tag'}, taskLabel(t)),
    el('h3', null, t.name),
    el('span', {class:'state'}, s.solved ? points(s) + ' b.' : locked ? 'Zamčeno' : '')));

  if (locked) { card.append(el('div', {class:'body'}, 'Odemkne se, až vyřešíš ' + (prev.id === 'S' ? 'sejf' : 'úkol ' + prev.id) + '.')); return card; }

  if (s.solved) {
    let html = '';
    try { html = dec(t.env, c.id + '/' + t.id + ':' + s.ans); } catch (e) { html = '<p>Obálku se nepodařilo otevřít. Zkus případ začít znovu.</p>'; }
    card.append(el('div', {class:'envelope'},
      el('span', {class:'stamp' + (justSolved ? ' pop' : '')}, 'OVĚŘENO'),
      el('p', {class:'answers'}, 'Tvoje odpověď: ' + describeAnswer(t, s.ans)),
      el('div', {html})));
    return card;
  }

  const body = el('div', {class:'body'});
  body.append(el('p', null, t.q));
  const nums = t.fields.every(f => f.type === 'num');
  const fwrap = el('div', {class: nums ? 'nums' : 'fields'}, t.fields.map(f => renderField(c, t, f)));
  body.append(fwrap);

  const msg = el('div', {class:'msg', role:'status', hidden:''});
  const hintList = el('ul', {class:'hints'});
  for (let i = 0; i < s.hints; i++) hintList.append(el('li', null, unb64(t.hints[i])));

  const hintBtn = el('button', {class:'btn quiet', type:'button'});
  function hintText(){ const left = t.hints.length - s.hints; hintBtn.textContent = left ? 'Nápověda (−2 b.), zbývá ' + left : 'Nápovědy vyčerpány'; hintBtn.disabled = !left; }
  hintText();
  hintBtn.addEventListener('click', () => { if (s.hints < t.hints.length) { hintList.append(el('li', null, unb64(t.hints[s.hints]))); s.hints++; save(); hintText(); } });

  const check = el('button', {class:'btn', type:'button'}, 'Ověřit odpověď');
  check.addEventListener('click', () => {
    const vals = t.fields.map(f => fieldValue(fwrap.querySelector('[data-f="' + f.id + '"]'), f));
    if (vals.some(v => v === '')) { msg.hidden = false; msg.textContent = 'Vyplň všechna pole. U zaškrtávacích políček označ aspoň jedno.'; return; }
    let ok = 0;
    t.fields.forEach((f, i) => { const h = hex(fnv('v:' + c.id + '/' + t.id + '/' + f.id + ':' + vals[i])); if (f.type === 'proof' ? f.hs.includes(h) : h === f.h) ok++; });
    if (ok === t.fields.length) {
      s.solved = true; s.ans = vals.filter((v, i) => t.fields[i].type !== 'proof').join('|'); save();
      renderCase(c, t.id);
    } else {
      s.wrong++; save();
      msg.hidden = false;
      msg.textContent = t.fields.length > 1
        ? 'Tohle nesedí. Správně máš ' + ok + ' z ' + t.fields.length + ' částí. Vrať se ke spisu a zkus to znovu.'
        : 'Tohle nesedí. Vrať se ke spisu a zkus to znovu.';
    }
  });

  body.append(el('div', {class:'row'}, check, hintBtn), msg, hintList);
  card.append(body);
  return card;
}


/* ---------- views ---------- */
const app = document.getElementById('app');
const PAGE_W = 794; // 210 mm in CSS px
const narrow = () => matchMedia('(max-width: 760px)').matches;
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

const loadedFonts = {};
function loadFonts(cid){ const d = DOCS[cid]; if (d.fonts && !loadedFonts[cid]) { loadedFonts[cid] = true; document.head.append(el('link', {rel:'stylesheet', href:d.fonts})); } }
const pageCache = {};
function pagesOf(cid){
  if (!pageCache[cid]) { const t = document.createElement('template'); t.innerHTML = DOCS[cid].html; pageCache[cid] = [...t.content.querySelectorAll('.page')].map(p => p.outerHTML); }
  return pageCache[cid];
}
// One sheet as a scaled-down picture: its own shadow root, so the case's CSS never leaks into the app.
const sizeObs = new ResizeObserver(es => { for (const e of es) { const h = e.target.firstElementChild; if (h) h.style.zoom = e.target.clientWidth / PAGE_W; } });
const lazyObs = new IntersectionObserver(es => { for (const e of es) if (e.isIntersecting) { lazyObs.unobserve(e.target); fillMini(e.target); } }, {rootMargin:'400px'});
function fillMini(box){
  const cid = box.dataset.cid, i = +box.dataset.i, d = DOCS[cid];
  const host = el('div', {style:'width:' + PAGE_W + 'px'});
  host.attachShadow({mode:'open'}).innerHTML = '<style>' + d.css + '.doc{background:transparent!important;margin:0!important;padding:0!important;counter-reset:list ' + i + '}.page{margin:0!important;box-shadow:none!important}</style><div class="doc">' + pagesOf(cid)[i] + '</div>';

function zword(v){ return v.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z]/g, '').toUpperCase(); }
// Case 6 ships encrypted with the envelope-Z password; a valid password adds it to the shelf.
function zok(pw){ return !!pw && hex(fnv('v:z:' + pw)) === ZDATA.h; }
function unlockSix(pw){
  if (CASES.some(c => c.id === 'pripad-6')) return;
  const p = JSON.parse(dec(ZDATA.c6, 'z:' + pw));
  CASES.push(p.c); DOCS[p.c.id] = p.d;
}
if (zok(state._z)) unlockSix(state._z);
function finale(){
  const five = CASES.filter(c => c.no <= 5);
  if (!five.every(c => caseScore(c).done === c.tasks.length)) return null;
  const pw = state._z;
  if (!zok(pw)) {
    const inp = el('input', {type:'text', maxlength:'12', autocomplete:'off', 'aria-label':'Heslo k obálce Z', placeholder:'_ _ _ _ _'});
    const msg = el('p', {class:'zmsg', role:'status'});
    const go = () => { const v = zword(inp.value); if (zok(v)) { state._z = v; save(); unlockSix(v); home(); } else msg.textContent = 'To heslo obálku neotevře. Zkontroluj pořadí písmen.'; };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    return el('section', {class:'letter', 'aria-label':'Obálka Z'},
      el('h2', null, 'Obálka Z'),
      el('p', null, 'Všech pět spisů je uzavřeno. Každá obálka C ti dala jedno písmeno a místo, kam patří. Slož z nich heslo.'),
      el('div', {class:'zrow'}, inp, el('button', {type:'button', class:'btn', onclick: go}, 'Otevřít')), msg);
  }
  const zl = el('section', {class:'letter', 'aria-label':'Dopis od npor. Dvořákové'}, el('div', {html: dec(ZDATA.letter, 'z:' + pw)}));
  const six = CASES.find(c => c.id === 'pripad-6');
  if (caseScore(six).done < six.tasks.length) return zl;
  let got = 0, max = 0; for (const c of CASES) { const sc = caseScore(c); got += sc.got; max += sc.max; }
  const last = dec(six.last, six.id + '#' + six.tasks.map(t => ts(six.id, t.id).ans).join('|') + '#final');
  return [zl, el('section', {class:'letter', 'aria-label':'Poslední dopis'},
    el('div', {html: last}),
    el('div', {class:'badge'}, 'ČESTNÁ KONZULTANTKA KRIMINÁLNÍ POLICIE · Mgr. Eliška Štychová · ' + got + ' z ' + max + ' bodů · hodnost: ' + rank(Math.round(100 * got / max))))];
}

function home(){
  document.body.classList.remove('ws');
  const next = CASES.find(c => caseScore(c).done < c.tasks.length);
  app.replaceChildren(el('div', {class:'home'},
    el('header', null,
      el('p', {class:'for'}, 'Spisy pro Mgr. Elišku Štychovou'),
      el('h1', null, 'Detektivní kancelář'),
      el('p', {class:'lead'}, (CASES.length > 5 ? 'Šest' : 'Pět') + ' spisů, od nejlehčího po nejtěžší. Čti listy, dělej si poznámky a odpovídej na úkoly. Správná odpověď otevře obálku s vysvětlením a další úkol.')),
    el('ol', {class:'shelf'}, CASES.map(c => {
      loadFonts(c.id);
      return el('li', null, el('a', {class:'case', href:'#' + c.id + '-spis'},
        mini(c.id, 0, 'cover'),
        el('div', {class:'info'},
          el('div', {class:'kick'}, el('span', {class:'no'}, String(c.no)), c.place, c === next ? el('span', {class:'next'}, caseScore(c).done ? 'Pokračuj' : 'Na řadě') : null),
          el('h2', null, c.title),
          el('p', {class:'intro'}, c.intro),
          el('div', {class:'facts'}, el('span', null, 'Obtížnost', meter(c.diff)), el('span', null, el('b', null, c.time)), el('span', null, c.sheets + ' listů')),
          el('div', {class:'prog'}, c.tasks.map(t => el('span', {class:'chip' + (ts(c.id, t.id).solved ? ' done' : ''), title: taskLabel(t)}, t.id === 'S' ? 'Sejf' : t.id)), el('span', null, progressText(c))))));
    })),
    finale(),
    el('p', {class:'foot'}, 'Postup a poznámky se ukládají jen v tomto prohlížeči. Za nápovědu jsou 2 body dolů, za špatnou odpověď 3. U každé odpovědi uveď i list, který ji dokazuje. Spisy jdou vytisknout na A4, na papíře se čtou nejlíp.')));
}

/* Per-case desk: open sheets, layout, pins and notes. Stored with task progress, so
   "Začít případ znovu" clears it too. */
function desk(cid){
  state[cid] = state[cid] || {};
  const d = state[cid]._desk = Object.assign({split:false, sheets:[0, 1], pins:[], notes:'', panel:'ukoly'}, state[cid]._desk || {});
  return d;
}

let ws = null; // the open workspace: {c, ...api}
function makeReader(c, n, ctl){
  const d = DOCS[c.id], dk = desk(c.id);
  const host = el('div', {style:'width:' + PAGE_W + 'px;margin:0 auto'});
  host.attachShadow({mode:'open'}).innerHTML = '<style>' + d.css + '.doc{background:transparent!important;padding:12px 0 40vh!important}.page{margin:0 auto 14px!important;box-shadow:0 2px 12px rgba(0,0,0,.28)!important}</style><div class="doc">' + d.html + '</div>';
  const pages = [...host.shadowRoot.querySelectorAll('.page')];
  const wrap = el('div', null, host);
  const body = el('div', {class:'rbody', tabindex:'0', 'aria-label':'Spis, list po listu'}, wrap);
  const curEl = el('div', {class:'cur', 'aria-live':'polite'});
  const back = el('button', {class:'icon picker', type:'button', title:'Všechny listy', 'aria-label':'Všechny listy', onclick: () => ctl.showGrid()}, '‹');
  const minus = el('button', {class:'icon', type:'button', title:'Zmenšit', 'aria-label':'Zmenšit'}, '−');
  const plus = el('button', {class:'icon', type:'button', title:'Zvětšit', 'aria-label':'Zvětšit'}, '+');
  const close = n === 1 ? el('button', {class:'icon', type:'button', title:'Zavřít druhý list', 'aria-label':'Zavřít druhý list', onclick: () => ctl.setSplit(false)}, '×') : null;
  const node = el('section', {class:'reader'}, el('div', {class:'rhead'}, back, curEl, minus, plus, close), body);
  const steps = [1, 1.25, 1.6, 2.1]; let step = 0, cur = -1, t = null;
  const api = {node, n, get cur(){ return cur; }, goTo, fit};
  function label(i){ curEl.replaceChildren(el('span', {class:'mono'}, String(i + 1).padStart(2, '0')), c.titles[i]); }
  function track(){
    const top = body.getBoundingClientRect().top + body.clientHeight * 0.3;
    let i = 0; for (let k = 0; k < pages.length; k++) if (pages[k].getBoundingClientRect().top <= top) i = k;
    if (i !== cur) { cur = i; label(i); dk.sheets[n] = i; ctl.changed(api); clearTimeout(t); t = setTimeout(save, 400); }
  }
  function goTo(i, smooth){
    const off = pages[i].getBoundingClientRect().top - body.getBoundingClientRect().top - 10;
    body.scrollTo({top: body.scrollTop + off, behavior: smooth && !reduced() ? 'smooth' : 'auto'});
  }
  function fit(){ const keep = Math.max(cur, 0); wrap.style.zoom = Math.min(1.35, (body.clientWidth - 20) / PAGE_W) * steps[step]; minus.disabled = step === 0; plus.disabled = step === steps.length - 1; goTo(keep); }
  minus.addEventListener('click', () => { if (step > 0) { step--; fit(); } });
  plus.addEventListener('click', () => { if (step < steps.length - 1) { step++; fit(); } });
  let raf = 0; body.addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; track(); }); }, {passive:true});
  node.addEventListener('pointerdown', () => ctl.activate(api), true);
  body.addEventListener('focus', () => ctl.activate(api));
  api.start = () => { fit(); goTo(Math.min(dk.sheets[n] || 0, pages.length - 1)); track(); };
  return api;
}

function workspace(c, view){
  loadFonts(c.id);
  document.body.classList.add('ws');
  const dk = desk(c.id);
  let readers = [], active = null;
  const thumbs = [];
  const rail = el('nav', {class:'rail', 'aria-label':'Listy spisu'});
  const readersEl = el('div', {class:'readers'});
  const tasksEl = el('div');
  const notes = el('textarea', {id:'notes-' + c.id, 'aria-label':'Poznámky k případu', placeholder:'Časová osa, kdo kde byl, co nesedí… Ukládá se samo.'});
  notes.value = dk.notes;
  notes.addEventListener('input', () => { dk.notes = notes.value; save(); });
  const notesEl = el('div', {class:'notes'}, el('h3', {style:'margin-bottom:.6rem'}, 'Poznámky'), notes, el('p', null, 'Zůstávají jen v tomto prohlížeči.'));
  const panel = el('aside', {class:'panel', 'aria-label':'Úkoly a poznámky'});
  const deskEl = el('div', {class:'desk'}, rail, readersEl, panel);
  const prog = el('span');

  const ctl = {
    activate(r){ active = r; readers.forEach(x => x.node.classList.toggle('active', x === r)); markRail(); },
    changed(r){ if (r === active) markRail(); },
    showGrid(){ deskEl.classList.remove('reading'); },
    setSplit(on){ dk.split = on; save(); buildReaders(); splitBtn.setAttribute('aria-pressed', on); },
  };
  function markRail(){
    const i = active ? active.cur : -1;
    thumbs.forEach((b, k) => { b.classList.toggle('cur', k === i); b.setAttribute('aria-current', k === i ? 'true' : 'false'); });
    if (thumbs[i] && !narrow() && !rail.matches(':hover')) thumbs[i].scrollIntoView({block:'nearest'});
  }
  function open(i){
    if (narrow()) deskEl.classList.add('reading');
    (active || readers[0]).goTo(i, !narrow());
  }
  function buildRail(){
    thumbs.length = 0;
    const item = i => {
      const star = el('button', {class:'icon star', type:'button', 'aria-pressed': dk.pins.includes(i) ? 'true' : 'false', 'aria-label':'Připnout list ' + (i + 1), title:'Připnout'}, '★');
      star.addEventListener('click', e => { e.stopPropagation(); const k = dk.pins.indexOf(i); if (k < 0) dk.pins.push(i); else dk.pins.splice(k, 1); dk.pins.sort((a, b) => a - b); save(); buildRail(); markRail(); });
      const b = el('div', {class:'th', role:'button', tabindex:'0', title:'List ' + (i + 1) + ' · ' + c.titles[i]},
        mini(c.id, i, 'mini'), el('span', {class:'lbl'}, el('span', {class:'mono'}, 'List ' + (i + 1)), c.titles[i]), star);
      b.addEventListener('click', () => open(i));
      b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(i); } });
      return b;
    };
    const all = c.titles.map((_, i) => { const b = item(i); thumbs[i] = b; return b; });
    rail.replaceChildren(...[
      dk.pins.length ? el('h4', null, 'Připnuté') : null,
      dk.pins.length ? el('div', {class:'thumbs'}, dk.pins.map(item)) : null,
      el('h4', null, 'Celý spis · ' + c.sheets + ' listů'),
      el('div', {class:'thumbs'}, all)].filter(Boolean));
  }
  function buildReaders(){
    readers = (dk.split ? [0, 1] : [0]).map(n => makeReader(c, n, ctl));
    readersEl.className = 'readers' + (dk.split ? ' two' : '');
    readersEl.replaceChildren(...readers.map(r => r.node));
    ctl.activate(readers[readers.length - 1]);
    requestAnimationFrame(() => readers.forEach(r => r.start()));
  }
  function buildPanel(){
    deskEl.classList.toggle('nopanel', !dk.panel && !narrow());
    panel.hidden = !narrow() && !dk.panel;
    panel.replaceChildren(dk.panel === 'poznamky' && !narrow() ? notesEl : tasksEl);
    segT.setAttribute('aria-pressed', dk.panel === 'ukoly'); segN.setAttribute('aria-pressed', dk.panel === 'poznamky');
  }
  function setView(v){ // phone only
    deskEl.dataset.view = v;
    if (v === 'poznamky') panel.replaceChildren(notesEl); else if (v === 'ukoly') panel.replaceChildren(tasksEl);
    navBtns.forEach(b => b.setAttribute('aria-current', b.dataset.v === v ? 'page' : 'false'));
    history.replaceState(null, '', '#' + c.id + (v === 'spis' ? '-spis' : ''));
  }
  const drawer = matchMedia('(max-width: 1180px)').matches;
  if (drawer) dk.panel = null;
  const togglePanel = p => { dk.panel = dk.panel === p ? null : p; save(); buildPanel(); readers.forEach(r => r.fit()); };
  const segT = el('button', {type:'button', onclick: () => togglePanel('ukoly')}, 'Úkoly');
  const segN = el('button', {type:'button', onclick: () => togglePanel('poznamky')}, 'Poznámky');
  const splitBtn = el('button', {class:'icon', type:'button', title:'Dva listy vedle sebe', 'aria-label':'Dva listy vedle sebe', 'aria-pressed': dk.split ? 'true' : 'false', onclick: () => ctl.setSplit(!dk.split)}, '◫');
  const navBtns = [['spis', '▤', 'Spis'], ['ukoly', '✓', 'Úkoly'], ['poznamky', '✎', 'Poznámky']].map(([v, ic, t]) => el('button', {type:'button', 'data-v':v, onclick: () => setView(v)}, el('b', {'aria-hidden':'true'}, ic), t));
  const phoneSplit = el('button', {class:'icon picker', type:'button', title:'Dva listy nad sebou', 'aria-label':'Dva listy nad sebou', onclick: () => ctl.setSplit(!dk.split)}, '◫');

  app.replaceChildren(el('div', {class:'wsroot'},
    el('header', {class:'topbar'},
      el('a', {class:'icon', href:'#', title:'Všechny případy', 'aria-label':'Všechny případy'}, '‹'),
      el('div', {class:'t'}, el('h1', null, c.title), el('span', null, 'Případ ' + c.no + ' · ' + c.place), el('span', null, prog)),
      el('div', {class:'tools'}, splitBtn, el('div', {class:'seg', role:'group', 'aria-label':'Postranní panel'}, segT, segN)),
      phoneSplit),
    deskEl,
    el('nav', {class:'nav', 'aria-label':'Části případu'}, navBtns)));

  ws = {c, renderTasks(justSolved){
    prog.textContent = progressText(c, true);
    tasksEl.replaceChildren(...tasksView(c, justSolved));
    if (justSolved) { const n = document.getElementById('task-' + justSolved); if (n) n.scrollIntoView({block:'start', behavior: reduced() ? 'auto' : 'smooth'}); }
  }, fit(){ readers.forEach(r => r.fit()); buildPanel(); }};
  buildRail(); buildPanel(); ws.renderTasks(); buildReaders();
  setView(view);
  document.fonts && document.fonts.ready.then(() => readers.forEach(r => r.start()));
}

function tasksView(c, justSolved){
  const kids = [
    el('p', {class:'intro'}, c.intro),
    el('div', {class:'facts'}, el('span', null, 'Obtížnost', meter(c.diff)), el('span', null, el('b', null, c.time))),
    c.tasks.map((t, i) => renderTask(c, t, i, justSolved === t.id))
  ];
  const sc = caseScore(c);
  if (sc.done === c.tasks.length) {
    const pct = Math.round(100 * sc.got / sc.max);
    let epi = '';
    try { epi = dec(c.epilog, c.id + '#' + c.tasks.map(t => ts(c.id, t.id).ans).join('|')); } catch (e) {}
    kids.push(el('section', {class:'closing'},
      el('h3', null, 'Případ uzavřen'),
      el('div', {class:'score'}, sc.got + ' z ' + sc.max + ' bodů'),
      el('p', null, 'Hodnost: ' + rank(pct)),
      el('p', {style:'font-style:italic'}, epi)));
  }
  const reset = el('button', {class:'btn danger', type:'button'}, 'Začít případ znovu');
  let armed = false;
  reset.addEventListener('click', () => {
    if (!armed) { armed = true; reset.textContent = 'Smaže postup, piny i poznámky. Klepni znovu.'; return; }
    delete state[c.id]; save(); workspace(c, 'ukoly');
  });
  kids.push(el('div', {class:'foot'}, reset), el('p', {class:'rules'}, 'Za nápovědu −2 body, za špatnou odpověď −3. U každé odpovědi vyber i list, který ji dokazuje.'));
  return kids.flat();
}

// Called by renderTask after a correct answer: refresh only the task list, keep the readers where they are.
function renderCase(c, justSolved){ if (ws && ws.c === c) ws.renderTasks(justSolved); else workspace(c, 'ukoly'); }

function route(){
  const id = (location.hash || '').replace(/^#/, '');
  const spis = /-spis$/.test(id);
  const c = CASES.find(x => x.id === id.replace(/-spis$/, ''));
  ws = null;
  if (c) workspace(c, spis ? 'spis' : 'ukoly');
  else { home(); window.scrollTo(0, 0); }
}
let rz = 0;
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (ws) ws.fit(); }, 120); });
window.addEventListener('hashchange', route);
route();
</script>
