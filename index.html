url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.012 .04' numOctaves='2' seed='7'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .35  0 0 0 0 .28  0 0 0 .35 0'/><\/filter><rect width='100%' height='100%' filter='url(%23f)'/><\/svg>\"),radial-gradient(ellipse at 50% 45%,transparent 62%,rgba(90,70,40,0.134) 100%);\n  background-size:220px 220px,600px 600px,100% 100%}\n@media print{.page::before{opacity:.35}}\n", "html": "\n<section class=\"page cover nofoot\"><div class=\"top\"><div style=\"font:400 13pt 'Bebas Neue';letter-spacing:.3em;color:#e0562a\">PŘÍPAD Č. 4<\/div><div style=\"font:10pt 'Work Sans';margin-top:2mm\">Divadlo U Kamenného mostu · Praha 1 · sobota 18. listopadu 1967<\/div><\/div>\n<h1>MAŠKARÁDA<\/h1>\n<svg viewBox=\"0 0 400 220\" style=\"width:100%;margin-top:6mm\"><g fill=\"#1c1a18\"><path d=\"M40 60 q80-50 160 0 q-10 50-80 50 q-70 0-80-50z\"/><path d=\"M200 60 q80-50 160 0 q-10 50-80 50 q-70 0-80-50z\"/><\/g><g fill=\"#e0562a\"><ellipse cx=\"120\" cy=\"72\" rx=\"26\" ry=\"13\"/><ellipse cx=\"280\" cy=\"72\" rx=\"26\" ry=\"13\"/><\/g><path d=\"M200 60 v130\" stroke=\"#1c1a18\" stroke-width=\"4\"/><text x=\"200\" y=\"215\" text-anchor=\"middle\" font-family=\"Bebas Neue\" font-size=\"20\" letter-spacing=\"6\" fill=\"#1c1a18\">ŠEST MASEK A ANI JEDNA TVÁŘ<\/text><\/svg>\n<div class=\"meta\" style=\"margin-top:auto;padding-bottom:14mm\">Spis obsahuje 21 listů · obtížnost vysoká · asi 2,5–3 h · připravte si tužku a papír na tabulku<\/div><div style=\"position:absolute;right:14mm;transform:rotate(3deg);top:16mm;width:62mm;padding:5mm 5mm 4mm;background:#fbe88a;color:#1d2f6b;font:500 15pt/1.15 Caveat,cursive;box-shadow:0 3px 8px rgba(0,0,0,.35);z-index:60;text-align:left\">Praha, 1967. Advokát tehdy věřil své klientce víc než Bezpečnosti. Spis mi dal jeho vnuk.<div style=\"text-align:right;margin-top:2mm\">K. D.<\/div><\/div><\/section>\n<section class=\"page \"><div style=\"border-bottom:1px solid #1c1a18;padding-bottom:2mm;margin-bottom:6mm;display:flex;justify-content:space-between;align-items:flex-end\"><div style=\"font:400 20pt 'Bebas Neue';letter-spacing:.05em\">JUDr. ZDENĚK HOLAN — ADVOKÁT<\/div><div class=\"sm\" style=\"text-align:right\">Advokátní poradna č. 4, Praha 1, Národní 16<br>telefon 24 66 18<\/div><\/div>\n<p style=\"text-align:right\">V Praze dne 27. listopadu 1967<\/p>\n<p>Vážená paní, vážený pane,<\/p>\n<p>zastupuji herečku Martu Lindovou, která je od 20. listopadu ve vazbě, obviněná z vraždy svého bývalého manžela, ředitele a režiséra Bohumila Kavana.<\/p>\n<p>Kavan byl zastřelen ve své ředitelně během premiéry hry <i>Maškaráda<\/i>, v sobotu 18. listopadu. Tělo nalezla asistentka režie o přestávce ve 21.36. Bezpečnost si to sestavila jednoduše: paní Lindová měla motiv (Kavan jí odpoledne oznámil, že roli hraběnky příští sezónu dostane mladší kolegyně), ve druhém jednání byla několik minut mimo jeviště, v kulise, odkud vedou schody k ředitelně, a pod Kavanovým stolem ležela její rukavice.<\/p>\n<p>Moje klientka tvrdí, že je nevinná. Věřím jí. Ale věřit u soudu nestačí.<\/p>\n<p>Přikládám opisy celého spisu, které jsem jako obhájce získal, a další listiny, které jsem sehnal sám. Prosím Vás o odpovědi na tři otázky:<\/p>\n<ol style=\"margin:2mm 0 3mm 6mm\">\n<li><b>Úkol A — Kdy přesně padl smrtící výstřel?<\/b> Na minutu, nejlépe na sekundu.<\/li>\n<li><b>Úkol B — Kdo nemohl střílet?<\/b> Určete, kde byl v tom okamžiku každý z lidí v divadle. Kdo zbývá?<\/li>\n<li><b>Úkol C — Kdo zastřelil Bohumila Kavana a proč?<\/b><\/li>\n<\/ol>\n<p style=\"margin-top:4mm\">S úctou<\/p>\n<p style=\"font:24pt 'Damion',cursive;color:#22306b;margin:0\">Holan<\/p>\n<p class=\"sm\">JUDr. Zdeněk Holan, obhájce<\/p>\n<div class=\"box\" style=\"margin-top:6mm\"><b>Jak postupovat.<\/b> Tento případ se odehrává uprostřed představení. Divadlo má svá pravidla: kdo je na jevišti, je vidět; kdo je v kulise, je slyšet; a všechno se řídí scénářem, zápisem inspicienta a — tentokrát — i záznamem rozhlasu. Nejvíc pomůže sestavit si přehled, <b>kdo byl kde v každé minutě 3. obrazu<\/b> (tabulka: osoby × čas). Úkoly řešte popořadě; odpověď vždy napište na papír a teprve pak otevřete obálku se stejným písmenem.<\/div><\/section>\n<section class=\"page \"><div class=\"num\">3<\/div><div class=\"prog\">\n<div style=\"font:400 12pt 'Bebas Neue';letter-spacing:.3em;color:#d9cbb2\">DIVADLO U KAMENNÉHO MOSTU · SEZÓNA 1967/68<\/div>\n<h2>KAREL FIALA: MAŠKARÁDA<\/h2>\n<div style=\"font-style:italic;color:#d9cbb2\">Hra o třech jednáních. Světová premiéra 18. listopadu 1967.<\/div>\n<div style=\"font-size:9pt;margin-top:2mm\">Režie: <b>Bohumil Kavan<\/b> · Dramaturgie: <b>Karel Fiala<\/b> · Výprava: Jitka Malá · Hudba: Ladislav Šrom · Světla: Zdeněk Moravec<\/div>\n<div class=\"cast\">\n<span>Hrabě Bedřich<\/span><span>JIŘÍ STARÝ<\/span>\n<span>Hraběnka Klára, jeho žena<\/span><span>MARTA LINDOVÁ<\/span>\n<span>Augustin, komorník<\/span><span>LEOŠ KUBÁT<\/span>\n<span>Černá maska (němá role)<\/span><span>OTA PELC<\/span>\n<span>Julie, schovanka (1. a 3. jednání)<\/span><span>ELIŠKA VRÁNOVÁ<\/span>\n<span>Hosté na plese (6 domin)<\/span><span>posluchači DAMU<\/span>\n<\/div>\n<div style=\"font-size:9pt;margin-top:4mm\">Inspicient: Rudolf Bém · Rekvizitář: František Hudec · Garderobiérka: Věra Šimková · Asistentka režie: Jana Kučerová<\/div>\n<div style=\"font-size:9pt\">Začátek v 19.30 · přestávky po 1. a 2. jednání · konec asi ve 22.40<\/div>\n<\/div>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:6mm;margin-top:6mm;font-family:'Libre Baskerville';font-size:9.2pt;line-height:1.55\">\n<div><h3 class=\"s\" style=\"margin-top:0\">Jak vznikala Maškaráda<\/h3><p>„Hru jsem napsal loni v létě v Krkonoších, za deštivých dní, kdy se nedalo jít ven. Chtěl jsem psát o lidech, kteří nosí masky i doma. Bohumil Kavan ji četl jako první a hned věděl, že ji chce režírovat.“<\/p><p style=\"text-align:right;font-style:italic\">— Karel Fiala<\/p><\/div>\n<div><h3 class=\"s\" style=\"margin-top:0\">Z obsahu<\/h3><p><b>1. jednání:<\/b> Hrabě chystá ples na počest hraběnčiných narozenin. <b>2. jednání:<\/b> Na plese se objevuje neznámá Černá maska, která nebyla na seznamu hostů. Hrabě začne podezírat svou ženu. <b>3. jednání:<\/b> Masky padají.<\/p><p class=\"sm\" style=\"font-family:'Work Sans'\">Ve 2. jednání zazní výstřel z jevištní pistole. Prosíme diváky se slabšími nervy o pochopení.<\/p><\/div>\n<\/div><\/section>\n<section class=\"page \"><div class=\"num\">4<\/div><div class=\"tt\">PLÁNEK DIVADLA<\/div><div class=\"ts\">schematicky, bez měřítka — zhotoveno VB 19. 11. 1967<\/div><svg class=\"plan4\" viewBox=\"0 0 660 560\" style=\"width:100%;font-family:'Work Sans',sans-serif\" xmlns=\"http://www.w3.org/2000/svg\"><style>.plan4 text{paint-order:stroke;stroke:#fffdf7;stroke-width:2.6px;stroke-linejoin:round} .plan4 .n{stroke:none}<\/style><defs><pattern id=\"hw4\" width=\"4\" height=\"4\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(45)\"><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"4\" stroke=\"#1c1a18\" stroke-width=\"0.5\"/><\/pattern><\/defs>\n<text x=\"10\" y=\"18\" class=\"n\" font-family=\"Bebas Neue\" font-size=\"20\" fill=\"#e0562a\">PŘÍZEMÍ<\/text>\n<rect x=\"10\" y=\"25\" width=\"640\" height=\"300\" fill=\"#fffdf7\" stroke=\"#1c1a18\" stroke-width=\"6\"/>\n\n<rect x=\"10\" y=\"215\" width=\"640\" height=\"110\" fill=\"#efe6d3\" stroke=\"#1c1a18\"/>\n<g fill=\"none\" stroke=\"#bfae8d\" stroke-width=\"1.1\"><path d=\"M130 226 Q330 246 530 226\"/><path d=\"M126 233 Q330 255 534 233\"/><path d=\"M122 240 Q330 264 538 240\"/><path d=\"M118 247 Q330 273 542 247\"/><path d=\"M114 254 Q330 282 546 254\"/><path d=\"M110 261 Q330 291 550 261\"/><path d=\"M106 268 Q330 300 554 268\"/><path d=\"M102 275 Q330 309 558 275\"/><\/g><path d=\"M330 238 V292\" stroke=\"#efe6d3\" stroke-width=\"10\"/><path d=\"M215 215 Q340 236 465 215\" fill=\"#e2d6bd\" strok stroke-width=\".8\"/><path d=\"M0 -7 L3.15 4.5 L0 1.8Z\" fill=\"#1c1a18\"/><path d=\"M0 -7 L-3.15 4.5 L0 1.8Z\" fill=\"none\" stroke=\"#1c1a18\" stroke-width=\".8\"/><text y=\"-13\" text-anchor=\"middle\" font-size=\"10\" font-weight=\"700\" fill=\"#1c1a18\">S<\/text><\/g>\n<\/svg><p class=\"sm muted\">Strany L a P se v tomto divadle určují z pohledu diváka (hlediště je na plánku dole). Odposlech = reproduktor, kterým se do šaten a ředitelny přenáší zvuk z jeviště. Je ve všech šatnách i v ředitelně. Zadní schody vedou z přízemí (u kostymérny a železných dveří) přímo do chodby v 1. patře.<\/p><\/section>\n<section class=\"page \"><div class=\"num\">5<\/div><div class=\"tt\">INSPICIENTSKÁ KNIHA — VÝŇATEK<\/div><div class=\"ts\">Karel Fiala: Maškaráda, 2. jednání, s. 47–48. Červeně: ruční značky inspicienta (Q = pokyn pro světla, zvuk, nástupy).<\/div><div class=\"margin\"><div class=\"script\"><p class=\"dir\"><span class=\"cue\">Q41<\/span><b>2. JEDNÁNÍ, 3. OBRAZ — PLES.<\/b> Velký sál. Hudba: valčík. Na scéně Hrabě, Hraběnka, Komorník, Černá maska a šest Hostů v černých dominech s bílými škraboškami. Hosté tančí po celý obraz, neodcházejí.<\/p><p><span class=\"sp\">HRABĚ:<\/span> Podívejte se na ně, Augustine. Šest masek a ani jedna tvář.<\/p><p><span class=\"sp\">KOMORNÍK:<\/span> Na plese, pane hrabě, má tvář jen ten, kdo nemá co skrývat.<\/p><p><span class=\"sp\">HRABĚNKA:<\/span> <i>(k Černé masce)<\/i> Tančíte dobře, pane. Až příliš dobře na cizince.<\/p><p class=\"dir\">Černá maska se ukloní. Tančí s Hraběnkou.<\/p><p><span class=\"sp\">HRABĚ:<\/span> Komu patří ta černá maska, Augustine?<\/p><p><span class=\"sp\">KOMORNÍK:<\/span> Nevím, pane hrabě. Nebyl na seznamu.<\/p><p><span class=\"sp\">HRABĚNKA:<\/span> <i>(pustí Masku)<\/i> Je mi chladno. Půjdu si pro rukavice.<\/p><p class=\"dir\"><span class=\"cue\">Q42<\/span>Hraběnka odchází VLEVO.<\/p><p class=\"dir\">Černá maska chvíli hledí za ní, pak odchází VPRAVO.<\/p><p><span class=\"sp\">HRABĚ:<\/span> Viděl jste to? Ona vlevo. On vpravo. Jako by se domluvili.<\/p><p><span class=\"sp\">KOMORNÍK:<\/span> Pane hrabě, chodba za sálem spojuje obě křídla…<\/p><p><span class=\"sp\">HRABĚ:<\/span> Tím hůř! <i>(vytáhne pistoli)<\/i> Ať si každý pamatuje, že na tomto plese se nehraje falešně.<\/p><p><span class=\"sp\">KOMORNÍK:<\/span> Pane hrabě, ne!<\/p><p><span class=\"sp\">HRABĚ:<\/span> <i>(míří do levé kulisy)<\/i> Madam! Vaše rukavice!<\/p><p class=\"dir\"><span class=\"cue\">Q43<\/span>VÝSTŘEL do levé kulisy (jevištní pistole, slepý náboj). Hosté vykřiknou.<\/p><p class=\"dir\"><span class=\"cue\">Q44<\/span>TMA. Konec 3. obrazu. Hosté ve tmě odcházejí VPRAVO. Přestavba 60 vteřin.<\/p><p class=\"dir\"><span class=\"cue\">Q45<\/span><b>4. OBRAZ — SALONEK.<\/b> Světlo. Hrabě sám. Hraběnka vstupuje ZLEVA, v ruce rukavice.<\/p><p><span class=\"sp\">HRABĚNKA:<\/span> Střílíte po stínech, Bedřichu?<\/p><\/div><\/div><div class=\"box\">VLEVO / VPRAVO = v tomto divadle vždy z pohledu diváka v hledišti. Levá kulisa sousedí se schody L, pravá kulisa se schody P (viz plánek). Obě kulisy spojuje zadní chodba za horizontem. Všechny pokyny Q (světla, tma, zvuk) dává inspicient osobně tlačítky na svém pultu.<\/div><\/section>\n<section class=\"page \"><div class=\"num\">6<\/div><div style=\"display:flex;justify-content:space-between;border-bottom:2px solid #1f6f78;padding-bottom:2mm;margin-bottom:3mm\"><div><b style=\"font:400 16pt 'Bebas Neue';color:#1f6f78;letter-spacing:.05em\">ČESKOSLOVENSKÝ ROZHLAS PRAHA<\/b><br><span class=\"sm\">Redakce divadelního vysílání · přepis záznamu<\/span><\/div><div class=\"sm\" style=\"text-align:right\">Záznam premiéry pro pořad Divadelní vlna<br>pásek č. 3, strana A · zvukař: Ivan Žák<\/div><\/div>\n<div class=\"radio\"><div class=\"r\"><span>21:08:05<\/span><span>Začátek 3. obrazu. Valčík (orchestr ze záznamu).<\/span><\/div><div class=\"r\"><span>21:08:40<\/span><span><b>HRABĚ:<\/b> Podívejte se na ně, Augustine. Šest masek a ani jedna tvář.<\/span><\/div><div class=\"r\"><span>21:08:52<\/span><span><b>KOMORNÍK:<\/b> Na plese, pane hrabě, má tvář jen ten, kdo nemá co skrývat.<\/span><\/div><div class=\"r\"><span>21:09:30<\/span><span><b>HRABĚNKA:<\/b> Tančíte dobře, pane. Až příliš dobře na cizince.<\/span><\/div><div class=\"r\"><span>21:09:38–21:11:40<\/span><span>valčík, tanec (bez replik). Smích v hledišti.<\/span><\/div><div class=\"r\"><span>21:11:02<\/span><span>(v pozadí slabě bzučák — pozn. zvukaře: zřejmě telefon u pultu inspicienta)<\/span><\/div><div class=\"r\"><span>21:11:45<\/span><span><b>HRABĚ:<\/b> Komu patří ta černá maska, Augustine?<\/span><\/div><div class=\"r\"><span>21:11:51<\/span><span><b>KOMORNÍK:<\/b> Nevím, pane hrabě. Nebyl na seznamu.<\/span><\/div><div class=\"r\"><span>21:12:35<\/span><span><b>HRABĚNKA:<\/b> Je mi chladno. Půjdu si pro rukavice.<\/span><\/div><div class=\"r\"><span>21:12:40<\/span><span>kroky — odchod (hudba tišší)<\/span><\/div><div class=\"r\"><span>21:13:20<\/span><span>kroky — odchod (pozn. zvukaře: druhý odchod, na opačnou stranu)<\/span><\/div><div class=\"r\"><span>21:13:28<\/span><span><b>HRABĚ:<\/b> Viděl jste to? Ona vlevo. On vpravo. Jako by se domluvili.<\/span><\/div><div class=\"r\"><span>21:13:40<\/span><span><b>KOMORNÍK:<\/b> Pane hrabě, chodba za sálem spojuje obě křídla…<\/span><\/div><div class=\"r\"><span>21:13:47<\/span><span><b>HRABĚ:<\/b> Tím hůř! … Ať si každý pamatuje, že na tomto plese se nehraje falešně.<\/span><\/div><div class=\"r\"><span>21:14:20<\/span><span><b>KOMORNÍK:<\/b> Pane hrabě, ne!<\/span><\/div><div class=\"r\"><span>21:14:26<\/span><span><b>HRABĚ:<\/b> Madam! Vaše rukavice!<\/span><\/div><div class=\"r\"><span>21:14:31<\/span><span>VÝSTŘEL. Výkřiky hostů. <b>Pozn. zvukaře: výstřel zní zdvojeně. Na zkouškách to tak neznělo.<\/b><\/span><\/div><div class=\"r\"><span>21:14:35<\/span><span>ticho (tma, přestavba), šoupání kroků<\/span><\/div><div class=\"r\"><span>21:15:40<\/span><span>Začátek 4. obrazu.<\/span><\/div><div class=\"r\"><span>21:15:46<\/span><span><b>HRABĚNKA:<\/b> Střílíte po stínech, Bedřichu?<\/span><\/div><div class=\"r\"><span>21:30:10<\/span><span>Konec 2. jednání. Potlesk.<\/span><\/div><\/div>\n<div class=\"box\">Časy podle hodin přenosového vozu Čs. rozhlasu, seřízených na rádiový časový signál ve 21:00:00. Mikrofony: dva nad jevištěm, jeden v orchestřišti.<\/div><\/section>\n<section class=\"page \"><div class=\"num\">7<\/div><div class=\"tt\">ZÁPIS INSPICIENTA — 18. 11. 1967<\/div><div class=\"ts\">vedl Rudolf Bém u inspicientského pultu v levé kulise — opis z knihy představení<\/div>\n<div class=\"log\"><div>2. jedn. — začátek 20:45 ✓<\/div><div>21:08:00 Q41 ples ✓ (6 domin na sc. — spočítáno)<\/div><div>21:11:00 tel. ŘEDITEL: „ples světlejší, na generálce moc tmavý“ → Moravcovi<\/div><div>21:11:30 Moravec potvrdil, +10 %<\/div><div>21:12:40 Q42 Lindová odchod L — stojí u mě<\/div><div>21:13:20 Pelc odchod P<\/div><div>21:14 Q43 výstřel Starý OK<\/div><div>21:14:35 Q44 tma — přestavba<\/div><div>21:15:40 Q45 4. obr., Lindová nástup L ✓<\/div><div>21:30:10 konec 2. jedn. — přestávka<\/div><div>21:36 Kučerová!!! ŘEDITEL → VB 21:38<\/div><\/div>\n<h3 class=\"s\">Kostýmní listy — 2. jednání (výňatek), výprava Jitka Malá<\/h3>\n<table class=\"t\">\n<tr><th>Kostým<\/th><th>Ks<\/th><th>Nosí<\/th><th>Uložení<\/th><\/tr>\n<tr><td>Domino černé s kapucí, bílá škraboška, černé rukavice<\/td><td>7<\/td><td>6 × Hosté (komparz DAMU), 1 × rezerva<\/td><td>rezerva visí v kostymérně v přízemí (u zadních schodů)<\/td><\/tr>\n<tr><td>Plášť z černého sametu, stříbrná maska přes celý obličej<\/td><td>1<\/td><td>Černá maska — O. Pelc<\/td><td>na herci<\/td><\/tr>\n<tr><td>Plesové šaty bílé, dlouhé bílé rukavice (2 páry — 1. a 4. obraz)<\/td><td>1<\/td><td>Hraběnka — M. Lindová<\/td><td>rukavice pro 4. obraz leží na stolku rekvizit v levé kulise<\/td><\/tr>\n<tr><td>Frak, šerpa, jevištní pistole<\/td><td>1<\/td><td>Hrabě — J. Starý<\/td><td>pistoli vydává rekvizitář<\/td><\/tr>\n<\/table>\n<div class=\"box\">Pozn. VB: Rezervní domino ze stojanu v kostymérně chybělo, když jej garderobiérka po představení hledala. Nalezeno 19. 11. — viz list 17.<\/div><\/section>\n<section class=\"page \"><div class=\"num\">8<\/div><div class=\"vb\"><div><b>VEŘEJNÁ BEZPEČNOST<\/b><span>Obvodní správa Praha 1 — oddělení kriminální služby<\/span><\/div><div style=\"text-align:right\"><span>ČVS: VB-P1-2241/67<\/span><\/div><\/div><div class=\"tt\">ÚŘEDNÍ ZÁZNAM<\/div><div class=\"ts\">o nálezu mrtvoly a prvních úkonech<\/div>\n<div class=\"tw\"><p>Dne 18. 11. 1967 ve 21.38 hod. oznámil telefonicky inspicient Divadla U Kamenného mostu Rudolf BÉM nález mrtvého ředitele divadla Bohumila KAVANA, nar. 1915, v ředitelně v 1. patře. Tělo nalezla ve 21.36 asistentka režie Jana Kučerová, která pro ředitele šla o přestávce.<\/p>\n<p>Poškozený seděl v křesle za psacím stolem, střelné poranění hrudníku. Na podlaze pistole Walther PPK, ráže 7,65 mm, majetek poškozeného (zbrojní průkaz č. 0417/58). Diváci byli vyzváni, aby divadlo opustili, 3. jednání se nehrálo. Většina zaměstnanců a účinkujících byla vyslechnuta do půlnoci.<\/p>\n<p>Dne 20. 11. 1967 byla jako podezřelá zadržena Marta LINDOVÁ, herečka, bývalá manželka poškozeného (rozvod 1964): motiv (odpolední spor o obsazení), pobyt mimo jeviště v době činu v levé kulise u schodů L, nalezená rukavice v ředitelně.<\/p><\/div>\n<h3 class=\"s\">Osoby v divadle během 2. jednání<\/h3>\n<table class=\"t\">\n<tr><td style=\"width:44mm\"><b>Bohumil Kavan<\/b> (52)<\/td><td>ředitel divadla a režisér — poškozený<\/td><\/tr>\n<tr><td><b>Marta Lindová<\/b> (38)<\/td><td>herečka, Hraběnka; bývalá manželka poškozeného<\/td><\/tr>\n<tr><td><b>Jiří Starý<\/b> (45)<\/td><td>herec, Hrabě<\/td><\/tr>\n<tr><td><b>Leoš Kubát<\/b> (58)<\/td><td>herec, Komorník<\/td><\/tr>\n<tr><td><b>Ota Pelc<\/b> (33)<\/td><td>herec, Černá maska; výpověď k 30. 11. (alkohol)<\/td><\/tr>\n<tr><td><b>Eliška Vránová<\/b> (24)<\/td><td>herečka, Julie (ve 2. jednání nehraje)<\/td><\/tr>\n<tr><td><b>Karel Fiala<\/b> (41)<\/td><td>dramaturg divadla a autor hry; sledoval představení z lóže č. 3<\/td><\/tr>\n<tr><td><b>Rudolf Bém<\/b> (60)<\/td><td>inspicient<\/td><\/tr>\n<tr><td><b>František Hudec<\/b> (55)<\/td><td>rekvizitář<\/td><\/tr>\n<tr><td><b>Věra Šimková<\/b> (50)<\/td><td>garderobiérka<\/td><\/tr>\n<tr><td><b>Jana Kučerová<\/b> (27)<\/td><td>asistentka režie a sekretářka ředitele<\/td><\/tr>\n<tr><td><b>Zdeněk Moravec<\/b> (39)<\/td><td>osvětlovač, s pomocníkem Pavlem Krupkou v kabině<\/td><\/tr>\n<tr><td>6 komparzistů<\/td><td>posluchači DAMU, Hosté v dominech<\/td><\/tr>\n<tr><td>Josef Vacek<\/td><td>vrátný, vchod herců; celý večer s ním na vrátnici požární hlídka Zdeněk Pech<\/td><\/tr>\n<tr><td>3 jevištní technici<\/td><td>přestavby; ve 3. obrazu v pravé kulise u F. Hudce<\/td><\/tr>\n<tr><td>dále v hledišti<\/td><td>uvaděčka Marie Holá; kritik Dr. Leo Novák (lóže č. 4); fotoreportér Ivan Brázda (Mladý svět)<\/td><\/tr>\n<\/table>\n<div class=\"sig\"><div><span class=\"s\">Kubíček<\/span>npor. Jaroslav Kubíček<\/div><div><span class=\"s\"><\/span>Praha, 21. 11. 1967<\/div><\/div><\/section>\n<section class=\"page \"><div class=\"num\">9<\/div><div class=\"vb\"><div><b>VEŘEJNÁ BEZPEČNOST<\/b><span>Obvodní správa Praha 1 — oddělení kriminální služby<\/span><\/div><div style=\"text-align:right\"><span>ČVS: VB-P1-2241/67<\/span><\/div><\/div><div class=\"tt\">PITVA, BALISTIKA, OHLEDÁNÍ ŘEDITELNY<\/div><div class=\"ts\">výtah ze zpráv — Ústav soudního lékařství a Kriminalistický ústav VB, 19.–22. 11. 1967<\/div>\n<h3 class=\"s\">Soudní pitva (MUDr. F. Hájek)<\/h3>\n<div class=\"tw\"><p>Střelné poranění hrudníku zepředu, výstřel ze vzdálenosti asi 1 m. Smrt okamžitá. Doba smrti podle posmrtných změn mezi 21.00 a 21.40. Alkohol 0,2 ‰. Toxikologicky v krvi meprobamat v terapeutické koncentraci.<\/p><\/div>\n<h3 class=\"s\">Balistika<\/h3>\n<div class=\"tw\"><p>Střela z těla vypálena z pistole Walther PPK nalezené na místě. V zásobníku chybí 1 náboj. Na zbrani setřené stopy, otisky neupotřebitelné; pachatel zřejmě měl rukavice. Výstřel ze zbraně ráže 7,65 mm v uzavřené místnosti je velmi hlasitý a v sousedních šatnách by byl zřetelně slyšet.<\/p><\/div>\n<h3 class=\"s\">Ohledání ředitelny<\/h3>\n<div class=\"tw\">\n<p>1. Poškozený v křesle čelem ke dveřím. Před ním na stole scénář Maškarády, otevřený na str. 47.<\/p>\n<p>2. Zásuvka psacího stolu, kde podle J. Kučerové poškozený držel pistoli, je zavřená a prázdná. Pistole ležela na podlaze u dveří.<\/p>\n<p>3. Pod stolem dámská bílá kožená rukavice, levá, dlouhá. Patří M. Lindové (1. pár, nošený v 1. obrazu).<\/p>\n<p>4. <b>Reproduktor odposlechu nastaven na maximální hlasitost.<\/b><\/p>\n<p>5. Na stole chybí hnědé desky s nápisem „RYBA“, které tam podle J. Kučerové ležely ještě ve 20.00. V místnosti ani v divadle nenalezeny.<\/p>\n<p>6. Okno zavřené zevnitř. Jiný vstup než dveřmi z chodby v 1. patře není.<\/p>\n<p>7. V popelníku čtyři nedopalky cigaret Start a jeden nedopalek Sparta se stopou rtěnky.<\/p>\n<p>8. V koši roztržený anonymní dopis bez obálky a bez data, psaný strojem: „VÍME O VÁS A O TÉ MLADÉ. PŘESTAŇTE, DOKUD JE ČAS.“ Psací stroj ředitelny (Consul) to není.<\/p>\n<p>9. V horní zásuvce stolu načatá skleněná tuba Andaxin (meprobamat 200 mg), chybějí 3 tablety. Podle J. Kučerové je pan ředitel bral „na nervy“ před každou premiérou.<\/p>\n<\/div><\/section>\n<section class=\"page \"><div class=\"num\">10<\/div><div class=\"vb\"><div><b>VEŘEJNÁ BEZPEČNOST<\/b><span>Obvodní správa Praha 1 — oddělení kriminální služby<\/span><\/div><div style=\"text-align:right\"><span>ČVS: VB-P1-2241/67<\/span><\/div><\/div><h3 class=\"s\">Marta LINDOVÁ, herečka (Hraběnka)<\/h3><p class=\"sm muted\" style=\"margin-top:-1mm\">výslech obviněné, 20. 11. 1967<\/p><div class=\"tw\">\n<p>S Bohumilem jsme rozvedení tři roky. O první přestávce, asi ve 20.30, jsem za ním šla do ředitelny, protože mi odpoledne řekl, že Hraběnku bude příští sezónu hrát Eliška. Pohádali jsme se, křičela jsem, to přiznávám. Rukavice mi tam asi upadla, sundala jsem si je, když jsme se hádali. Vrátila jsem se do šatny ve 20.36.<\/p>\n<p><b>Kde jste byla ve 3. obrazu?<\/b> Odešla jsem vlevo „pro rukavice“, jak píše text, a stála jsem v kulise vedle pana Béma u pultu. Druhý pár rukavic leží na stolku rekvizit, vzala jsem si je. Když Jirka střílel do naší kulisy, chytla jsem pana Béma za rukáv, vždycky se toho lekám. Pak byla tma, minuta přestavby, a nastoupila jsem zleva do 4. obrazu. Nahoru jsem vůbec nešla.<\/p>\n<p><b>Věděla jste o pistoli v ředitelově stole?<\/b> Ne. Nikdy mi žádnou neukázal.<\/p><\/div><h3 class=\"s\">Rudolf BÉM, inspicient<\/h3><p class=\"sm muted\" style=\"margin-top:-1mm\">podání vysvětlení, 18. 11. 1967, 23.10<\/p><div class=\"tw\">\n<p>Celé představení jsem byl u pultu v levé kulise, to je moje místo. Za pultem visí černý závěs, dozadu ke schodům nevidím. Ve 21.11 mi z ředitelny volal pan ředitel, ať je ples světlejší, na generálce byl prý moc tmavý. Přepojil jsem to Moravcovi. Ve 21.12.40 přišla ze scény paní Lindová a stála u mě do svého nástupu ve 21.15.40, ani na krok neodešla. Při výstřelu mě držela za rukáv. Ve tmě jsem ji pořád cítil vedle sebe a ve 4. obrazu nastoupila odsud.<\/p>\n<p><b>Mohla odejít po schodech L?<\/b> Schody L jsou dva metry ode mě. Musela by jít kolem mě. Nešla.<\/p>\n<p><b>Kdo má klíč od železných dveří?<\/b> Pan ředitel, já, pan dramaturg Fiala a jeden je na vrátnici. Můj mám na řetízku u pasu, celý večer.<\/p><\/div><\/section>\n<section class=\"page \"><div class=\"num\">11<\/div><div class=\"vb\"><div><b>VEŘEJNÁ BEZPEČNOST<\/b><span>Obvodní správa Praha 1 — oddělení kriminální služby<\/span><\/div><div style=\"text-align:right\"><span>ČVS: VB-P1-2241/67<\/span><\/div><\/div><h3 class=\"s\">Ota PELC, herec (Černá maska)<\/h3><p class=\"sm muted\" style=\"margin-top:-1mm\">podání vysvětlení, 18. 11. 1967, 22.40<\/p><div class=\"tw\">\n<p>Ano, Kavan mě vyhodil. Od prosince budu bez angažmá. Netvrdím, že ho budu oplakávat. Ve 3. obrazu jsem ve 21.13.20 odešel vpravo a stál jsem v pravé kulise s Frantou Hudcem až do konce obrazu, ve tmě kolem mě proběhli komparzisti. Do 4. obrazu nenastupuju, šel jsem se pak do pánské šatny převléct.<\/p><\/div><h3 class=\"s\">František HUDEC, rekvizitář<\/h3><p class=\"sm muted\" style=\"margin-top:-1mm\">podání vysvětlení, 18. 11. 1967, 22.55<\/p><div class=\"tw\">\n<p>Pistoli jsem Starému dal před 2. jednáním, je to jevištní, na slepé náboje. Ve 3. obrazu jsem stál v pravé kulise. Pelc přišel ve 21.13 a stál u mě, vyhrnul si masku na čelo a dali jsme si spolu cigaretu, i když se to nesmí. Masku si pak zase stáhl. Při výstřelu tam byl, pak byla tma a komparz se nám hrnul kolem. Pelc tam pořád stál, až když se rozsvítilo, odešel nahoru.<\/p><\/div><h3 class=\"s\">Petr ŠAFRÁNEK, posluchač DAMU (Host — domino)<\/h3><p class=\"sm muted\" style=\"margin-top:-1mm\">podání vysvětlení za všech šest komparzistů, 18. 11. 1967, 23.30<\/p><div class=\"tw\">\n<p>Bylo nás šest, tančili jsme celý 3. obraz, nikdo z nás neodešel, to by nás inspicient zabil. Ve tmě po výstřelu jsme odešli vpravo. V pravé kulise stál Pelc ještě v té stříbrné masce, pan Hudec a kulisáci. Pak jsme šli rovnou do šatny komparzu, všech šest, a domina jsme pověsili. Nahoru do patra nesmíme, máme to zakázané.<\/p><\/div><\/section>\n<section class=\"page \"><div class=\"num\">12<\/div><div class=\"vb\"><div><b>VEŘEJNÁ BEZPEČNOST<\/b><span>Obvodní správa Praha 1 — oddělení kriminální služby<\/span><\/div><div style=\"text-align:right\"><span>ČVS: VB-P1-2241/67<\/span><\/div><\/div><h3 class=\"s\">Věra ŠIMKOVÁ, garderobiérka<\/h3><p class=\"sm muted\" style=\"margin-top:-1mm\">podání vysvětlení, 18. 11. 1967, 23.45, doplněno 19. 11.<\/p><div class=\"tw\">\n<p>O první přestávce, asi v půl deváté, jsem z chodby slyšela, jak se v ředitelně hádá paní Lindová s panem ředitelem. Ve 2. jednání jsem od 21.05 do 21.25 seděla v šatně slečny Vránové a šila jí lem na šatech do 3. jednání. Dveře na chodbu byly pootevřené.<\/p>\n<p>Asi tři čtvrtě minuty před tím výstřelem — slyšely jsme z odposlechu komorníka, jak říká „chodba za sálem spojuje obě křídla“ — prošla kolem dveří maska v černém dominu, s kapucí a bílou škraboškou, směrem k ředitelně. Myslela jsem, že je to někdo z komparzu, i když nemají nahoru chodit. Slyšela jsem zaklepání a pana ředitele: „No pojď dál, co je? Vzkaz od Béma?“ Pak v odposlechu zazněl ten výstřel a za chvilku šlo domino zpátky, rychle, směrem k zadním schodům.<\/p>\n<p><b>Slyšela jste ještě něco?<\/b> Ne. Jen ten z odposlechu, a ten byl pořádně hlasitý, mnohem víc než na generálce. Jako by se to rozléhalo celou chodbou. Myslela jsem, že je to celé z reproduktoru.<\/p>\n<p><b>Doplněno 19. 11.:<\/b> Rezervní domino v kostymérně jsem věšela v sobotu v šest večer, to tam viselo. Po představení tam nebylo.<\/p><\/div><h3 class=\"s\">Eliška VRÁNOVÁ, herečka (Julie)<\/h3><p class=\"sm muted\" style=\"margin-top:-1mm\">podání vysvětlení, 18. 11. 1967, 23.55<\/p><div class=\"tw\">\n<p>Ve 2. jednání nehraju. Byla jsem v šatně, paní Šimková mi šila šaty, celou dobu jsme byly spolu. Domino jsem viděla taky, jen záda. Bylo menší než Ota, to vím jistě.<\/p>\n<p><b>Jaký jste měla vztah s ředitelem?<\/b> Bohumil mi slíbil Hraběnku. Byli jsme si blízcí, víc neřeknu. Ještě něco: v šest večer na chodbě před šatnami jsem slyšela, jak říká panu Fialovi: „Po premiéře si promluvíme o autorství, Karle. Před všemi.“<\/p><\/div><\/section>\n<section class=\"page \"><div class=\"num\">13<\/div><div class=\"vb\"><div><b>VEŘEJNÁ BEZPEČNOST<\/b><span>Obvodní správa Praha 1 — oddělení kriminální služby<\/span><\/div><div style=\"text-align:right\"><span>ČVS: VB-P1-2241/67<\/span><\/div><\/div><h3 class=\"s\">Jana KUČEROVÁ, asistentka režie a sekretářka ředitele<\/h3><p class=\"sm muted\" style=\"margin-top:-1mm\">podání vysvětlení, 18. 11. 1967, 22.10, doplněno 21. 11.<\/p><div class=\"tw\">\n<p>Pan ředitel na premiérách nikdy nesedí v hledišti, je moc nervózní. Poslouchá z ředitelny odposlech, potichu, a občas volá inspicientovi. Já sedím vzadu v přízemí a dělám si poznámky. Ve 2. jednání jsem seděla na své sesli celou dobu, uvaděčka mě viděla.<\/p>\n<p>O první přestávce za ním byla paní Lindová, hádali se. Ve 20.38 šel pan ředitel dolů na jeviště za panem Starým. Ve 20.40 přišel do ředitelny pan Fiala a čekal na něj. Já jsem odnášela kávu, takže tam byl asi tři minuty sám. Pan ředitel se vrátil ve 20.43, pan Fiala odešel do lóže.<\/p>\n<p>O druhé přestávce jsem šla pro pana ředitele kvůli kritikům. Ve 21.36 jsem ho našla.<\/p>\n<p><b>Kdo věděl o pistoli v zásuvce?<\/b> Pan ředitel se jí loni na Silvestra chlubil v ředitelně, že je z války. Byli jsme tam já, pan Fiala a pan Bém. Jinak ji nikomu neukazoval.<\/p>\n<p><b>Odposlech?<\/b> Měl ho vždycky skoro ztlumený. Říkal, že ho z hlasitých herců bolí uši. Na maximum ho nikdy nedával.<\/p>\n<p><b>Co bylo v deskách „RYBA“?<\/b> Nevím přesně. Přišly mu v říjnu poštou od nějaké paní Rybové. Byl potom celý den zamyšlený a řekl mi: „Jano, tohle divadlo bude mít po premiéře malý skandál.“<\/p>\n<p><b>Měl pan ředitel s někým spor o peníze?<\/b> S panem Bémem. Pan Bém vede pokladnu zájezdů a pan ředitel v ní minulý týden našel manko, asi osm tisíc. Chtěl to po premiéře řešit.<\/p>\n<p><b>Hádal se ten den pan ředitel ještě s někým?<\/b> S panem Kubátem, odpoledne po zkoušce. Pan Kubát chtěl zůstat v angažmá i po šedesátce a pan ředitel mu řekl, že o tom rozhodne po premiéře. Pan Kubát odcházel bílý jako stěna.<\/p>\n<p><b>Kouří někdo v divadle dýmku?<\/b> Pan Fiala, pan Bém a pan Kubát. Jaký tabák, nevím, ale od všech tří je cítit sladký. Pan ředitel kouřil cigarety.<\/p><\/div><\/section>\n<section class=\"page \"><div class=\"num\">14<\/div><div class=\"vb\"><div><b>VEŘEJNÁ BEZPEČNOST<\/b><span>Obvodní správa Praha 1 — oddělení kriminální služby<\/span><\/div><div style=\"text-align:right\"><span>ČVS: VB-P1-2241/67<\/span><\/div><\/div><h3 class=\"s\">Karel FIALA, dramaturg a autor hry<\/h3><p class=\"sm muted\" style=\"margin-top:-1mm\">podání vysvětlení, 18. 11. 1967, 22.25, doplněno 22. 11.<\/p><div class=\"tw\">\n<p>Premiéru jsem sledoval z lóže číslo 3, jako každý autor. O první přestávce jsem byl za Bohumilem v ředitelně, chtěl jsem mu poděkovat, chvíli jsem na něj čekal. Pak jsem se vrátil do lóže a celé 2. jednání jsem ji neopustil. Bylo mi zima, měl jsem v lóži kabát a klobouk.<\/p>\n<p><b>Máte klíč od železných dveří mezi jevištěm a chodbou k lóžím?<\/b> Mám, jako dramaturg. Ten večer jsem ho nepoužil.<\/p>\n<p><b>Věděl jste o pistoli?<\/b> Bohumil se jí jednou chlubil. Zapomněl jsem na ni.<\/p>\n<p><b>Co jste měl na mysli s autorstvím?<\/b> Nevím, o čem mluvíte. <i>(Po upozornění na výpověď E. Vránové:)<\/i> Bohumil chtěl, abych v programu napsal, že na textu spolupracoval on. Dramaturgická úprava, nic víc.<\/p>\n<p><b>Znal jste Petra Rybu?<\/b> Ano, byl to můj přítel. Dramatik, zemřel v roce 1965. Navštěvoval jsem ho v nemocnici do poslední chvíle. S Maškarádou nemá nic společného.<\/p>\n<p><b>Kouříte?<\/b> Dýmku, jako půl divadla. O přestávkách na chodbě.<\/p><\/div><\/section>\n<section class=\"page \"><div class=\"num\">15<\/div><div class=\"vb\"><div><b>VEŘEJNÁ BEZPEČNOST<\/b><span>Obvodní správa Praha 1 — oddělení kriminální služby<\/span><\/div><div style=\"text-align:right\"><span>ČVS: VB-P1-2241/67<\/span><\/div><\/div><h3 class=\"s\">Dr. Leo NOVÁK, divadelní kritik (Divadelní noviny)<\/h3><p class=\"sm muted\" style=\"margin-top:-1mm\">podání vysvětlení, 19. 11. 1967<\/p><div class=\"tw\">\n<p>Seděl jsem v lóži číslo 4, přesně naproti lóži 3. Celé druhé jednání jsem v lóži 3 viděl postavu — pana Fialu. Měl na hlavě klobouk, což mě, přiznám se, pobouřilo; na premiéře, u vlastní hry! Bylo tam šero, víc než siluetu nerozeznám.<\/p><\/div><h3 class=\"s\">Marie HOLÁ, uvaděčka<\/h3><p class=\"sm muted\" style=\"margin-top:-1mm\">podání vysvětlení, 19. 11. 1967<\/p><div class=\"tw\">\n<p>Sedím u vchodu do přízemí, chodbu k lóžím vidím jen zčásti. Pan Fiala si ten večer neodložil v šatně, kabát a klobouk si vzal do lóže, že je mu zima. Ve 2. jednání jsem slyšela cvaknout dveře lóže 3, to už se zase svítilo, takže těsně po začátku 4. obrazu. Myslela jsem, že se pan Fiala vrací ze záchodu. Odchod jsem nezaznamenala. Paní Kučerová seděla celé jednání vzadu na své sesli.<\/p><\/div><h3 class=\"s\">Josef VACEK, vrátný<\/h3><p class=\"sm muted\" style=\"margin-top:-1mm\">podání vysvětlení, 18. 11. 1967<\/p><div class=\"tw\">\n<p>Ve 2. jednání nikdo vchodem herců nevešel ani nevyšel, mám to v knize. Klíč od železných dveří visí na vrátnici celý večer na háčku, nikdo si ho nebral. Před představením, tak ve tři čtvrtě na osm, se tu ptal nějaký pán v kožené bundě po panu řediteli. Jméno neřekl, že prý počká. Dovnitř jsem ho nepustil, tak zase odešel na ulici.<\/p><\/div><h3 class=\"s\">Zdeněk MORAVEC, osvětlovač, a Jiří STARÝ, herec (Hrabě)<\/h3><p class=\"sm muted\" style=\"margin-top:-1mm\">podání vysvětlení, 18. 11. 1967<\/p><div class=\"tw\">\n<p><b>Moravec:<\/b> S pomocníkem Krupkou jsme celé představení v kabině vzadu v hledišti. Ve 21.11.30 mi Bém přepojil ředitele, ať přidám na plese světlo. Přidal jsem. Ve 21.14.35 se mi od jeho pultu rozsvítila kontrolka na tmu, jako vždycky, a hned jsem stáhl světla.<\/p>\n<p><b>Starý:<\/b> Střílel jsem přesně na repliku, do levé kulisy, jako na zkouškách. Nic zvláštního jsem neslyšel, ta jevištní rána mi vždycky zalehne v uších.<\/p><\/div><\/section>\n<section class=\"page \"><div class=\"num\">16<\/div><div class=\"tt\">FOTOGRAFIE Z PREMIÉRY<\/div><div class=\"ts\">snímek fotoreportéra Ivana Brázdy (časopis Mladý svět), pořízený v okamžiku výstřelu — zajištěno VB 19. 11.<\/div>\n<div style=\"background:#fff;padding:4mm 4mm 10mm;box-shadow:0 2px 8px rgba(0,0,0,.3);transform:rotate(-.8deg)\"><svg viewBox=\"0 0 600 340\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;display:block;filter:grayscale(1) contrast(1.12)\">\n<defs>\n<linearGradient id=\"back\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#1b1b1b\"/><stop offset=\"1\" stop-color=\"#3a3530\"/><\/linearGradient>\n<linearGradient id=\"floor\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#6b6056\"/><stop offset=\"1\" stop-color=\"#2b2724\"/><\/linearGradient>\n<linearGradient id=\"cloak\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\"><stop offset=\"0\" stop-color=\"#2a2a2a\"/><stop offset=\".35\" stop-color=\"#0e0e0e\"/><stop offset=\"1\" stop-color=\"#050505\"/><\/linearGradient>\n<radialGradient id=\"spot\" cx=\"50%\" cy=\"0%\" r=\"100%\"><stop offset=\"0\" stop-color=\"#fffbe6\" stop-opacity=\".42\"/><stop offset=\"1\" stop-color=\"#fffbe6\" stop-opacity=\"0\"/><\/radialGradient>\n<radialGradient id=\"flash\" cx=\"50%\" cy=\"50%\" r=\"50%\"><stop offset=\"0\" stop-color=\"#fff\"/><stop offset=\".25\" stop-color=\"#fff6c8\"/><stop offset=\"1\" stop-color=\"#ffd27a\" stop-opacity=\"0\"/><\/radialGradient>\n<\/defs>\n<rect width=\"600\" height=\"340\" fill=\"url(#back)\"/>\n<g fill=\"#4a443d\" opacity=\".55\"><rect x=\"120\" y=\"40\" width=\"22\" height=\"170\"/><rect x=\"114\" y=\"36\" width=\"34\" height=\"8\"/><rect x=\"215\" y=\"40\" width=\"22\" height=\"170\"/><rect x=\"209\" y=\"36\" width=\"34\" height=\"8\"/><rect x=\"360\" y=\"40\" width=\"22\" height=\"170\"/><rect x=\"354\" y=\"36\" width=\"34\" height=\"8\"/><rect x=\"455\" y=\"40\" width=\"22\" height=\"170\"/><rect x=\"449\" y=\"36\" width=\"34\" height=\"8\"/><rect x=\"540\" y=\"40\" width=\"22\" height=\"170\"/><rect x=\"534\" y=\"36\" width=\"34\" height=\"8\"/><\/g>\n<g opacity=\".6\"><path d=\"M300 0 v26\" stroke=\"#555\" stroke-width=\"2\"/><path d=\"M262 30 q38 22 76 0\" stroke=\"#777\" stroke-width=\"3\" fill=\"none\"/><circle cx=\"262.0\" cy=\"31\" r=\"2.6\" fill=\"#ddd\"/><circle cx=\"271.5\" cy=\"35\" r=\"2.6\" fill=\"#ddd\"/><circle cx=\"281.0\" cy=\"35\" r=\"2.6\" fill=\"#ddd\"/><circle cx=\"290.5\" c )\"/><path d=\"M-22 92 C-16 40 -12 14 -3 2\" stroke=\"#8a8a8a\" stroke-width=\"1.2\" fill=\"none\" opacity=\".6\"/><path d=\"M-11 6 C-12 -10 12 -10 11 6 C8 14 -8 14 -11 6Z\" fill=\"#0d0d0d\"/><path d=\"M-7 3 Q0 -1 7 3 L6 7 Q0 5 -6 7Z\" fill=\"#f2f2f2\"/><circle cx=\"-3.2\" cy=\"4.3\" r=\"1.1\" fill=\"#111\"/><circle cx=\"3.2\" cy=\"4.3\" r=\"1.1\" fill=\"#111\"/><path d=\"M10 22 Q24 6 30 -6\" stroke=\"#121212\" stroke-width=\"6\" stroke-linecap=\"round\" fill=\"none\"/><circle cx=\"30\" cy=\"-7\" r=\"3\" fill=\"#ddd\"/><\/g><g transform=\"translate(470,123) scale(0.96) rotate(3)\"><path d=\"M0 -4 C-13 4 -15 30 -22 92 L22 92 C15 30 13 4 0 -4Z\" fill=\"url(#cloak)\"/><path d=\"M-22 92 C-16 40 -12 14 -3 2\" stroke=\"#8a8a8a\" stroke-width=\"1.2\" fill=\"none\" opacity=\".6\"/><path d=\"M-11 6 C-12 -10 12 -10 11 6 C8 14 -8 14 -11 6Z\" fill=\"#0d0d0d\"/><path d=\"M-7 3 Q0 -1 7 3 L6 7 Q0 5 -6 7Z\" fill=\"#f2f2f2\"/><circle cx=\"-3.2\" cy=\"4.3\" r=\"1.1\" fill=\"#111\"/><circle cx=\"3.2\" cy=\"4.3\" r=\"1.1\" fill=\"#111\"/><\/g>\n<g transform=\"translate(170,112)\">\n <path d=\"M-14 22 L-18 118 H-4 L0 70 L4 118 H18 L14 22Z\" fill=\"#0c0c0c\"/>\n <path d=\"M-15 22 Q0 14 15 22 L16 62 Q0 70 -16 62Z\" fill=\"#141414\"/><path d=\"M-4 22 L0 46 L4 22Z\" fill=\"#eee\"/><path d=\"M-13 30 L13 52\" stroke=\"#9a9a9a\" stroke-width=\"4\"/>\n <circle cx=\"0\" cy=\"6\" r=\"11\" fill=\"#cfc1b2\"/><path d=\"M-11 2 Q0 -12 11 2 Q6 -4 -11 2Z\" fill=\"#2a2a2a\"/>\n <path d=\"M-12 30 L-64 26\" stroke=\"#0c0c0c\" stroke-width=\"9\" stroke-linecap=\"round\"/><path d=\"M-66 22 h-16 v6 h10 v6 h5z\" fill=\"#777\"/>\n <path d=\"M12 30 Q24 48 20 64\" stroke=\"#0c0c0c\" stroke-width=\"8\" stroke-linecap=\"round\" fill=\"none\"/>\n<\/g>\n<circle cx=\"84\" cy=\"138\" r=\"30\" fill=\"url(#flash)\"/><path d=\"M84 138 l-30 -8 l22 6 l-26 6 l26 -2 l-18 14 l24 -12z\" fill=\"#fff\"/>\n<g transform=\"translate(556,128)\">\n <path d=\"M-13 18 L-16 112 H-3 L0 66 L3 112 H16 L13 18Z\" fill=\"#111\"/><path d=\"M-14 18 Q0 11 14 18 L15 56 Q0 62 -15 56Z\" fill=\"#161616\"/><path d=\"M-5 18 L0 50 L5 18Z\" fill=\"#f4f4f4\"/>\n <circle cx=\"0\" cy=\"4\" r=\"10\" fill=\"#cfc1b2\"/><path d=\"M-10 0 Q0 -10 10 0Z\" fill=\"#bbb\"/>\n <path d=\"M14 26 L30 40\" stroke=\"#111\" stroke-width=\"7\" stroke-linecap=\"round\"/><ellipse cx=\"33\" cy=\"42\" rx=\"16\" ry=\"3\" fill=\"#bdbdbd\"/>\n<\/g>\n<rect x=\"0\" y=\"34\" width=\"58\" height=\"230\" fill=\"#0b0b0b\"/><path d=\"M58 34 v230\" stroke=\"#2c2c2c\" stroke-width=\"3\"/>\n<defs><filter id=\"pg1\" x=\"0\" y=\"0\" width=\"100%\" height=\"100%\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"1.4\" numOctaves=\"2\" seed=\"1\"/><feColorMatrix values=\"0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.2 -.35\"/><\/filter><radialGradient id=\"pv1\" cx=\"50%\" cy=\"48%\" r=\"72%\"><stop offset=\"55%\" stop-color=\"#000\" stop-opacity=\"0\"/><stop offset=\"100%\" stop-color=\"#000\" stop-opacity=\"0.61\"/><\/radialGradient><linearGradient id=\"pl1\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#fff\" stop-opacity=\".16\"/><stop offset=\".45\" stop-color=\"#fff\" stop-opacity=\"0\"/><\/linearGradient><\/defs><rect width=\"600\" height=\"340\" fill=\"url(#pl1)\"/><rect width=\"600\" height=\"340\" filter=\"url(#pg1)\" opacity=\"0.35\" style=\"mix-blend-mode:overlay\"/><rect width=\"600\" height=\"340\" fill=\"url(#pv1)\"/>\n<text x=\"12\" y=\"332\" fill=\"#bbb\" font-family=\"Space Mono\" font-size=\"11\">Mladý svět · I. Brázda · neg. 67/1118-14<\/text><\/svg><\/div>\n<div class=\"tw\" style=\"margin-top:6mm\"><p><b>Ivan BRÁZDA, fotoreportér, podání vysvětlení 19. 11. 1967:<\/b> Stál jsem na kraji orchestřiště. Na generálce jsem si poznamenal, kdy přijde výstřel, a čekal jsem s prstem na spoušti, protože záblesk z pistole dělá skvělou fotku. Zmáčkl jsem přesně v té vteřině. Na fotce je Hrabě s pistolí, vpravo Komorník a vzadu tančí hosté v dominech. Hraběnka ani Černá maska už na jevišti nebyly.<\/p><\/div>\n<\/section>\n<section class=\"page \"><div class=\"num\">17<\/div><div class=\"vb\"><div><b>VEŘEJNÁ BEZPEČNOST<\/b><span>Obvodní správa Praha 1 — oddělení kriminální služby<\/span><\/div><div style=\"text-align:right\"><span>ČVS: VB-P1-2241/67<\/span><\/div><\/div><div class=\"tt\">PROTOKOL O NÁLEZU<\/div><div class=\"ts\">19. 11. 1967, 10.20 hod., přízemí, chodba u zadních schodů<\/div>\n<div class=\"tw\"><p>Při prohlídce budovy byla otevřena hydrantová skříň u zadních schodů, asi dva metry od železných dveří do chodby k lóžím. Za srolovanou hadicí nalezeno:<\/p>\n<p>1. Černé domino s kapucí, velikost 50, s všitým štítkem „MAŠKARÁDA — REZERVA“.<\/p>\n<p>2. Bílá škraboška.<\/p>\n<p>3. Pár černých rukavic. Na pravé rukavici stopy povýstřelových zplodin (dle KÚ VB).<\/p>\n<p>4. V kapse domina drobky tabáku. Domino je cítit sladkou vůní dýmkového tabáku. Dle KÚ VB jde o holandský dýmkový tabák zn. Amphora.<\/p>\n<p>Desky „RYBA“ v hydrantové skříni ani jinde v budově nenalezeny.<\/p><\/div>\n<h3 class=\"s\">Evidence klíčů — železné dveře (jeviště ↔ chodba k lóžím)<\/h3>\n<table class=\"t\"><tr><th>Klíč<\/th><th>Držitel<\/th><th>Stav večer 18. 11.<\/th><\/tr>\n<tr><td>č. 1<\/td><td>ředitel B. Kavan<\/td><td>na svazku v kapse poškozeného<\/td><\/tr>\n<tr><td>č. 2<\/td><td>inspicient R. Bém<\/td><td>na řetízku u pasu, celý večer u pultu v levé kulise<\/td><\/tr>\n<tr><td>č. 3<\/td><td>dramaturg K. Fiala<\/td><td>u držitele<\/td><\/tr>\n<tr><td>č. 4<\/td><td>vrátnice<\/td><td>na háčku, nevypůjčen (kniha vrátnice)<\/td><\/tr><\/table>\n<div class=\"box\">Pozn.: Železné dveře se zevnitř (od jeviště) otevírají klikou bez klíče. Z chodby u lóží jen klíčem. Kdo jde z hlediště za jeviště, potřebuje klíč. Kdo jde z jeviště do hlediště, nepotřebuje. O přestávkách bývají dveře odemčené (hosté chodí za umělci); na začátku každého jednání je inspicient zamyká svým klíčem.<\/div><\/section>\n<section class=\"page \"><div class=\"num\">18<\/div><div class=\"tt\">LISTINY OBHAJOBY<\/div><div class=\"ts\">získáno JUDr. Holanem — koncept dopisu z Kavanova bytu a výpověď vdovy<\/div>\n<div class=\"lett\" style=\"transform:rotate(-.6deg)\"><div class=\"sm muted\" style=\"font-family:'Work Sans'\">Rukou psaný koncept dopisu nalezený na psacím stole v bytě B. Kavana, Praha 2, Lublaňská 8<\/div>\n<div class=\"zey\" style=\"margin-top:2mm\">Vážená paní Rybová,<br>děkuji za rukopis i za dopisy Vašeho muže. Přečetl jsem to dvakrát a věřím Vám. Premiéru už zastavit nemohu, ale po premiéře, na večírku, to řeknu nahlas, před všemi.<br><span style=\"float:right\">B. Kavan, 16/11<\/span><\/div><div style=\"clear:both\"><\/div><\/div>\n<div style=\"margin-top:6mm\"><div class=\"vb\"><div><b>VEŘEJNÁ BEZPEČNOST<\/b><span>Obvodní správa Praha 1 — oddělení kriminální služby<\/span><\/div><div style=\"text-align:right\"><span>ČVS: VB-P1-2241/67<\/span><\/div><\/div><h3 class=\"s\">Anna RYBOVÁ, vdova po dramatikovi Petru Rybovi<\/h3><p class=\"sm muted\" style=\"margin-top:-1mm\">podání vysvětlení, 23. 11. 1967<\/p><div class=\"tw\">\n<p>Můj muž Petr Ryba zemřel v únoru 1965 v nemocnici na Bulovce. Poslední hru, které říkal <i>Karneval<\/i>, dopsal v roce 1964. Pan Fiala, jeho přítel, ho v nemocnici často navštěvoval a nabídl se, že mu doma uschová rukopisy, „aby se neztratily“. Po pohřbu mi je vrátil, ale <i>Karneval<\/i> mezi nimi nebyl. Říkal, že ho Petr asi zničil.<\/p>\n<p>Letos v září jsem na plakátu uviděla Maškarádu a přečetla obsah. Měla jsem doma jen kopii prvního rukopisu, který mi Petr kdysi dal přečíst, a jeho dopisy. Poslala jsem to v říjnu panu Kavanovi do divadla v hnědých deskách a napsala jsem na ně RYBA. Originál rukopisu nemám a kopii jsem poslala jemu. Nechala jsem si jen opis jednoho Petrova dopisu.<\/p><\/div><\/div><\/section>\n<section class=\"page \"><div class=\"num\">19<\/div><div class=\"tt\">DOPIS PETRA RYBY MANŽELCE<\/div><div class=\"ts\">opis pořízený vdovou před odesláním originálu B. Kavanovi — Ryba psal z lázní Poděbrady, srpen 1964<\/div>\n<div class=\"lett\" style=\"background:#fbf7ec;margin-top:4mm\">\n<div class=\"sh\">\n<p style=\"text-align:right\">Poděbrady, 9. srpna 1964<\/p>\n<p>Aničko,<\/p>\n<p>srdce zlobí, ale hlava pracuje. Karneval je skoro hotový. Je to hra o hraběti, který na vlastním plese přestane poznávat vlastní ženu. Nejradši mám scénu, kdy se dívá na tanečníky a říká komorníkovi: <i>„Šest masek a ani jedna tvář.“<\/i> A komorník mu odpoví: <i>„Na plese, pane hrabě, má tvář jen ten, kdo nemá co skrývat.“<\/i><\/p>\n<p>A pak ta rána z pistole do kulisy a tma! A v další scéně přijde hraběnka s rukavicemi a zeptá se ho: <i>„Střílíte po stínech, Bedřichu?“<\/i> Myslím, že to bude to nejlepší, co jsem napsal.<\/p>\n<p>Karel Fiala tu byl na návštěvě, četl jsem mu první dvě jednání. Říkal, že je to moc dobré, ale smutně se u toho tvářil. Asi závidí, chudák, jemu to teď nepíše.<\/p>\n<p>Líbá Tě Tvůj Petr<\/p>\n<\/div><\/div><\/section>\n<section class=\"page news\"><div class=\"num\">20<\/div><div class=\"nm\"><h2>VEČERNÍ PRAHA<\/h2><div><span>Ročník XIII · č. 272<\/span><span>pondělí 20. listopadu 1967<\/span><span>Cena 30 h<\/span><\/div><\/div>\n<h2 class=\"hl\">Výstřel, který nebyl ve scénáři<\/h2>\n<p style=\"font:italic 9.5pt 'Libre Baskerville';margin-bottom:3mm\">Ředitel divadla zastřelen během premiéry. Bezpečnost zadržela známou herečku.<\/p>\n<div class=\"cols\">\n<p>Sobotní premiéra hry Karla Fialy Maškaráda v Divadle U Kamenného mostu skončila tragédií. O přestávce po druhém jednání byl ve své pracovně nalezen mrtvý ředitel divadla a režisér inscenace Bohumil Kavan. Diváci byli požádáni, aby divadlo opustili.<\/p>\n<p>Podle neoficiálních informací byl ředitel zastřelen. Veřejná bezpečnost v pondělí zadržela herečku M. L., bývalou manželku zesnulého, která v inscenaci hraje hlavní roli. Na Správě VB nám odmítli sdělit podrobnosti.<\/p>\n<p>„Je to rána pro celé české divadlo,“ řekl nám dramaturg a autor hry Karel Fiala. „Bohumil měl tu hru rád jako vlastní.“<\/p>\n<div class=\"adv\"><b style=\"font-size:13pt\">TESLA<\/b><br>Televizor Orava — nový model pro Vánoce<\/div>\n<p><b>Z recenze, kterou kritik Dr. Leo Novák napsal po čtvrteční veřejné generálce pro Divadelní noviny:<\/b> „…ples ve druhém jednání je nejsilnějším místem večera. Šest masek tančí, zatímco se hraběti pod rukama rozpadá svět. Dialog je úsporný a přesný…“<\/p>\n<div class=\"adv\"><b>TUZEX<\/b><br>Dárkové poukázky na Vánoce<\/div>\n<p><b>Mlha nad Prahou.<\/b> Hydrometeorologický ústav varuje řidiče před náledím a mlhou v nočních hodinách.<\/p>\n<div class=\"adv\"><b>KINO SVĚTOZOR<\/b><br>Dnes: Ostře sledované vlaky<\/div>\n<\/div><\/section>\n<section class=\"page \"><div class=\"num\">21<\/div><div class=\"tt\">FOTOGRAFIE OSOB<\/div><div class=\"ts\">z divadelního archivu (portréty do programu) a evidence VB<\/div><div class=\"ids\"><figure><svg viewBox=\"0 0 100 125\" xmlns=\"http://www.w3.org/2000/svg\"><defs><radialGradient id=\"bg1\" cx=\"50%\" cy=\"38%\" r=\"75%\"><stop offset=\"0\" stop-color=\"#fff\" stop-opacity=\".45\"/><stop offset=\"1\" stop-color=\"#000\" stop-opacity=\".18\"/><\/radialGradient><radialGradient id=\"sh1\" cx=\"45%\" cy=\"40%\" r=\"65%\"><stop offset=\".55\" stop-color=\"#000\" stop-opacity=\"0\"/><stop offset=\"1\" stop-color=\"#000\" stop-opacity=\".22\"/><\/radialGradient><filter id=\"f1\" color-interpolation-filters=\"sRGB\"><feColorMatrix type=\"matrix\" values=\"0.3 0.59 0.11 0 0  0.3 0.59 0.11 0 0  0.3 0.59 0.11 0 0  0 0 0 1 0\"/><\/filter><\/defs><g filter=\"url(#f1)\"><rect width=\"100\" height=\"125\" fill=\"#d6d3cd\"/><rect width=\"100\" height=\"125\" fill=\"url(#bg1)\"/><path d=\"M4 125 C6 100 22 92 50 91 C78 92 94 100 96 125Z\" fill=\"#2a2a2a\"/><path d=\"M40 91 L50 104 L60 91 L58 125 L42 125Z\" fill=\"#f2efe8\"/><path d=\"M42 96 L50 100 L58 96 L58 104 L50 100 L42 104Z\" fill=\"#111\"/><path d=\"M36 92 L48 112 L44 125 M64 92 L52 112 L56 125\" stroke=\"#000\" stroke-opacity=\".35\" fill=\"none\" stroke-width=\"1.2\"/><path d=\"M43 74 L43 92 C se týká sexuálního násilí. Spis to říká přímo, ale nic nepopisuje. Řeší se v něm, kdo to byl, ne co se stalo.<\/div><div style=\"position:absolute;right:14mm;transform:rotate(3deg);top:16mm;width:62mm;padding:5mm 5mm 4mm;background:#fbe88a;color:#1d2f6b;font:500 15pt/1.15 Caveat,cursive;box-shadow:0 3px 8px rgba(0,0,0,.35);z-index:60;text-align:left\">Poslední a nejtěžší. Spis obhajoby z Olomouce, dostala jsem ho od JUDr. Markové. Prý na něj dodnes nezapomněla.<div style=\"text-align:right;margin-top:2mm\">K. D.<\/div><\/div><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 2<\/div><div class=\"lh\"><div><b>JUDr. Eliška Marková<\/b><br><span class=\"small\">advokátka · Ztracená 14, Olomouc<\/span><\/div><div class=\"small\" style=\"text-align:right\">V Olomouci 16. 3. 2004<\/div><\/div>\n<div class=\"letter\">\n<p>Vážený pane kolego, vážená paní kolegyně,<\/p>\n<p>v pátek 12. března krátce před půlnocí přepadl neznámý muž v Hradebních sadech třiadvacetiletou Kláru Šindelářovou, studentku zdravotní školy, a znásilnil ji. V sobotu dopoledne policie zadržela jejího bývalého přítele Marka Vlka a v pondělí ho soud vzal do vazby. Zastupuji ho. Podala jsem stížnost a krajský soud o ní rozhodne v pátek 19. 3.<\/p>\n<p>Policie má výhrůžné SMS, které Marek Kláře psal, a jeho výpověď, že byl celý večer sám doma. Klára sama říká, že ho podle hlasu nepoznala. Vzorky pro DNA jsou v Kriminalistickém ústavu v Praze a výsledek bude nejdřív za šest týdnů. Soud u vazebního zasedání vzal za své všechno, co ve spisu bylo, a nic vyviňujícího v tom neviděl. Do té doby bude Marek sedět, pokud soudu nepředložíme něco lepšího.<\/p>\n<p>Posílám vám kopie všeho, co jsem ze spisu dostala (docházku, výpis ústředny, závory a příjmovou knihu si na můj návrh vyžádal soud), a výpovědi, které jsem si obstarala sama. Klára souhlasila, abyste spis prošli. Je to statečná mladá žena a chce, aby seděl ten pravý.<\/p>\n<p>Potřebuji od vás tři věci, popořadě:<\/p>\n<p style=\"margin-left:6mm\"><b>A.<\/b> Mohl to udělat Marek? A kdy přesně se to stalo?<br>\n<b>B.<\/b> Jak se pachatel ke Kláře dostal a kdo ten večer věděl, kudy půjde domů?<br>\n<b>C.<\/b> Kdo to byl?<\/p>\n<p>Každou odpověď napište, než otevřete obálku se stejným písmenem. Spis není seřazený podle důležitosti. Je seřazený tak, jak mi ho dali.<\/p>\n<p>S pozdravem<\/p>\n<p class=\"hand\" style=\"font-size:17pt;margin:0\">E. Marková<\/p>\n<\/div><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 3<\/div><div class=\"pcr\"><div><b>POLICIE ČESKÉ REPUBLIKY<\/b><span>Okresní ředitelství Olomouc · Obvodní oddělení Olomouc-střed<\/span><\/div><span>ČTS: ORO-2071/TČ-2004<\/span><\/div>\n<div class=\"pt\">ÚŘEDNÍ ZÁZNAM<\/div><div class=\"ps\">o přijetí oznámení a prvních úkonech · sepsáno 13. 3. 2004 v 12:30<\/div>\n<p>Dne 13. 3. 2004 v <b>00:01<\/b> přijalo operační středisko z mobilního telefonu oznámení <b>Jiřího Dostála<\/b> (52 let, Olomouc, Hradební 3), že v Hradebních sadech u bašty našel mladou ženu, která je v šoku a říká, že ji někdo napadl.<\/p>\n<p>Hlídka OO Olomouc-střed na místě v 00:09, posádka RZP v 00:12. Poškozená <b>Klára Šindelářová<\/b> (nar. 1980, Olomouc, Na Hradbách 7) uvedla, že ji při cestě z tramvaje přepadl neznámý muž a znásilnil ji. Byla převezena k vyšetření. Na místo přivolána výjezdová skupina SKPV.<\/p>\n<p>Oznamovatel Dostál uvedl: <i>„Šel jsem se psem podél hradeb, od nás z Hradební ulice. Pes začal táhnout ke keřům u bašty, tak jsem se podíval. Na hodinkách bylo 23:58, to vím přesně, protože jsem chtěl být doma do půlnoci. Nikoho jsem neviděl ani neslyšel utíkat. Hned jsem jí půjčil bundu a volal. Když jsem vycházel z domu, stálo na Hradební tmavé auto s puštěným motorem. Když jsem se pak vracel s policajty, už tam nebylo.“<\/i> Pozn. hlídky: oznamovatel je kuřák, u sebe měl neotevřenou krabičku Marlboro (celofán neporušený), obut v kožených polobotkách vel. 42.<\/p>\n<p>Poškozená neměla u sebe mobilní telefon, zůstal v práci. Osobní věci (kabelka, peněženka, klíče) u sebe měla, nic jí nebylo odcizeno.<\/p>\n<h3 class=\"s\">Další postup<\/h3>\n<p>Poškozená v nemocnici uvedla, že jí bývalý přítel <b>Marek Vlk<\/b> (nar. 1977) od ledna posílá výhrůžné SMS a že „to mohl být on“. Lustrací zjištěno, že Vlk byl v roce 2001 řešen pro přestupek proti veřejnému pořádku (rvačka před klubem, vyřízeno blokovou pokutou).<\/p>\n<p>Dne 13. 3. 2004 v <b>10:20<\/b> byl Marek Vlk zadržen v místě bydliště (Olomouc, Dobrovského 22) podle § 75 tr. ř. Podle svých slov byl celý večer sám doma.<\/p>\n<p>Biologické stopy z místa a z oděvu poškozené odeslány do Kriminalistického ústavu Praha, žádost o porovnání DNA s Vlkem. Předpokládaná doba zpracování 6–8 týdnů.<\/p>\n<div class=\"sig\"><div><span class=\"s\">Hanák<\/span>zpracoval<\/div><div><span class=\"s\">Kovařík<\/span>velitel směny<\/div><\/div><p class=\"small muted\" style=\"margin-top:4mm\">pprap. Tomáš Hanák · npor. Jan Kovařík<\/p><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 4<\/div><div class=\"pcr\"><div><b>POLICIE ČESKÉ REPUBLIKY<\/b><span>Okresní ředitelství Olomouc · SKPV, 1. oddělení obecné kriminality<\/span><\/div><span>č. j. ORO-2071/TČ-2004<\/span><\/div><div class=\"pt\">PROTOKOL O VÝSLECHU POŠKOZENÉ<\/div><div class=\"ps\">Klára Šindelářová, nar. 1980, studentka VOŠZ, brigádnice na interním příjmu nemocnice · 13. 3. 2004, 14:00–15:10, za přítomnosti psycholožky<\/div><div class=\"rec\">\n<p>V pátek jsem měla odpolední na interním příjmu, od tří do jedenácti. Dodělávala jsem papíry, takže jsem odcházela až asi dvacet minut po jedenácté. Mobil jsem měla vybitý už od večera a nabíječku doma, tak jsem ho nechala ve skříňce, nebylo to poprvé.<\/p>\n<p>V pátek pro mě normálně jezdí brácha, když jede z práce. Tenhle pátek nemohl. Jela jsem čtyřkou a vystoupila jsem U Sadů. Domů na Hradby to mám přes sady asi dvanáct minut.<\/p>\n<p>Šla jsem po hlavní cestě podél hradeb. Kousek za lavičkami u bašty mě někdo chytil zezadu. Jednou rukou mi zacpal pusu a druhou mi zkroutil ruku za záda. Pak mi obě zápěstí držel za zády jednou rukou a táhl mě za keře. Šeptal mi do ucha: „Klárko, buď zticha a nic se ti nestane.“<\/p>\n<p>Měl na hlavě kuklu a na obou rukou kožené rukavice, cítila jsem je na obličeji, studené a hladké. Byl to muž, silnější a vyšší než já. Byl cítit cigaretami. Znásilnil mě. Nevím, jak dlouho to trvalo. Pak utekl, slyšela jsem běh po štěrku směrem k městu. Ležela jsem tam, nevím jak dlouho, než přišel ten pán se psem.<\/p>\n<p class=\"q\">Poznala jste hlas?<\/p><p>Šeptal. Nevím. Mohl to být Marek, je stejně velký. Rozešli jsme se v lednu a od té doby mi píše hrozné věci. Ale jistá si nejsem, a nechci, aby seděl, jestli to nebyl on.<\/p>\n<p class=\"q\">Kdo vám říká Klárko?<\/p><p>Skoro všichni. V práci, doma, ve škole.<\/p>\n<p class=\"q\">Šel za vámi někdo od tramvaje?<\/p><p>Nevím. Neotáčela jsem se. Byla jsem utahaná.<\/p>\n<p class=\"q\">Máte s někým v práci problém?<\/p><p>S doktorem Brázdou. Dělal narážky a jednou mě na chodbě chytil za ruku. V únoru jsem si na něj stěžovala u vrchní sestry. Jinak s nikým. Sanitář Ondra mě v únoru pozval do kina, odmítla jsem, a bral to normálně.<\/p>\n<p class=\"q\">Kdo věděl, že půjdete pěšky přes sady?<\/p><p>Normálně by mě vezl brácha. Že pojedu tramvají, se rozhodlo až večer v práci.<\/p>\n<p class=\"q\">Víte, kolik bylo hodin?<\/p><p>Hodinky nenosím a mobil jsem neměla. Nevím.<\/p><\/div><div class=\"sig\"><div><span class=\"s\">K. Šindelářová<\/span>podpis vyslýchaného<\/div><div><span class=\"s\">Krejčí<\/span>zapsala: nprap. Ivana Krejčí<\/div><\/div><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 5<\/div><div class=\"pt\">SITUAČNÍ PLÁNEK<\/div><div class=\"ps\">zjednodušeno podle plánu města · vyhotovila kancelář JUDr. Markové<\/div><svg class=\"map5\" viewBox=\"0 0 700 560\" style=\"width:100%;height:auto;border:1px solid #9aa3ad;background:#f6f4ef\" font-family=\"IBM Plex Sans\" font-size=\"12\">\n<style>.map5 text{paint-order:stroke;stroke:#f
