<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Detektivní kancelář</title>
<meta name="robots" content="noindex, nofollow">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
/* Layout: an investigator's desk. Home = shelf of case folders with real cover thumbnails.
   Case = one workspace: sheet rail | one or two freely scrolling readers | tasks & notes panel.
   Phone: same pieces behind a bottom bar (Spis / Úkoly / Poznámky). */
:root{
  --bg:#E8ECF0; --panel:#F6F8FA; --card:#FFFFFF; --ink:#121820; --muted:#566271; --line:#D2D9E1;
  --accent:#22508A; --accent-ink:#FFFFFF; --tag:#F0B429; --tag-ink:#2A1F00; --ok:#1C7A4C; --bad:#B42318;
  --shade:rgba(16,28,44,.16); --sheet-bg:#C9D1DA;
  --display:'Bricolage Grotesque','IBM Plex Sans',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,monospace;
  --bar:3.5rem; --nav:3.75rem;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1217; --panel:#131A21; --card:#1A232D; --ink:#E5EAF0; --muted:#94A2B1; --line:#2A3642;
    --accent:#8DB4EA; --accent-ink:#0B1520; --tag:#E3A51B; --tag-ink:#1E1600; --ok:#4CC38A; --bad:#F08378;
    --shade:rgba(0,0,0,.45); --sheet-bg:#0A0E12; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1217; --panel:#131A21; --card:#1A232D; --ink:#E5EAF0; --muted:#94A2B1; --line:#2A3642;
  --accent:#8DB4EA; --accent-ink:#0B1520; --tag:#E3A51B; --tag-ink:#1E1600; --ok:#4CC38A; --bad:#F08378;
  --shade:rgba(0,0,0,.45); --sheet-bg:#0A0E12; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;background:var(--accent);color:var(--accent-ink);border:0;border-radius:.5rem;padding:.65rem 1rem;font-weight:600;min-height:2.75rem;text-decoration:none}
.btn.quiet{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1.5px var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.icon{display:inline-flex;align-items:center;justify-content:center;width:2.5rem;height:2.5rem;border:0;border-radius:.5rem;background:transparent;color:var(--ink);font-size:1.15rem;line-height:1}
.icon:hover{background:var(--line)}
a.icon{text-decoration:none}
.fields{display:grid;gap:1rem}
.icon[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* ---------- home ---------- */
.home{max-width:60rem;margin:0 auto;padding-block:2.5rem 4rem;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.home > header{display:grid;gap:.6rem;margin-bottom:2rem}
.home h1{font-size:clamp(2.2rem,6vw,3.4rem)}
.home .lead{color:var(--muted);max-width:40rem}
.shelf{list-style:none;margin:0;padding:0;display:grid;gap:1rem}
.case{display:grid;grid-template-columns:9.5rem minmax(0,1fr);gap:1.25rem;align-items:start;background:var(--card);border-radius:.9rem;padding:1rem;color:inherit;text-decoration:none;box-shadow:0 1px 2px var(--shade);transition:transform .15s ease, box-shadow .15s ease}
.case:hover{transform:translateY(-2px);box-shadow:0 8px 24px var(--shade)}
.case .cover{width:9.5rem;aspect-ratio:210/297;max-width:100%;overflow:hidden;border-radius:.35rem;background:var(--sheet-bg);box-shadow:0 2px 8px var(--shade)}
.case .info{display:grid;gap:.55rem;min-width:0}
.case .kick{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.85rem}
.case .no{font-family:var(--mono);background:var(--ink);color:var(--bg);border-radius:.3rem;padding:.05rem .45rem;font-size:.8rem}
.case h2{font-size:1.65rem}
.case .intro{color:var(--muted);font-size:.95rem}
.facts{display:flex;flex-wrap:wrap;gap:.4rem 1.2rem;font-size:.85rem;color:var(--muted);align-items:center}
.facts b{color:var(--ink);font-weight:600}
.meter{display:inline-flex;gap:3px;vertical-align:middle;margin-left:.35rem}
.meter i{width:.65rem;height:.65rem;border-radius:2px;background:var(--line)}
.meter i.on{background:var(--tag)}
.prog{display:flex;gap:.35rem;align-items:center;flex-wrap:wrap;font-size:.85rem;color:var(--muted)}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:1.9rem;height:1.6rem;padding:0 .45rem;border-radius:999px;font:500 .78rem var(--mono);box-shadow:inset 0 0 0 1.5px var(--line);color:var(--muted)}
.chip.done{background:var(--ok);color:var(--card);box-shadow:none}
.next{font:600 .75rem var(--body);text-transform:uppercase;letter-spacing:.08em;background:var(--tag);color:var(--tag-ink);border-radius:.3rem;padding:.1rem .45rem}
.home .foot{margin-top:2rem;color:var(--muted);font-size:.9rem;max-width:44rem}
.home .for{font:500 .8rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 .3rem}
.letter{margin-top:2rem;max-width:40rem;padding:1.4rem 1.5rem;background:var(--card);border:1px solid var(--line);border-radius:.8rem;display:grid;gap:.7rem}
.letter h2{margin:0;font-size:1.3rem}.letter .sig{font:600 1.5rem Caveat,cursive}
.letter > div{display:grid;gap:.7rem}.letter .zrow{display:flex;gap:.5rem;flex-wrap:wrap}.letter .zrow input{font:600 1.2rem var(--mono);letter-spacing:.3em;text-transform:uppercase;padding:.5rem .7rem;border:1px solid var(--line);border-radius:.5rem;background:var(--bg);color:var(--ink);width:12ch}.letter .zmsg:empty{display:none}.zpiece{margin-top:1rem;padding:.6rem .8rem;border:1.5px dashed var(--accent);border-radius:.5rem}
.letter .badge{border:2px solid var(--ink);border-radius:.6rem;padding:.8rem 1rem;text-align:center;font:600 .95rem var(--mono);letter-spacing:.04em}
@media (max-width:560px){
  .case{grid-template-columns:5.5rem minmax(0,1fr);gap:.9rem;padding:.85rem}
  .case .cover{width:5.5rem}
  .case h2{font-size:1.3rem}
  .case .intro{display:none}
}

/* ---------- workspace ---------- */
body.ws{overflow:hidden}
body.ws main{height:100%}
.wsroot{height:100%;display:grid;grid-template-rows:var(--bar) minmax(0,1fr)}
.topbar{display:flex;align-items:center;gap:.5rem;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line);min-width:0}
.topbar .t{min-width:0;flex:1;display:flex;align-items:baseline;gap:.6rem}
.topbar .t h1{font-size:1.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .t span{color:var(--muted);font-size:.85rem;white-space:nowrap}
.topbar .tools{display:flex;gap:.25rem;align-items:center}
.seg{display:inline-flex;background:var(--bg);border-radius:.55rem;padding:.2rem;gap:.15rem}
.seg button{border:0;background:transparent;border-radius:.4rem;padding:.4rem .75rem;font-weight:600;font-size:.9rem;color:var(--muted);min-height:2.2rem}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px var(--shade)}
.desk{display:grid;grid-template-columns:15rem minmax(0,1fr) 26rem;min-height:0}
.desk.nopanel{grid-template-columns:15rem minmax(0,1fr)}
.rail{overflow:auto;background:var(--panel);border-right:1px solid var(--line);padding:.75rem .6rem 2rem;overscroll-behavior:contain}
.rail h4{font:600 .72rem var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:.6rem .4rem .4rem}
.thumbs{display:grid;gap:.15rem}
.th{display:grid;grid-template-columns:3rem minmax(0,1fr) auto;gap:.6rem;align-items:center;padding:.35rem .4rem;border-radius:.5rem;border:0;background:transparent;text-align:left;width:100%}
.th:hover{background:var(--line)}
.th.cur{background:var(--card);box-shadow:inset 3px 0 0 var(--accent),0 1px 2px var(--shade)}
.th .mini{width:3rem;aspect-ratio:210/297;overflow:hidden;border-radius:2px;background:var(--sheet-bg);box-shadow:0 1px 3px var(--shade);pointer-events:none}
.th .lbl{min-width:0;display:grid;font-size:.85rem;line-height:1.3}
.th .lbl .mono{font-size:.72rem;color:var(--muted)}
.th .star{width:2rem;height:2rem;font-size:1rem;color:var(--muted);opacity:.35}
.th:hover .star,.th .star[aria-pressed="true"]{opacity:1}
.th .star[aria-pressed="true"]{color:var(--tag);background:transparent}
.readers{display:grid;grid-template-columns:minmax(0,1fr);gap:1px;background:var(--line);min-height:0}
.readers.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.reader{display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;min-width:0;background:var(--sheet-bg)}
.rhead{display:flex;align-items:center;gap:.35rem;padding:.3rem .5rem;background:var(--panel);border-bottom:2px solid transparent;min-width:0}
.readers.two .reader.active .rhead{border-bottom-color:var(--accent)}
.rhead .cur{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:.92rem}
.rhead .cur .mono{color:var(--muted);margin-right:.4rem;font-size:.82rem}
.rhead .icon{width:2.2rem;height:2.2rem;font-size:1rem}
.rbody{overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.panel{overflow:auto;background:var(--panel);border-left:1px solid var(--line);padding:1rem 1rem 3rem;overscroll-behavior:contain}
.panel .intro{color:var(--muted);font-size:.95rem;margin-bottom:.75rem}
.notes textarea{width:100%;min-height:60vh;resize:vertical;font:400 .95rem/1.55 var(--body);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:.6rem;padding:.8rem}
.notes p{color:var(--muted);font-size:.85rem;margin-top:.5rem}
.picker{display:none}
.nav{display:none}

/* tasks */
.task{background:var(--card);border-radius:.8rem;margin-top:.9rem;position:relative;box-shadow:0 1px 2px var(--shade);overflow:hidden}
.task > header{display:flex;gap:.65rem;align-items:center;padding:.75rem .9rem}
.tag{background:var(--tag);color:var(--tag-ink);font:600 .8rem var(--mono);padding:.25rem .5rem;border-radius:.3rem;white-space:nowrap}
.task h3{font-size:1.1rem}
.task .state{margin-left:auto;font-size:.82rem;color:var(--muted);white-space:nowrap}
.task.solved .state{color:var(--ok);font-weight:600}
.task .body{padding:0 .9rem 1rem;display:grid;gap:.85rem}
.locked .body{color:var(--muted)}
.locked .tag{opacity:.5}
.locked h3{color:var(--muted)}
.field{display:grid;gap:.35rem}
.field > label,.field > .lab{font-weight:500;font-size:.93rem}
select,input[type=number]{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:.5rem;padding:.6rem .6rem;min-height:2.75rem}
input[type=number]{max-width:7rem}
.nums{display:flex;gap:.75rem;flex-wrap:wrap}
.checks{display:grid;gap:.35rem}
.checks label{display:flex;gap:.6rem;align-items:center;padding:.5rem .6rem;border-radius:.5rem;background:var(--panel);font-weight:400;font-size:.93rem}
.checks input{width:1.15rem;height:1.15rem;accent-color:var(--accent)}
.field.proof{border-top:1px dashed var(--line);padding-top:.85rem}
.row{display:flex;gap:.5rem;flex-wrap:wrap}
.row .btn{flex:1 1 10rem}
.msg{padding:.6rem .75rem;border-radius:.5rem;background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--ink);font-size:.93rem}
.hints{margin:0;padding:0;list-style:none;display:grid;gap:.45rem}
.hints li{border-left:4px solid var(--tag);background:var(--panel);padding:.55rem .75rem;font-size:.93rem;border-radius:0 .4rem .4rem 0}
.envelope{border-top:1px dashed var(--line);padding:.9rem;position:relative;font-size:.95rem}
.envelope ul{padding-left:1.15rem;margin:.5rem 0}
.envelope li{margin-bottom:.35rem}
.envelope p{margin-bottom:.5rem}
.stamp{position:absolute;right:.8rem;top:.6rem;border:2.5px solid var(--ok);color:var(--ok);font:600 .85rem var(--mono);padding:.2rem .5rem;border-radius:.3rem;transform:rotate(-6deg);letter-spacing:.1em}
.stamp.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:rotate(-6deg) scale(2.2);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.stamp.pop{animation:none}.case{transition:none}}
.answers{font-size:.88rem;color:var(--muted);margin-bottom:.6rem;padding-right:6.5rem}
.closing{margin-top:1rem;padding:1rem;background:var(--ink);color:var(--bg);border-radius:.8rem;display:grid;gap:.4rem}
.closing .score{font:600 1.6rem var(--mono)}
.foot{margin-top:1.5rem}
.rules{font-size:.85rem;color:var(--muted);margin-top:1rem}

/* tablet: panel becomes a drawer over the readers */
@media (max-width:1180px){
  .desk,.desk.nopanel{grid-template-columns:13rem minmax(0,1fr);position:relative}
  .panel{position:absolute;right:0;top:0;bottom:0;width:min(26rem,92%);box-shadow:-12px 0 32px var(--shade);z-index:3}
}
/* phone: bottom bar switches between sheets, tasks and notes */
@media (max-width:760px){
  .wsroot{grid-template-rows:var(--bar) minmax(0,1fr) calc(var(--nav) + env(safe-area-inset-bottom,0px))}
  :root{padding-bottom:0}
  .topbar .t span,.topbar .tools{display:none}
  .desk,.desk.nopanel{display:block;position:relative}
  .rail,.readers,.panel{position:absolute;inset:0;width:auto;box-shadow:none;border:0}
  .desk[data-view="spis"] .panel,.desk[data-view="ukoly"] .rail,.desk[data-view="ukoly"] .readers,.desk[data-view="poznamky"] .rail,.desk[data-view="poznamky"] .readers{display:none}
  .desk[data-view="spis"]:not(.reading) .readers{display:none}
  .desk[data-view="spis"].reading .rail{display:none}
  .readers.two{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
  .rail{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .thumbs{grid-template-columns:repeat(auto-fill,minmax(9rem,1fr));gap:.75rem}
  .th{grid-template-columns:minmax(0,1fr);gap:.4rem;padding:.4rem;position:relative;align-items:start;background:var(--card);box-shadow:0 1px 2px var(--shade)}
  .th .mini{width:100%}
  .th .star{position:absolute;top:.5rem;right:.5rem;opacity:1;background:var(--card);border-radius:999px;box-shadow:0 1px 3px var(--shade)}
  .th .star[aria-pressed="false"]{color:var(--muted)}
  .picker{display:inline-flex}
  .nav{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .nav button{border:0;background:transparent;font-weight:600;font-size:.88rem;color:var(--muted);display:grid;place-items:center;gap:.1rem;padding:.35rem 0}
  .nav button b{font-size:1.15rem;line-height:1}
  .nav button[aria-current="page"]{color:var(--accent)}
}
</style>
</head>

<main id="app"></main>

 .35 0'/><\/filter><rect width='100%' height='100%' filter='url(%23f)'/><\/svg>\"),radial-gradient(ellipse at 50% 45%,transparent 62%,rgba(90,70,40,0.050) 100%);\n  background-size:220px 220px,600px 600px,100% 100%}\n@media print{.page::before{opacity:.35}}\n/*/REALISM*/", "html": "\n\n\n\n\n<section class=\"page cover nofoot\">\n  <div class=\"tab\"><\/div>\n  <div class=\"label\">\n    <div class=\"k\">Spisová značka<\/div>\n    <div class=\"v\">KRPB-196344/TČ-2025-060011<\/div>\n    <div class=\"k\">Věc<\/div>\n    <div class=\"v\">Úmrtí Richarda Horáka, nar. 14. 2. 1964<\/div>\n    <h1>Poslední ročník<\/h1>\n    <div class=\"place\">Vinařství Horák, Pavlov — noc ze 3. na 4. října 2025<\/div>\n  <\/div>\n  <div class=\"stamp\">DŮVĚRNÉ<\/div>\n  <div class=\"ring\">Případ č. 1 z 5  ·  Obtížnost: mírná  ·  22 listů  ·  asi 1,5–2 h  ·  připravte si tužku a papír<\/div>\n<\/section>\n\n\n<section class=\"page\">\n  <div class=\"lh\">\n    <div class=\"org\">\n      <svg class=\"badge\" viewBox=\"0 0 40 46\"><path d=\"M20 1 38 8v15c0 11-8 18-18 22C10 41 2 34 2 23V8z\" fill=\"#1f3b66\"/><path d=\"M20 10l3 7h7l-6 4 2 7-6-4-6 4 2-7-6-4h7z\" fill=\"#e8c35a\"/><\/svg>\n      <div><b>POLICIE ČESKÉ REPUBLIKY<\/b><span>Krajské ředitelství policie Jihomoravského kraje<\/span><span>Odbor obecné kriminality, 1. oddělení<\/span><span>Kounicova 24, 611 32 Brno<\/span><\/div>\n    <\/div>\n    <div class=\"cj\">Č. j. KRPB-196344-14/TČ-2025-060011<br>V Brně dne 13. října 2025<\/div>\n  <\/div>\n\n  <p>Vážená paní magistro Štychová,<\/p>\n  <p>obracím se na Vás neoficiálně a byla bych ráda, kdyby to tak i zůstalo. Vím, že nejste od policie. Ale lékárnice, která přečte pitevní zprávu i toxikologii líp než leckterý můj kolega a které neuteče žádná nesrovnalost v papírech, je přesně to, co teď potřebuji.<\/p>\n  <p>V sobotu 4. října 2025 ráno byl ve sklepě vlastního vinařství v Pavlově nalezen mrtvý Richard Horák (61), majitel Vinařství Horák. Na první pohled nešťastná náhoda: starší muž, sklenka vína, strmé kamenné schody. Státní zástupce mi dal najevo, že by byl rád, aby se to uzavřelo jako nehoda — rodina je v regionu známá, vrcholí vinobraní a nikdo nestojí o titulky.<\/p>\n  <p>Já tomu nevěřím. Pitva přinesla několik věcí, které se k pádu ze schodů nehodí. A každý, kdo měl s panem Horákem nevyřízené účty, má na ten večer alibi. Některá jsou až podezřele dobrá.<\/p>\n  <p>V přílohách najdete kompletní spis: protokoly, úřední záznamy o podání vysvětlení, pitevní zprávu, výpisy a další materiály. Na uzavření mám čas do konce měsíce. Postupujte prosím ve třech krocích:<\/p>\n  <ol style=\"margin:3mm 0 4mm 6mm\">\n    <li><b>Úkol A — Nebyla to nehoda.<\/b> Dokažte to. Čím byl pan Horák zasažen, kde přesně a jak pachatel zakryl stopy?<\/li>\n    <li><b>Úkol B — Zamčený sklep.<\/b> Ráno byl sklep zamčený. Jak je to možné a kdo ze spisu ho vůbec mohl zamknout?<\/li>\n    <li><b>Úkol C — Pachatel.<\/b> Kdo Richarda Horáka zabil, kdy přesně a proč?<\/li>\n  <\/ol>\n  <p>Každou odpověď podložte konkrétními doklady ze spisu. Bez nich mi státní zástupce nevyhoví.<\/p>\n  <p style=\"margin-top:5mm\">S pozdravem<\/p>\n  <div style=\"margin-top:2mm;position:relative;height:16mm\">\n    <span class=\"hand\" style=\"font-size:24pt;color:#1d2f6b;position:absolute;top:-2mm\">K. Dvořáková<\/span>\n    <div style=\"position:absolute;right:0;top:-14mm;width:34mm;text-align:center\"><svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 37 37\" class=\"segno\" style=\"width:22mm;height:22mm;display:block;margin:0 auto\" role=\"img\" aria-label=\"QR kód: hlasový vzkaz od npor. Dvořákové\"><path class=\"qrline\" stroke=\"#1b1f24\" d=\"M2 2.5h7m1 0h1m2 0h1m1 0h2m1 0h2m1 0h3m1 0h1m2 0h7m-33 1h1m5 0h1m1 0h3m2 0h1m2 0h1m1 0h1m1 0h1m2 0h2m1 0h1m5 0h1m-33 1h1m1 0h3m1 0h1m3 0h1m1 0h1m6 0h1m4 0h1m1 0h1m1 0h3m1 0h1m-33 1h1m1 0h3m1 0h1m1 0h3m3 0h4m1 0h1m2 0h1m1 0h1m1 0h1m1 0h3m1 0h1m-33 1h1m1 0h3m1 0h1m3 0h1m1 0h1m1 0h1m2 0h1m1 0h2m1 0h1m1 0h1m1 0h1m1 0h3m1 0h1m-33 1h1m5 0h1m3 dé tvrdí, je pravda.<\/li>\n      <li>Dělejte si poznámky. Nejvíc pomáhá sestavit si časovou osu večera 3. října minutu po minutě.<\/li>\n      <li>U každého podezřelého si ověřte: měl motiv, měl příležitost, a kdo jeho alibi potvrzuje nezávisle?<\/li>\n      <li>Úkoly řešte popořadě. Odpověď vždy napište na papír a teprve pak otevřete obálku se stejným písmenem.<\/li>\n      <li>Když se zaseknete, ke každému úkolu existuje nápověda. Berte je po jedné.<\/li>\n    <\/ul>\n  <\/div>\n<\/section>\n\n\n<section class=\"page\">\n  <div class=\"exhibit\">LIST 3<\/div>\n  <div class=\"doc-title\">ÚŘEDNÍ ZÁZNAM<\/div>\n  <div class=\"doc-sub\">o oznámení a prvotních úkonech<\/div>\n  <div class=\"typed\">\n    <p>Dne 4. 10. 2025 v 07:08 hod. přijalo operační středisko KŘP JmK telefonické oznámení Lucie BENEŠOVÉ, sklepmistryně Vinařství Horák, Pavlov, Hlavní 37, o nálezu bezvládného těla majitele vinařství Richarda HORÁKA ve vinném sklepě. Posádka ZZS konstatovala v 07:31 smrt.<\/p>\n    <p>Na místo se dostavila hlídka OOP Mikulov, výjezdová skupina SKPV a technik. Tělo leželo na dolní podestě kamenného schodiště sklepa, vedle něj střepy lahve od vína. Prvotní hypotéza: pád ze schodů pod vlivem alkoholu.<\/p>\n    <p>S ohledem na závěry pitvy (viz list 6) je věc prověřována jako podezření ze spáchání zločinu vraždy podle § 140 trestního zákoníku. Zajištěny byly výpisy telekomunikačního provozu, data z chytrých hodinek poškozeného, záznamy elektronického zámku penzionu a listinné důkazy z kanceláře vinařství.<\/p>\n  <\/div>\n\n  <h3 class=\"sec\">Osoby v řízení<\/h3>\n  <table class=\"meta persons\">\n    <tr><td>Richard Horák (61)<\/td><td>poškozený; majitel a jednatel Vinařství Horák s.r.o.<\/td><\/tr>\n    <tr><td>Jana Horáková (54)<\/td><td>manželka; vede administrativu, fakturaci a platby vinařství<\/td><\/tr>\n    <tr><td>Tomáš Horák (29)<\/td><td>syn; bytem Mikulov<\/td><\/tr>\n    <tr><td>Lucie Benešová (34)<\/td><td>sklepmistryně (enoložka) vinařství od roku 2019; bytem Pavlov, Na Vyhlídce 12<\/td><\/tr>\n    <tr><td>Pavel Kříž (47)<\/td><td>soused, majitel Vinařství Kříž; ve sporu s poškozeným o hranici vinice<\/td><\/tr>\n    <tr><td>Ing. Ivo Mareš (52)<\/td><td>ředitel akvizic Danubia Wine Invest a.s., Praha; host v penzionu vinařství<\/td><\/tr>\n    <tr><td>Eva Kovářová (57)<\/td><td>sestra Jany Horákové; bytem Brno-Židenice, Jílkova 118<\/td><\/tr>\n    <tr><td>Ing. Libor Vávra (58)<\/td><td>daňový poradce a externí účetní vinařství, Mikulov<\/td><\/tr>\n    <tr><td>Josef Hrubý (44)<\/td><td>výčepní, Hospoda U Hrozna, Pavlov<\/td><\/tr>\n  <\/table>\n\n  <h3 class=\"sec\">Vozidla<\/h3>\n  <table class=\"meta\">\n    <tr><td>Land Rover Defender, zelený<\/td><td>R. Horák — v garáži vinařství<\/td><\/tr>\n    <tr><td>Škoda Octavia Combi, tmavě modrá<\/td><td>firemní, užívá J. Horáková<\/td><\/tr>\n    <tr><td>VW Golf, stříbrný (hatchback)<\/td><td>T. Horák<\/td><\/tr>\n    <tr><td>Škoda Fabia Combi, tmavě zelená<\/td><td>L. Benešová<\/td><\/tr>\n    <tr><td>Audi Q5, bílé<\/td><td>I. Mareš<\/td><\/tr>\n    <tr><td>Toyota Hilux, šedá (pick-up)<\/td><td>P. Kříž<\/td><\/tr>\n    <tr><td>Ford Transit, bílá dodávka<\/td><td>firemní, v garáži vinařství<\/td><\/tr>\n  <\/table>\n  <div class=\"sign\"><div><span class=\"scrawl\">Dvořáková<\/span>npor. Mgr. K. Dvořáková<\/div><div>Brno, 6. 10. 2025<\/div><\/div>\n<\/section>\n\n\n<section class=\"page\">\n  <div class=\"exhibit\">LIST 4<\/div>\n  <div class=\"doc-title\">SITUAČNÍ PLÁNEK<\/div>\n  <div class=\"doc-sub\">Vinařství Horák, Pavlov, Hlavní 37 — zhotovil prap. Bc. J. Navrátil, 4. 10. 2025 (bez měřítka, orientačně)<\/div>\n  <svg viewBox=\"0 0 620 520\" style=\"width:100%;font-family:'IBM Plex Sans',sans-serif\" xmlns=\"http://www.w3.org/2000/svg\">\n    <defs><pattern id=\"vine\" width=\"14\" height=\"14\" patternUnits=\"userSpaceOnUse\"><path d=\"M0 7h14\" stroke=\"#7d9a62\" stroke-width=\"1.4\" stroke-dasharray=\"3 3\"/><\/pattern>\n    <pattern id=\"hatch\" width=\"6\" h =\"#bdbdbd\"/><path d=\"M0 479 H620\" stroke=\"#fff\" stroke-width=\"1.5\" stroke-dasharray=\"14 10\"/>\n    <text x=\"250\" y=\"475\" font-size=\"12\" font-weight=\"700\" fill=\"#333\" style=\"paint-order:stroke;stroke:#bdbdbd;stroke-width:4px\">ULICE HLAVNÍ<\/text>\n    <rect x=\"484\" y=\"88\" width=\"126\" height=\"360\" fill=\"url(#vine)\" stroke=\"#333\"/>\n    <rect x=\"500\" y=\"300\" width=\"94\" height=\"70\" fill=\"#fff\" stroke=\"#333\"/>\n    <text x=\"508\" y=\"330\" font-size=\"9.5\" font-weight=\"700\">Vinařství<\/text><text x=\"508\" y=\"343\" font-size=\"9.5\" font-weight=\"700\">Kříž<\/text>\n    <g fill=\"#9cb98a\" stroke=\"#6d8a5b\" stroke-width=\".8\"><circle cx=\"100\" cy=\"190\" r=\"16\"/><circle cx=\"420\" cy=\"410\" r=\"12\"/><\/g><g fill=\"#6d8a5b\"><circle cx=\"100\" cy=\"190\" r=\"2\"/><circle cx=\"420\" cy=\"410\" r=\"1.6\"/><\/g><line x1=\"463\" y1=\"88\" x2=\"463\" y2=\"448\" stroke=\"#a52a21\" stroke-width=\"2\" stroke-dasharray=\"6 4\"/>\n    <text x=\"468\" y=\"178\" font-size=\"8.5\" fill=\"#a52a21\" transform=\"rotate(90 468 178)\">sporná hranice pozemků<\/text>\n    <g transform=\"translate(592,24)\"><circle r=\"15\" fill=\"#fff\" stroke=\"#333\"/><path d=\"M0 -11 L5 4 L0 1 L-5 4Z\" fill=\"#333\"/><text y=\"11\" font-size=\"8\" font-weight=\"700\" text-anchor=\"middle\">S<\/text><\/g>\n  <\/svg>\n\n  <h3 class=\"sec\">Detail: vinný sklep<\/h3>\n  <svg viewBox=\"0 0 620 170\" style=\"width:100%;font-family:'IBM Plex Sans',sans-serif\">\n    <rect x=\"10\" y=\"20\" width=\"110\" height=\"60\" fill=\"#f1ede2\" stroke=\"#333\"/>\n    <text x=\"16\" y=\"36\" font-size=\"9.5\" font-weight=\"700\">horní plošina<\/text>\n    <text x=\"16\" y=\"50\" font-size=\"8.5\">vypínač světla (vpravo)<\/text>\n    <text x=\"16\" y=\"62\" font-size=\"8.5\">regál Pálava 2023<\/text>\n    <circle cx=\"100\" cy=\"70\" r=\"6\" fill=\"none\" stroke=\"#a52a21\" stroke-dasharray=\"2 2\"/>\n    <text x=\"40\" y=\"96\" font-size=\"8\" fill=\"#a52a21\">kruhový otisk v prachu (Ø 12 cm)<\/text>\n    <g stroke=\"#333\"><rect x=\"120\" y=\"30\" width=\"200\" height=\"40\" fill=\"#e6e1d4\"/>\n    <line x1=\"134\" y1=\"30\" x2=\"134\" y2=\"70\"/><line x1=\"148\" y1=\"30\" x2=\"148\" y2=\"70\"/><line x1=\"162\" y1=\"30\" x2=\"162\" y2=\"70\"/><line x1=\"176\" y1=\"30\" x2=\"176\" y2=\"70\"/><line x1=\"190\" y1=\"30\" x2=\"190\" y2=\"70\"/><line x1=\"204\" y1=\"30\" x2=\"204\" y2=\"70\"/><line x1=\"218\" y1=\"30\" x2=\"218\" y2=\"70\"/><line x1=\"232\" y1=\"30\" x2=\"232\" y2=\"70\"/><line x1=\"246\" y1=\"30\" x2=\"246\" y2=\"70\"/><line x1=\"260\" y1=\"30\" x2=\"260\" y2=\"70\"/><line x1=\"274\" y1=\"30\" x2=\"274\" y2=\"70\"/><line x1=\"288\" y1=\"30\" x2=\"288\" y2=\"70\"/><line x1=\"302\" y1=\"30\" x2=\"302\" y2=\"70\"/><\/g>\n    <text x=\"150\" y=\"88\" font-size=\"8.5\">schodiště: 14 kamenných schodů, sklon cca 40°<\/text>\n    <rect x=\"320\" y=\"20\" width=\"70\" height=\"60\" fill=\"#f1ede2\" stroke=\"#333\"/>\n    <text x=\"324\" y=\"36\" font-size=\"9\" font-weight=\"700\">dolní podesta<\/text>\n    <path d=\"M345 55l12 12m0-12l-12 12\" stroke=\"#a52a21\" stroke-width=\"2.5\"/>\n    <text x=\"324\" y=\"108\" font-size=\"8.5\" fill=\"#a52a21\">místo nálezu těla<\/text>\n    <rect x=\"390\" y=\"10\" width=\"220\" height=\"80\" fill=\"url(#hatch)\" stroke=\"#333\"/>\n    <text x=\"398\" y=\"40\" font-size=\"9.5\" font-weight=\"700\" fill=\"#222\">zadní část sklepa (cca 25 m)<\/text>\n    <text x=\"398\" y=\"54\" font-size=\"8.5\" fill=\"#222\">sudy, archiv: Frankovka, Ryzlink<\/text>\n    <text x=\"398\" y=\"66\" font-size=\"8.5\" fill=\"#222\">rýnský, Modrý Portugal<\/text>\n  <\/svg>\n<\/section>\n\n\n<section class=\"page\">\n  <div class=\"exhibit\">LIST 5<\/div>\n  <div class=\"doc-title\">PROTOKOL O OHLEDÁNÍ MÍSTA ČINU<\/div>\n  <div class=\"doc-sub\">§ 113 trestního řádu — zahájeno 4. 10. 2025 v 08:05, ukončeno v 12:40<\/div>\n  <table class=\"meta\">\n    <tr><td>Místo<\/td><td>Vinařství Horák s.r.o., Pavlov, Hlavní 37 — vinný sklep, dvůr, hlavní dům<\/td><\/tr>\n    <tr><td>Počasí<\/td><td>předchozích 5 dní sucho; 3. 10. od cca 22:00 do 03:00 slabý déšť; ráno zataženo, 9 °C<\/td><\/tr>\n    <tr><td>Přítomni<\/td><td>kpt. Bc. R. Veselý (vedoucí ohledání), prap. Bc. J. Navrátil (technik), MUDr. O. Sýkora (ZZS)<\/td><\/tr>\n  <\/table>\n  <div class=\"typed\">\n    <p><b>1.<\/b> Vstup do sklepa: dubové dveře ve svahu za hlavní budovou, cylindrická půlvložka bez známek násilí; zamknout lze jen zvenku klíčem, zevnitř dveře nemají zámek ani knoflík. Dle svědkyně Benešové byly ráno dveře zamčené; odemkla je vlastním klíčem v 07:03.<\/p>\n    <p><b>2.<\/b> Vypínač osvětlení se nachází uvnitř, vpravo od dveří na horní plošině. Při příchodu svědkyně bylo osvětlení vypnuté.<\/p>\n    <p><b>3.<\/b> Na podlaze horní plošiny, vlevo od dveří, kruhový otisk v prachu o průměru cca 12 cm. Na otisku se žádný předmět nenachází.<\/p>\n    <p><b>4.<\/b> Tělo: na dolní podestě, v poloze na břiše, hlavou od schodů, nohy na posledním schodu. Oblečení: domácí kalhoty, flanelová košile, vlněný svetr. Na obou nohou kožené pantofle.<\/p>\n    <p><b>5.<\/b> Lahev: Pálava 2023, výběr z hroznů, 0,75 l, z produkce vinařství. Střepy rozptýleny vedle těla a na zádech poškozeného. Pod tělem nebyly nalezeny střepy ani stopy vína.<\/p>\n    <p><b>6.<\/b> Regál na horní plošině obsahuje lahve Pálava 2023; v přední řadě chybí 1 ks.<\/p>\n    <p><b>7.<\/b> V pravé kapse kalhot poškozeného svazek klíčů (dům, sklep, garáž, vozidlo). Na levém zápěstí chytré hodinky, nepoškozené — zajištěny k vytěžení dat.<\/p>\n    <p><b>8.<\/b> Mobilní telefon poškozeného nalezen v obývacím pokoji na konferenčním stolku. Tamtéž jedna sklenice se zbytkem červeného vína. Na odkapávači u dřezu jedna umytá sklenice na víno. Nádobí od večeře v myčce.<\/p>\n    <p><b>9.<\/b> Kancelář: nástěnná skříňka na klíče s kódovým zámkem, bez poškození. Všechny klíče na místě, včetně klíče označeného „SKLEP – rezerva“. Daktyloskopické stopy na skříňce setřené, neupotřebitelné.<\/p>\n    <p><b>10.<\/b> Dvůr: fena Betty (kříženec ovčáka) v otevřeném kotci. Zadní branka z polní cesty zavřená na západku, nezamčená.<\/p>\n    <p><b>11.<\/b> Polní cesta za zadní brankou: v měkké spraši stopy pneumatik osobního vozidla, částečně přejeté traktorem; k identifikaci nevhodné. Zajištěn vzorek zeminy (žlutohnědá spraš).<\/p>\n    <p><b>12.<\/b> Vozidlo VW Golf (T. Horák) na dvoře, motor studený.<\/p>\n    <p><b>13.<\/b> Na druhém schodu shora dámský hedvábný šátek, zelený, s potiskem vinné révy. Bez stop krve.<\/p>\n  <\/div>\n  <div class=\"sign\"><div><span class=\"scrawl\">Navrátil<\/span>prap. Bc. J. Navrátil<\/div><div><span class=\"scrawl\">Veselý<\/span>kpt. Bc. R. Veselý<\/div><\/div>\n<\/section>\n\n\n<section class=\"page\">\n  <div class=\"exhibit\">LIST 6<\/div>\n  <div class=\"lh\" style=\"border-color:#555\">\n    <div class=\"org\"><div><b style=\"color:#333\">FAKULTNÍ NEMOCNICE BRNO<\/b><span>Ústav soudního lékařství<\/span><span>Tvrdého 2a, 662 99 Brno<\/span><\/div><\/div>\n    <div class=\"cj\">Pitevní protokol č. 1187/25<br>Provedeno 5. 10. 2025<\/div>\n  <\/div>\n  <div class=\"doc-title\">ZPRÁVA O SOUDNÍ PITVĚ (výtah)<\/div>\n  <table class=\"meta\" style=\"margin-top:4mm\">\n    <tr><td>Zemřelý<\/td><td>Richard Horák, nar. 14. 2. 1964, 178 cm, 86 kg<\/td><\/tr>\n    <tr><td>Pitval<\/td><td>MUDr. Petr Zeman, Ph.D., soudní lékař<\/td><\/tr>\n  <\/table>\n  <h3 class=\"sec\">Nálezy<\/h3>\n  <p><b>Hlava.<\/b> Dvě tržně zhmožděné rány: (a) v záhlaví vlevo, 4,5 cm, pod ní vtlačená (impresivní) zlomenina lebky s nepravidelným, zvlněným okrajem — po obvodu opakující se oblé výstupky o průměru cca 1,5 cm; (b) na temeni vpravo, 3 cm, podobného charakteru, bez zlomeniny. Zhmoždění mozku a mozkového kmene, krvácení pod měkké pleny mozkové.<\/p>\n  <p><b>Cizorodé částice.<\/b> V ráně (a) zjištěny drobné šupinky černého alkydového laku a částice oxidů železa (rez).<\/p>\n  <p><b>Ostatní poranění.<\/b> Oděrky na čele a pravém loketním kloubu, podlitina na pravém boku. <u>Na dlaních ani zápěstích nebyly zjištěny oděrky ani jiná poranění<\/u>, která obvykle vznikají při instinktivní snaze zachytit se při pádu. Obranná poranění na rukou nezjištěna. Za nehty bez nálezu.<\/p>\n  <p><b>Toxikologie.<\/b> Ethanol v krvi 0,38 g/kg (odpovídá cca dvěma sklenkám vína). Jiné látky neprokázány.<\/p>\n  <p><b>Žaludek.<\/b> Natrávená strava (maso, brambory), odpovídá jídlu cca 2–3 hodiny před smrtí.<\/p>\n  <p><b>Doba smrti.<\/b> Dle posmrtných změn a tělesné teploty v rozmezí 21:30–00:30 dne 3. 10. 2025.<\/p>\n  <h3 class=\"sec\">Závěr<\/h3>\n  <div class=\"note\" style=\"border-color:#555;background:#f1f1ef\">\n    Příčinou smrti je kraniocerebrální poranění. Poranění hlavy <b>nelze vysvětlit pádem ze schodů<\/b>: jde o dvě poranění na odlišných místech lebky a tvar zlomeniny odpovídá úderu tupým, těžkým předmětem s členitým, „hroznovitým“ povrchem, kovovým a natřeným černou barvou. Absence poranění rukou svědčí o tom, že poškozený byl při pádu již v bezvědomí. Oděrky na čele a lokti vznikly pravděpodobně až pádem či manipulací s tělem.\n  <\/div>\n  <div class=\"sign\"><div><span class=\"scrawl\">Zeman<\/span>MUDr. Petr Zeman, Ph.D.<\/div><div>Brno, 6. 10. 2025<\/div><\/div>\n<\/section>\n\n\n<section class=\"page\">\n  <div class=\"exhibit\">LIST 7<\/div>\n  <div class=\"doc-title\">ÚŘEDNÍ ZÁZNAM O PODÁNÍ VYSVĚTLENÍ<\/div>\n  <div class=\"doc-sub\">§ 158 odst. 6 trestního řádu<\/div>\n  <table class=\"meta\">\n    <tr><td>Osoba<\/td><td>Lucie BENEŠOVÁ, nar. 1991, sklepmistryně, Pavlov, Na Vyhlídce 12<\/td><\/tr>\n    <tr><td>Datum, místo<\/td><td>4. 10. 2025, 09:40–11:05, OOP Mikulov; doplněno 6. 10. 2025<\/td><\/tr>\n  <\/table>\n  <div class=\"typed qa\">\n    <p>K věci uvádím: V sobotu jsem přišla do práce v 7:00 jako každý den, potřebovala jsem zkontrolovat kvašení. Dveře do sklepa byly zamčené, to je v noci normální. Odemkla jsem, rozsvítila a hned mi bylo divné, že uvnitř u dveří nestojí zarážka — litinový hrozen natřený načerno, váží asi tři kila, přes den s ním podpíráme dveře. Stojí tam od doby, kdy vinařství vedl ještě Richardův táta. Pak jsem uviděla Richarda dole pod schody. Seběhla jsem k němu, ale byl studený. V 7:08 jsem volala na 112.<\/p>\n    <p><b>Kdy jste poškozeného viděla naposledy?<\/b> V pátek kolem páté v kanceláři, celý den byl nervózní. Pak jsem byla ve sklepě a v 19:00 jsem odešla zadem. Ráno se mě ptal na sudy od nějaké firmy Kovář — jestli jsme je dostali. Řekla jsem mu, že sudy kupujeme jen od Francouzů, od Gauthiera, naposledy letos v březnu. Od žádného Kováře k nám nikdy nic nepřišlo. Sklep vedu já, věděla bych to.<\/p>\n    <p><b>(Doplněno 6. 10. po předložení SMS zpráv) Jaký jste měla s poškozeným vztah?<\/b> Asi rok jsme spolu měli poměr. Nikdo o tom nevěděl. Chtěla jsem, aby to řekl Janě, on to pořád odkládal.<\/p>\n    <p><b>Kde jste byla v pátek večer?<\/b> Doma, je to od vinařství pět minut pěšky. Od 22:20 zhruba do 23:00 jsem měla videohovor s mámou, pak jsem šla spát.<\/p>\n    <p><b>Pil poškozený často Pálavu?<\/b> Nikdy. Richard Pálavu nesnášel, říkal jí „voňavka pro Pražáky“. Děláme ji kvůli turistům. Když si šel večer pro lahev, bral si Frankovku nebo Ryzlink rýnský a ty jsou úplně vzadu ve sklepě, ne u schodů.<\/p>\n    <p><b>Kdo zná kód ke skříňce s klíči?<\/b> Je to datum narození Tomáše. Zná ho Richard, paní Horáková, Tomáš a já. Paní Horáková si odtamtud běžně bere klíče od dodávky.<\/p>\n    <p><b>(Doplněno 6. 10.) Je zelený šátek ze schodů Váš?<\/b> Ano. V pátek jsem ho nechala na věšáku v kanceláři, bylo teplo. Ve sklepě jsem ten den v šátku nebyla. Ráno jsem si ho na schodech nevšimla, koukala jsem jen na Richarda.<\/p>\n    <p><b>Jak se chová fena Betty?<\/b> Na cizí lidi a cizí psy štěká jako blázen. Na rodinu a na mě ne.<\/p>\n  <\/div>\n  <div class=\"note\">Pozn. PO: Svědkyně předložila v telefonu záznam videohovoru (WhatsApp) s matkou Marií Benešovou, 22:20–23:02 (42 min). Matka telefonicky potvrdila, že dcera po celou dobu hovoru seděla doma v kuchyni.<\/div>\n  <div class=\"sign\"><div><span class=\"scrawl\">L. Benešová<\/span>podpis vyslýchané<\/div><div><span class=\"scrawl\">Dvořáková<\/span>npor. Mgr. K. Dvořáková<\/div><\/div>\n<\/section>\n\n\n<section class=\"page\">\n  <div class=\"exhibit\">LIST 8<\/div>\n  <div class=\"doc-title\">ÚŘEDNÍ ZÁZNAM O PODÁNÍ VYSVĚTLENÍ<\/div>\n  <div class=\"doc-sub\">§ 158 odst. 6 trestního řádu<\/div>\n  <table class=\"meta\">\n    <tr><td>Osoba<\/td><td>Jana HORÁKOVÁ, nar. 1971, Pavlov, Hlavní 37<\/td><\/tr>\n    <tr><td>Datum, místo<\/td><td>4. 10. 2025, 11:30–12:45, OOP Mikulov<\/td><\/tr>\n  <\/table>\n  <div class=\"typed qa\">\n    <p>K věci uvádím: V pátek jsem kolem půl páté odjela k sestře do Brna. Jezdím tam každý první pátek v měsíci. Večer mě chytla migréna, tak jsem šla kolem deváté spát a vzala si prášek. Ráno v 8:10 mi volali z policie. Sestra mě hned odvezla domů, sama jsem řídit nemohla.<\/p>\n    <p><b>Mluvila jste s manželem v pátek večer?<\/b> Volal mi kolem deváté. Ptal se, jestli jsem dojela a jak mi je. Normální hovor, nic zvláštního.<\/p>\n    <p><b>Opustila jste v noci sestřin dům?<\/b> Ne. Byla jsem v posteli. Můžete si klidně zkontrolovat můj telefon, byl celou noc v Brně.<\/p>\n    <p><b>Kdy jste naposledy tankovala?<\/b> V pátek odpoledne cestou do Brna, v Pohořelicích na dálnici. Dala jsem si tam i kávu. Účtenka bude někde v autě.<\/p>\n    <p><b>Jakou máte ve vinařství roli?<\/b> Vedu administrativu, fakturaci a platby. Richard podepisoval jen velké platby, nad půl milionu. Finanční problémy nemáme, firma je zdravá.<\/p>\n    <p><b>Chodíte do sklepa? Znáte kód ke skříňce s klíči?<\/b> Do sklepa nechodím, to je věc Richarda a Lucie. Kód ke skříňce neznám, ten mají Richard a Lucie.<\/p>\n    <p><b>Věděla jste o vztahu manžela a paní Benešové?<\/b> Vím, co si lidi šeptají. Jestli si myslíte, že jsem žárlila, tak se pletete. Na tom mi už dávno nezáleželo.<\/p>\n    <p><b>Jaký máte názor na nabídku Danubia Wine Invest?<\/b> Já bych prodala, to netajím. Je mi padesát čtyři, chtěla bych konečně klid. Richard ne. Pro něj to bylo dědictví po otci.<\/p>\n    <p><b>Mohl mít někdo důvod manželovi ublížit?<\/b> Kříž mu veřejně vyhrožoval. A ten Pražák od Danubie se tu poslední dny potloukal. Tomáš… Tomáš má problémy, ale vlastnímu otci by nikdy nic neudělal.<\/p>\n  <\/div>\n  <div class=\"sign\"><div><span class=\"scrawl\">J. Horáková<\/span>podpis vyslýchané<\/div><div><span class=\"scrawl\">Dvořáková<\/span>npor. Mgr. K. Dvořáková<\/div><\/div>\n<\/section>\n\n\n<section class=\"page\">\n  <div class=\"exhibit\">LIST 9<\/div>\n  <div class=\"doc-title\">ÚŘEDNÍ ZÁZNAM O PODÁNÍ VYSVĚTLENÍ<\/div>\n  <table class=\"meta\" style=\"margin-top:3mm\">\n    <tr><td>Osoba<\/td><td>Tomáš HORÁK, nar. 1996, OSVČ, Mikulov, Náměstí 9<\/td><\/tr>\n    <tr><td>Datum, místo<\/td><td>4. 10. 2025, 13:10–14:20, OOP Mikulov<\/td><\/tr>\n  <\/table>\n  <div class=\"typed qa\">\n    <p>K věci uvádím: V pátek jsem přijel v půl osmé autem k našim na večeři. Táta byl divný, zamlklý, máma už byla v Brně. U večeře jsme začali mluvit o nabídce od Danubie, osmačtyřicet milionů. Řekl jsem mu, že je šílenství to odmítnout. Pohádali jsme se, křičel jsem, to přiznávám. Řekl mi, že dokud žije, neprodá ani keř. Kolem 20:40 jsem odešel do hospody U Hrozna. Auto jsem nechal na dvoře, protože jsem věděl, že budu pít. V 22:05 jsem tátovi napsal, že se omlouvám. Neodepsal. V hospodě jsem byl do jedenácti, pak jsem si zavolal taxík do Mikulova.<\/p>\n    <p><b>Máte dluhy?<\/b> Ano. Asi šest set tisíc, běží na mě exekuce. Krachl mi e-shop s vínem. Táta mi odmítl pomoct, řekl, že si to musím vyžrat sám.<\/p>\n    <p><b>Telefonoval jste z hospody ještě někomu?<\/b> Ne. Jen jsem psal tátovi. Celou dobu jsem seděl na baru.<\/p>\n    <p><b>Věděl jste o vztahu otce a paní Benešové?<\/b> Tušil jsem to.<\/p>\n    <p><b>Znáte kód ke skříňce s klíči?<\/b> Jasně, je to moje datum narození. Zná ho táta, máma a já. Nikomu jinému jsme ho neříkali.<\/p>\n  <\/div>\n  <div class=\"note\">Pozn. PO: Poškozený měl rizikové životní pojištění s pojistnou částkou 3 000 000 Kč (Moravská pojišťovna a.s.). Obmyšlený: syn Tomáš Horák, na základě změny ze dne 11. 8. 2025; do té doby manželka. T. Horák tvrdí, že o pojistce ani o změně nevěděl.<\/div>\n  <div class=\"sign\"><div><span class=\"scrawl\">T. Horák<\/span>podpis vyslýchaného<\/div><div><span class=\"scrawl\">Dvořáková<\/span>npor. Mgr. K. Dvořáková<\/div><\/div>\n\n  <div class=\"doc-title\" style=\"margin-top:10mm\">ÚŘEDNÍ ZÁZNAM O PODÁNÍ VYSVĚTLENÍ<\/div>\n  <table class=\"meta\" style=\"margin-top:3mm\">\n    <tr><td>Osoba<\/td><td>Josef HRUBÝ, nar. 1981, výčepní, Hospoda U Hrozna, Pavlov<\/td><\/tr>\n    <tr><td>Datum, místo<\/td><td>5. 10. 2025, 15:00–15:25, Hospoda U Hrozna<\/td><\/tr>\n  <\/table>\n  <div class=\"typed qa\">\n    <p>Tomáš Horák přišel v pátek tak za deset devět, byl naštvaný, sedl si k baru a pil. Celou dobu seděl u mě na baru, odcházel jen na záchod. Ven hlavním vchodem nevytáhl paty, ani kouřit nechodil. Zaplatil v 23:08, mám to v kase. Pak čekal venku na taxík, ten přijel asi v 23:15. Byl dost opilý, ale ne úplně. Na záchodě býval dvě tři minuty, jen jednou, tak ve čtvrt na jedenáct, tam byl dýl, šest sedm minut. Ze záchodové chodby se dá vyjít zadními dveřmi na dvorek. K Horákovým je to odsud pěšky pět minut jen tam.<\/p>\n  <\/div>\n  <div class=\"sign\"><div><span class=\"scrawl\">Hrubý<\/span>podpis<\/div><div><span class=\"scrawl\">Navrátil<\/span>prap. Bc. J. Navrátil<\/div><\/div>\n<\/section>\n\n\n<section class=\"page\">\n  <div class=\"exhibit\">LIST 10<\/div>\n  <div class=\"doc-title\">ÚŘEDNÍ ZÁZNAM O PODÁNÍ VYSVĚTLENÍ<\/div>\n  <div class=\"doc-sub\">§ 158 odst. 6 trestního řádu<\/div>\n  <table class=\"meta\">\n    <tr><td>Osoba<\/td><td>Pavel KŘÍŽ, nar. 1978, vinař, Pavlov, Hlavní 39<\/td><\/tr>\n    <tr><td>Datum, místo<\/td><td>4. 10. 2025, 15:00–16:10, OOP Mikulov<\/td><\/tr>\n  <\/table>\n  <div class=\"typed qa\">\n    <p>K věci uvádím: S Horákem se už čtyři roky soudíme o hranici vinice. Jeho otec kdysi posunul kolíky o šest řádků a Richard to odmítal přiznat. Na vinobraní jsem mu řekl, že ho jednou zakopu v jeho vlastní vinici. Byl jsem opilý a byl jsem naštvaný. Nezabil jsem ho. Čtrnáctého měl přijet geodet a já věděl, že to vyhraju. Proč bych ho zabíjel teď?<\/p>\n    <p><b>Co jste dělal v pátek večer?<\/b> Kolem půl jedenácté jsem šel se psem, s Maxem, jako každý večer. Šel jsem po Hlavní kolem Horákových a telefonoval jsem bráchovi kvůli tomu geodetovi, byl jsem rozčilený, asi jsem byl dost hlasitý. Pak jsem zahnul na polní cestu a obešel vinici. Doma jsem byl kolem jedenácté.<\/p>\n    <p><b>Viděl jste něco neobvyklého?<\/b> Na polní cestě, přímo u zadní branky Horákových, stálo auto. Tmavé kombi, nesvítilo, nikdo v něm neseděl. Myslel jsem, že tam zase parkují turisti, co chodí na Děvičky. Bylo to tak deset minut před jedenáctou.<\/p>\n    <p><b>Jaká značka? Registrační značka?<\/b> SPZ jsem neviděl, byla tma a mrholilo. Obyčejný tmavý kombík, značku vám neřeknu.<\/p>\n    <p><b>Štěkal pes Horákových?<\/b> Jako vždycky, když jdeme kolem. Nejdřív u ulice, pak znova vzadu u polní cesty. My se s Horákovými nemusíme, psi taky ne.<\/p>\n    <p><b>Byl jste někdy ve sklepě Horákových? Znáte kód ke skříňce s klíči?<\/b> Do jejich sklepa jsem nevkročil dvacet let. O žádné skříňce nic nevím.<\/p>\n  <\/div>\n  <div class=\"note\">Pozn. PO: Jaroslav Kříž (bratr) telefonicky potvrdil hovor; dle jeho slov Pavel během hovoru „funěl, jak šel do kopce, a pořád nadával na Horáka a geodeta“. Hovor viz list 14.<\/div>\n  <div class=\"sign\"><div><span class=\"scrawl\">P. Kříž<\/span>podpis vyslýchaného<\/div><div><span class=\"scrawl\">Dvořáková<\/span>npor. Mgr. K. Dvořáková<\/div><\/div>\n<\/section>\n\n\n<section class=\"page\">\n  <div class=\"exhibit\">LIST 11<\/div>\n  <div class=\"doc-title\">ÚŘEDNÍ ZÁZNAM O PODÁNÍ VYSVĚTLENÍ<\/div>\n  <div class=\"doc-sub\">§ 158 odst. 6 trestního řádu<\/div>\n  <table class=\"meta\">\n    <tr><td>Osoba<\/td><td>Ing. Ivo MAREŠ, nar. 1973, ředitel akvizic, Danubia Wine Invest a.s., Praha 1<\/td><\/tr>\n    <tr><td>Datum, místo<\/td><td>4. 10. 2025, 16:40–17:25, penzion Vinařství Horák<\/td><\/tr>\n  <\/table>\n  <div class=\"typed qa\">\n    <p>K věci uvádím: Do Pavlova jsem přijel ve čtvrtek. V pátek ve 14:00 jsem s panem Horákem jednal o koupi vinařství, nabídka zněla 48 milionů korun. Paní Horáková byla na začátku schůzky přítomna a dávala najevo, že by prodej uvítala. Pan Horák nabídku odmítl, a to dost nevybíravě.<\/p>\n    <p>Večeři jsem měl v restauraci v obci, vrátil jsem se kolem 22:10. Zhruba ve 22:25 jsem slyšel auto, jak zajíždí někam za dům, myslel jsem, že se vrací syn. Pak jsem si šel na balkon zakouřit, zhruba od 22:35 do 22:45. Po ulici pod penzionem šel muž se psem a hlasitě telefonoval, něco o geodetovi. Pes Horákových na něj štěkal jako šílený. Když předtím přijelo to auto, byl pes úplně zticha. Vzpomínám si na to, protože mi to pak přišlo divné. Potom jsem pracoval, poslal jsem e-mail do Prahy a šel spát. Ráno mě vzbudil křik.<\/p>\n    <p><b>Kde je Váš pokoj?<\/b> Ve druhém patře, balkon do ulice. Dvůr ani zadní část pozemku z něj nevidím.<\/p>\n    <p><b>Budete o koupi jednat dál?<\/b> Pochopitelně budeme jednat s dědici. To je byznys.<\/p>\n  <\/div>\n\n  <h3 class=\"sec\">Výpis z elektronického zámku — pokoj č. 4 (I. Mareš)<\/h3>\n  <table class=\"data\">\n    <tr><th>Datum<\/th><th>Čas<\/th><th>Událost<\/th><th>Karta<\/th><\/tr>\n    <tr><td>03.10.2025<\/td><td>13:41:07<\/td><td>Odemčeno zvenku<\/td><td>#0412<\/td><\/tr>\n    <tr><td>03.10.2025<\/td><td>13:52:30<\/td><td>Odemčeno zevnitř<\/td><td>—<\/td><\/tr>\n    <tr><td>03.10.2025<\/td><td>16:20:05<\/td><td>Odemčeno zvenku<\/td><td>#0412<\/td><\/tr>\n    <tr><td>03.10.2025<\/td><td>18:55:12<\/td><td>Odemčeno zevnitř<\/td><td>—<\/td><\/tr>\n    <tr><td>03.10.2025<\/td><td>22:12:44<\/td><td>Odemčeno zvenku<\/td><td>#0412<\/td><\/tr>\n    <tr><td>04.10.2025<\/td><td>07:31:58<\/td><td>Odemčeno zevnitř<\/td><td>—<\/td><\/tr>\n  <\/table>\n  <p class=\"small muted sans\" style=\"margin-top:2mm\">Zámek zaznamenává každé otevření dveří z obou stran. Okno a balkon jsou ve výšce cca 6,5 m nad terénem; technik nezjistil stopy slaňování ani lezení po fasádě.<\/p>\n  <div class=\"sign\"><div><span class=\"scrawl\">I. Mareš<\/span>podpis<\/div><div><span class=\"scrawl\">Dvořáková<\/span>npor. Mgr. K. Dvořáková<\/div><\/div>\n<\/section>\n\n\n<section class=\"page\">\n  <div class=\"exhibit\">LIST 12<\/div>\n  <div class=\"doc-title\">ÚŘEDNÍ ZÁZNAM O PODÁNÍ VYSVĚTLENÍ<\/div>\n  <table class=\"meta\" style=\"margin-top:3mm\">\n    <tr><td>Osoba<\/td><td>Eva KOVÁŘOVÁ, nar. 1968, účetní, Brno-Židenice, Jílkova 118<\/td><\/tr>\n    <tr><td>Datum, místo<\/td><td>(1) 4. 10. 2025, 09:20, telefonicky &nbsp; (2) 9. 10. 2025, 10:00–10:40, bydliště svědkyně<\/td><\/tr>\n  <\/table>\n  <div class=\"typed qa\">\n    <p><b>(1)<\/b> Jana byla u mě od pátku od půl šesté. Večer ji rozbolela hlava, vzala si rovnou dva ty svoje prášky na migrénu a šla si lehnout. Byla tu celou noc, auto má zaparkované před domem jako vždycky.<\/p>\n    <p><b>(2) Viděla jste sestru mezi 21:00 a 07:30?<\/b> Musím to upřesnit. V sobotu jsem řekla, že tu byla celou noc, protože jsem to tak brala. Ve skutečnosti jsem ji od devíti do rána neviděla. Kolem deváté jí někdo volal a šla si to vzít ven na dvůr. Pak řekla, že má migrénu, a šla si lehnout. Spí u mě v pokoji pro hosty, to je bývalá dílna ve dvoře s vlastním vchodem. Telefon nechala dole v kuchyni na nabíječce, prý nechce mít u hlavy svítící displej. Já koukala v obýváku na televizi, mám ji nahlas, špatně slyším na jedno ucho. V půl dvanácté, když jsem šla spát, ležel telefon na lince pořád. Ráno přišla Jana na snídani v půl osmé a vypadala, jako by vůbec nespala.<\/p>\n    <p><b>Máte další sourozence?<\/b> Jsme tři — já, Jana a bratr Roman. Roman má v Brně firmu, obchoduje se dřevem a sudy, ale moc se mu nedaří. Jana mu odjakživa pomáhá. Richard Romana nesnášel, roky spolu nepromluvili.<\/p>\n  <\/div>\n  <div class=\"sign\"><div><span class=\"scrawl\">Kovářová<\/span>podpis<\/div><div><span class=\"scrawl\">Navrátil<\/span>prap. Bc. J. Navrátil<\/div><\/div>\n\n  <div class=\"doc-title\" style=\"margin-top:9mm\">ÚŘEDNÍ ZÁZNAM O PODÁNÍ VYSVĚTLENÍ<\/div>\n  <table class=\"meta\" style=\"margin-top:3mm\">\n    <tr><td>Osoba<\/td><td>Ing. Libor VÁVRA, nar. 1967, daňový poradce, Mikulov<\/td><\/tr>\n    <tr><td>Datum, místo<\/td><td>6. 10. 2025, 09:00–09:40, kancelář svědka<\/td><\/tr>\n  <\/table>\n  <div class=\"typed qa\">\n    <p>V pátek kolem čtvrt na pět mi volal pan Horák. Byl rozrušený. Řekl, že při kontrole našel faktury za dodávky, které nikdy nepřišly, celkem přes 1,8 milionu, a že chce v pondělí v 9:00 probrat, jak postupovat, včetně případného trestního oznámení. Neřekl, koho podezírá. Řekl jen: „Nejdřív tomu člověku dám šanci, aby mi to vysvětlil.“<\/p>\n    <p><b>Kdo ve firmě schvaluje platby?<\/b> To přesně nevím. Doklady mi chodí už schválené a zaplacené, já je jen zaúčtuji. Platby z účtu neodesílám.<\/p>\n    <p><b>Znáte firmu Kovář s.r.o.?<\/b> Dodavatel je u nás veden od jara 2024. Faktury mi chodí už proplacené, fyzickou dodávku nekontroluji.<\/p>\n  <\/div>\n  <div class=\"sign\"><div><span class=\"scrawl\">Vávra<\/span>podpis<\/div><div><span class=\"scrawl\">Dvořáková<\/span>npor. Mgr. K. Dvořáková<\/div><\/div>\n<\/section>\n\n\n<section class=\"page\">\n  <div class=\"exhibit\">LIST 13<\/div>\n  <div class=\"doc-title\">DATA Z CHYTRÝCH HODINEK POŠKOZENÉHO<\/div>\n  <div class=\"doc-sub\">Export z aplikace „Zdraví“, vytěžil OKTE KŘP JmK dne 7. 10. 2025 — 3. 10. 2025, 21:50–22:50<\/div>\n  <table class=\"data\">\n    <tr><th>Čas<\/th><th>Tep (tepy/min)<\/th><th>Kroky (za interval)<\/th><th>Poznámka aplikace<\/th><\/tr>\n    <tr><td>21:50<\/td><td>66<\/td><td>0<\/td><td>klid<\/td><\ tavia Combi, tmavě modrá metalíza, RZ 8B3 4721<\/b> — místo: Brno, Jílkova 118 (zaparkováno na ulici před domem), 14:20. Uživatelka J. Horáková. V kapse dveří řidiče nalezena pokladní účtenka čerpací stanice (níže). Na koberečku řidiče a na pedálech žlutohnědá hlína v hrudkách, uvnitř hrudek ještě vlhká (vzorek zajištěn). Na sedadle spolujezdce kabelka; v ní krabička Sumatriptan 100 mg, 6 tbl. (vydáno na lékařský předpis na jméno J. Horáková), v blistru chybějí 2 tablety. V zavazadlovém prostoru taška s oblečením, deštník. Jinak bez nálezu.<\/p>\n    <p><b>B) VW Golf, stříbrný, RZ 4B7 0932<\/b> — dvůr vinařství, 09:10. Uživatel T. Horák. Motor studený. Na sedadle spolujezdce prázdný sáček z KFC a účtenka KFC Brno, Olympia, 2. 10. 2025, 19:41: Grander Texas menu, 1 ks. Jinak bez nálezu.<\/p>\n    <p><b>C) Toyota Hilux, šedá<\/b> — dvůr Vinařství Kříž, 16:30. Uživatel P. Kříž. Na korbě zemina, nářadí. Bez nálezu.<\/p>\n    <p><b>D) Audi Q5, bílé<\/b> — parkoviště penzionu, 10:00. Uživatel I. Mareš. Bez nálezu.<\/p>\n  <\/div>\n  <div class=\"note\">Doplněk 9. 10. 2025: Vzorek hlíny z vozidla A a vzorek z polní cesty za vinařstvím (list 5, bod 11) jsou dle OKTE „spraš shodného mineralogického složení“. Účtenka: první dvě číslice času jsou vybledlé (termotisk), nelze je obnovit. Kamerový záznam čerpací stanice z 3. 10. byl při vyžádání 9. 10. již přemazán (stanice jej uchovává 72 hodin); obsluha si zákazníky z pátku nepamatuje.<\/div>\n\n  <div class=\"receipts\" style=\"margin-top:4mm\">\n    <div class=\"receipt\">\n      <div class=\"c\"><b>PETRA čerpací stanice<\/b><br>ČS Pohořelice-jih<br>D52, km 26,5 — směr Mikulov<br>IČO 26174201<\/div>\n      <hr>\n      <div>Doklad č. 0315-118842<br>Pokladna 02 · obsl. Marcela<\/div>\n      <hr>\n      <div class=\"row\"><span>Natural 95<\/span><span><\/span><\/div>\n      <div class=\"row\"><span>18,42 l × 38,90<\/span><span>716,54<\/span><\/div>\n      <div class=\"row\"><span>Espresso velké<\/span><span>49,00<\/span><\/div>\n      <hr>\n      <div class=\"row\"><b>CELKEM<\/b><b>765,54<\/b><\/div>\n      <div class=\"row\"><span>Zaokrouhlení<\/span><span>0,46<\/span><\/div>\n      <div class=\"row\"><span>HOTOVĚ<\/span><span>766,00<\/span><\/div>\n      <hr>\n      <div class=\"c\">03.10.2025 <span style=\"opacity:.13;filter:blur(.6px)\">▒▒<\/span>:58:14<br>Děkujeme a šťastnou cestu!<\/div>\n    <\/div>\n    <div class=\"receipt\">\n      <div class=\"c\"><b>Hospoda U Hrozna<\/b><br>Pavlov, Hlavní 12<\/div>\n      <hr>\n      <div>Účet č. 4471 · BAR<\/div>\n      <hr>\n      <div class=\"row\"><span>7× Pivo 12° 0,5<\/span><span>392,00<\/span><\/div>\n      <div class=\"row\"><span>2× Slivovice 0,04<\/span><span>140,00<\/span><\/div>\n      <div class=\"row\"><span>1× Utopenec<\/span><span>65,00<\/span><\/div>\n      <hr>\n      <div class=\"row\"><b>CELKEM<\/b><b>597,00<\/b><\/div>\n      <div class=\"row\"><span>Platba kartou<\/span><span>597,00<\/span><\/div>\n      <hr>\n      <div class=\"c\">Otevřeno: 03.10.2025 20:51<br>Uzavřeno: 03.10.2025 23:08<\/div>\n    <\/div>\n    <div class=\"receipt\">\n      <div class=\"c\"><b>TAXI MIKULOV<\/b><br>+420 737 ••• 000<\/div>\n      <hr>\n      <div>Vůz č. 3<\/div>\n      <div class=\"row\"><span>Nástup<\/span><span>23:15<\/span><\/div>\n      <div class=\"row\"><span>Výstup<\/span><span>23:31<\/span><\/div>\n      <div>Pavlov, Hlavní 12 → Mikulov, Náměstí 9<\/div>\n      <hr>\n      <div class=\"row\"><b>CENA<\/b><b>380 Kč<\/b><\/div>\n      <div class=\"c\">03.10.2025<\/div>\n    <\/div>\n  <\/div>\n<\/section>\n\n\n<section class=\"page news\">\n  <div class=\"exhibit\">LIST 19<\/div>\n  <div class=\"masthead\">\n    <h2>Mikulovský zpravodaj<\/h2>\n    <div><span>Ročník XXXIV · číslo 9<\/span><span>září 2025<\/span><span>zdarma<\/span><\/div>\n  <\/div>\n  <h2 class=\"head\">„Zakopu tě ve vlastní vinici.“ Spor pavlovských vinařů se vyhrocuje<\/h2>\n  <div class=\"cols\">\n    <p>Na tradičním pavlovském vinobraní nebylo veselo všem. Před zraky desítek návštěvníků se pohádali dva místní vinaři, Richard Horák a Pavel Kříž, kteří spolu už čtvrtým rokem vedou spor o hranici pozemků na svahu pod Děvičkami.<\/p>\n    <p>Podle svědků přerostla výměna názorů v křik. „Jednou tě zakopu ve tvé vlastní vinici, Horáku,“ zaznělo podle několika přítomných od pana Kříže, kterého museli od stánku odvést přátelé. Pan Horák reagoval slovy, že se „uvidí u geodeta“.<\/p>\n    <p>Spor se týká pruhu přibližně šesti řádků vinic, který podle Kříže v devadesátých letech při restituci neoprávněně zabral otec Richarda Horáka. Nové zaměření pozemků je naplánováno na polovinu října. Obec se k věci vyjadřovat nechce.<\/p>\n    <p>Do Pavlova mezitím míří i velký kapitál. Pražská společnost Danubia Wine Invest podle našich informací během posledního roku koupila tři vinařství na Mikulovsku a jedná o dalších. „Nabízíme rodinám důstojný odchod a jistotu,“ uvedl pro Zpravodaj ředitel akvizic Ivo Mareš. Místní vinaři jsou však skeptičtí.<\/p>\n  <\/div>\n\n  <div style=\"background:#fff;margin-top:8mm;padding:6mm;border:.5px solid #999;font-family:'IBM Plex Sans',sans-serif;font-size:9pt;position:relative;transform:rotate(-.6deg)\">\n    <div style=\"font-weight:700\">Exekutorský úřad Brno-město · Mgr. Ondřej Hanák, soudní exekutor<\/div>\n    <div class=\"small muted\">Č. j. 128 EX 4417/25-31 · Nalezeno v bytě T. Horáka, Mikulov<\/div>\n    <p style=\"margin-top:3mm\"><b>Výzva ke splnění vymáhané povinnosti<\/b><\/p>\n    <p>Povinný: Tomáš Horák, nar. 1996, Mikulov, Náměstí 9. Oprávněný: Moravia Credit a.s. Vyzýváme Vás k úhradě vymáhané pohledávky ve výši <b>612 430 Kč<\/b> včetně příslušenství a nákladů exekuce do 15 dnů od doručení. V opačném případě bude přistoupeno k prodeji movitých věcí a k přikázání pohledávky z účtu.<\/p>\n    <p class=\"small\">V Brně dne 22. 9. 2025<\/p>\n  <\/div>\n<\/section>\n\n\n<section class=\"page\">\n  <div class=\"exhibit\">LIST 20<\/div>\n  <div class=\"doc-title\">KORESPONDENCE — I. MAREŠ<\/div>\n  <div class=\"doc-sub\">Zajištěno z notebooku I. Mareše se souhlasem majitele, 4. 10. 2025<\/div>\n  <div class=\"mail\">\n    <div class=\"hd\"><b>Od:<\/b> Ivo Mareš &lt;i.mares@danubiawine.cz&gt;<br><b>Komu:<\/b> Petra Lindnerová &lt;p.lindnerova@danubiawine.cz&gt;<br><b>Odesláno:<\/b> pátek 3. října 2025 22:51<br><b>Předmět:<\/b> Horák – Pavlov<\/div>\n    <div class=\"bd\">\n      <p>Petro,<\/p>\n      <p>Horák dnes odmítl. Bez protinávrhu, dost nepříjemně. Manželka je jednoznačně pro prodej, syn taky (a podle všeho je ve finančních problémech). Starý se ale nepohne.<\/p>\n      <p>Navrhuji počkat. Zkusím to ještě v pondělí přes syna, případně přes paní Horákovou. Až se situace v rodině změní, budeme první u stolu.<\/p>\n      <p>Pozemky pod Děvičkami jsou to nejlepší, co na Pálavě zbývá. Nechci o ně přijít kvůli jednomu tvrdohlavému dědkovi.<\/p>\n      <p>I.<\/p>\n    <\/div>\n  <\/div>\n\n  <div class=\"corp\" style=\"margin-top:8mm;border:.5px solid #bbb;padding:6mm;background:#fff\">\n    <div class=\"logo\">DANUBIA<span style=\"font-weight:400;color:#333\"> Wine Invest<\/span><\/div>\n    <div class=\"small muted\">Danubia Wine Invest a.s. · Na Příkopě 14, 110 00 Praha 1<\/div>\n    <p style=\"margin-top:4mm\"><b>Nezávazná nabídka na převzetí obchodního podílu<\/b><\/p>\n    <p>Vážený pane Horáku,<\/p>\n    <p>na základě našeho jednání Vám předkládáme nabídku na převzetí 100% obchodního podílu ve společnosti Vinařství Horák s.r.o. za kupní cenu <b>48 000 000 Kč<\/b>, včetně pozemků, budov, technologie a zásob vína. Součástí nabídky je možnost setrvání stávajícího personálu po dobu nejméně dvou let.<\/p>\n    <p>Nabídka platí do 31. 10. 2025.<\/p>\n    <p>S úctou<br><span class=\"hand\" style=\"font-size:18pt;color:#1d2f6b\">I. Mareš<\/span><br>Ing. Ivo Mareš, ředitel akvizic<\/p>\n    <div class=\"hand\" style=\"font-size:20pt;color:#c0281e;transform:rotate(-4deg);margin-top:2mm\">NE! — R.H.<\/div>\n  <\/div>\n  <p class=\"small muted sans\" style=\"margin-top:4mm\">Pozn. PO: Dle ustanovení společenské smlouvy přechází obchodní podíl po smrti společníka na dědice. Dědici ze zákona: manželka a syn, každý jedním dílem.<\/p>\n<\/section>\n\n\n<section class=\"page\">\n  <div class=\"exhibit\">LIST 21<\/div>\n  <div class=\"doc-title\">FOTODOKUMENTACE<\/div>\n  <div class=\"doc-sub\">k protokolu o ohledání místa činu ze dne 4. 10. 2025 (list 5) — čísla odpovídají bodům protokolu<\/div>\n  <div class=\"pols\"><div class=\"pol\"><svg viewBox=\"0 0 300 230\" xmlns=\"http://www.w3.org/2000/svg\"><defs><radialGradient id=\"vg1\" cx=\"50%\" cy=\"45%\" r=\"70%\"><stop offset=\"55%\" stop-color=\"#000\" stop-opacity=\"0\"/><stop offset=\"100%\" stop-color=\"#000\" stop-opacity=\".55\"/><\/radialGradient><\/defs><rect width=\"300\" height=\"230\" fill=\"#8a7d6c\"/><rect y=\"0\" width=\"300\" height=\"40\" fill=\"#3f352c\"/><path d=\"M0 60 L300 60\" stroke=\"#5e554a\" stroke-width=\"1.2\"/><path d=\"M0 102 L300 102\" stroke=\"#5e554a\" stroke-width=\"1.2\"/><path d=\"M0 144 L300 144\" stroke=\"#5e554a\" stroke-width=\"1.2\"/><path d=\"M0 186 L300 186\" stroke=\"#5e554a\" stroke-width=\"1.2\"/><path d=\"M0 228 L300 228\" stroke=\"#5e554a\" stroke-width=\"1.2\"/><path d=\"M20 40 L-19 230\" stroke=\"#5e554a\" stroke-width=\"1\"/><path d=\"M80 40 L59 230\" stroke=\"#5e554a\" stroke-width=\"1\"/><path d=\"M140 40 L137 230\" stroke=\"#5e554a\" stroke-width=\"1\"/><path d=\"M200 40 L215 230\" stroke=\"#5e554a\" stroke-width=\"1\"/><path d=\"M260 40 L293 230\" stroke=\"#5e554a\" stroke-width=\"1\"/>\n<rect x=\"0\" y=\"0\" width=\"58\" height=\"230\" fill=\"#4a2f1c\"/><rect x=\"50\" y=\"0\" width=\"8\" height=\"230\" fill=\"#2e1d11\"/>\n<circle cx=\"150\" cy=\"150\" r=\"44\" fill=\"#a69a87\"/><circle cx=\"150\" cy=\"150\" r=\"44\" fill=\"none\" stroke=\"#d6ccba\" stroke-width=\"5\" opacity=\".8\"/>\n<rect x=\"110\" y=\"205\" width=\"90\" height=\"9\" fill=\"#eee\" stroke=\"#333\" stroke-width=\".6\"/><line x1=\"110\" y1=\"205\" x2=\"110\" o;filter:sepia(.55) contrast(1.02)}\n.portr figcaption b{display:block;font-size:9.6pt}\n\n/* realism layer (src/realism.py) */\n.page::before{content:\"\";position:absolute;inset:0;pointer-events:none;z-index:50;mix-blend-mode:multiply;opacity:0.72;\n  background:url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .3  0 0 0 0 .25  0 0 0 .5 0'/><\/filter><rect width='100%' height='100%' filter='url(%23n)'/><\/svg>\"),url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.012 .04' numOctaves='2' seed='7'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .35  0 0 0 0 .28  0 0 0 .35 0'/><\/filter><rect width='100%' height='100%' filter='url(%23f)'/><\/svg>\"),radial-gradient(ellipse at 50% 45%,transparent 62%,rgba(90,70,40,0.158) 100%);\n  background-size:220px 220px,600px 600px,100% 100%}\n@media print{.page::before{opacity:.35}}\n", "html": "\n\n<section class=\"page cover nofoot\"><div class=\"frame\"><\/div><div class=\"frame2\"><\/div>\n<div class=\"n\">PŘÍPAD Č. 2<\/div>\n<h1>Zásnubní<br>přípitek<\/h1>\n<div class=\"k\">Vila Sýkora, Praha-Bubeneč · pátek 14. února 1936<\/div>\n<div style=\"margin-top:22mm;font:italic 10pt 'Old Standard TT',serif;color:#a8966a\">Spis obsahuje 21 příloh · obtížnost střední<br>asi 2–2,5 h · připravte si tužku a nůžky<\/div><div style=\"position:absolute;right:14mm;transform:rotate(3deg);top:16mm;width:62mm;padding:5mm 5mm 4mm;background:#fbe88a;color:#1d2f6b;font:500 15pt/1.15 Caveat,cursive;box-shadow:0 3px 8px rgba(0,0,0,.35);z-index:60;text-align:left\">Paní magistro,<br>tenhle spis z roku 1936 jsem vytáhla z archivu kvůli Vám. Kyanid ve slivovici. Policie tehdy podezírala syna.<div style=\"text-align:right;margin-top:2mm\">K. D.<\/div><\/div><\/section>\n<section class=\"page \"><div class=\"firm\"><div class=\"nm\">SÝKORA A SPOL.<\/div><div class=\"ad\">kovozboží a galvanizovna<br>Praha XVI — Smíchov, Plzeňská 61<br>telefon 409-77<\/div><\/div>\n<p style=\"text-align:right\">V Praze dne 20. února 1936<\/p>\n<p>Vážená paní, vážený pane,<\/p>\n<p>doporučil mi Vás můj advokát JUDr. Frey se slovy, že vidíte věci, které policie přehlédne. Píši Vám v situaci, kterou bych nepřál nikomu.<\/p>\n<p>V pátek 14. února jsem ve své vile v Bubenči slavil dvě věci najednou: dvacet pět let od založení naší firmy a své zasnoubení se slečnou Mií Danielovou. Po večeři jsme podle tradice měli s mým společníkem a nejstarším přítelem Ing. Otakarem Peškem připít z mé karafy staré slivovice. Já jsem ten večer pít nesměl. Otakar se napil — a za deset minut byl mrtev. V karafě byl kyanid.<\/p>\n<p>Policie je přesvědčena, že jed byl určen mně a že Otakar zemřel omylem. A podezírá mého syna Roberta, protože má dluhy, je mým dědicem a měl přístup k jedům v naší galvanizovně. Nevěřím, že by to Robert udělal. Ale už nevím, čemu věřit.<\/p>\n<p>Prostřednictvím svého advokáta jsem opatřil opisy všech policejních protokolů a dalších listin, které Vám přikládám. Prosím Vás o odpověď na tři otázky:<\/p>\n<ol style=\"margin:2mm 0 3mm 6mm\">\n<li><b>Úkol A — Komu byl jed určen?<\/b> Mně, nebo Otakarovi? Proč?<\/li>\n<li><b>Úkol B — Kdy se jed dostal do karafy?<\/b> Určete co nejpřesněji časové okno.<\/li>\n<li><b>Úkol C — Kdo to udělal a proč?<\/b><\/li>\n<\/ol>\n<p>Honorář Vám bude vyplacen bez ohledu na to, kam Vaše zjištění povedou.<\/p>\n<p style=\"margin-top:4mm\">S úctou<\/p>\n<p class=\"script\" style=\"font-size:26pt;color:#2b2a63;margin:0 0 1mm\">Ludvík Sýkora<\/p>\n<p class=\"small\">Ludvík Sýkora, továrník<\/p>\n<div class=\"box\" style=\"margin-top:6mm\"><b>Jak postupovat.<\/b> Píše se rok 1936: nejsou tu mobilní telefony ani kamery, jen lidé, hodiny a papíry. Přečtěte všechny přílohy a dělejte si poznámky. Nejvíc pomůže časová osa večera a plánek vily. Úkoly řešte popořadě; odpověď vždy napište na papír a teprve pak otevřete obálku se stejným písmenem. Ke každému úkolu existuje nápověda — berte je po jedné. Příloha 17 je šifrovací kotouč: vystřihněte ho, až ho budete potřebovat.<\/div><\/section>\n<section class=\"page \"><div class=\"tag\">Příloha 3<\/div><div class=\"inv\">\n<div class=\"deco\" style=\"letter-spacing:.3em;font-size:10pt;color:#8a6d2a\">SÝKORA A SPOL. · 1911 — 1936<\/div>\n<h2>Pozvání<\/h2>\n<p style=\"font-size:11pt\">Ludvík Sýkora si dovoluje pozvat Vás<br>k večeři při příležitosti<br><b>pětadvacátého výročí založení firmy<\/b><br>a svého zasnoubení se slečnou <b>Mií Danielovou<\/b>.<\/p>\n<p style=\"font-size:10pt;font-style:italic\">v pátek 14. února 1936 v 19 hodin<br>vila Sýkora, Praha XIX — Bubeneč, Na Zátorce 9<\/p>\n<div style=\"margin:5mm auto;width:40mm;border-top:1px solid #b08d3c\"><\/div>\n<div class=\"deco\" style=\"font-size:15pt;color:#6e1f26;letter-spacing:.2em\">JÍDELNÍ LÍSTEK<\/div>\n<div class=\"menu\">\n<b>19.00<\/b><span>Aperitiv v hale<\/span>\n<b>19.30<\/b><span>Hovězí vývar s játrovými knedlíčky<\/span>\n<span><\/span><span>Pstruh na másle, vařené brambory<\/span>\n<span><\/span><span>Svíčková pečeně na smetaně, karlovarský knedlík<\/span>\n<b>21.00<\/b><span>Dezert: Sacherův dort se šlehačkou<\/span>\n<b>21.15<\/b><span>Černá káva v salonu<\/span>\n<b>21.30<\/b><span>Tradiční přípitek společníků — stará slivovice z roku 1928<\/span>\n<\/div><\/div>\n<div class=\"box\" style=\"margin-top:9mm\"><b>Opis — poznámka advokáta JUDr. Freye:<\/b> Tradiční přípitek: Každý rok 14. února, v den založení firmy, pijí pan Sýkora a Ing. Pešek každý jednu sklenku slivovice z osobní karafy pana Sýkory. Z této karafy jinak nikdo nepije — je to známý domácí zvyk a všichni členové rodiny i služebnictvo o něm vědí. Sklenky se pijí naráz.<\/div>\n<div class=\"box\"><b>Hosté u stolu:<\/b> Ludvík Sýkora, Mia Danielová, Ing. Otakar Pešek, Helena Roubalová, MUDr. Karel Ro
