dard TT',serif\">\n<rect x=\"164\" y=\"74\" width=\"320\" height=\"60\" rx=\"3\" fill=\"#d9c9a6\" opacity=\".6\"/>\n<rect x=\"160\" y=\"70\" width=\"320\" height=\"60\" rx=\"3\" fill=\"#f4ead2\" stroke=\"#221d17\" stroke-width=\"1.5\"/>\n<path d=\"M170 100 h300\" stroke=\"#c9b48a\" stroke-width=\".6\" stroke-dasharray=\"4 3\"/>\n<g fill=\"#fff\" stroke=\"#221d17\" stroke-width=\".7\"><circle cx=\"230\" cy=\"84\" r=\"9\"/><circle cx=\"330\" cy=\"84\" r=\"9\"/><circle cx=\"230\" cy=\"116\" r=\"9\"/><circle cx=\"330\" cy=\"116\" r=\"9\"/><circle cx=\"176\" cy=\"100\" r=\"9\"/><circle cx=\"464\" cy=\"100\" r=\"9\"/><\/g>\n<g fill=\"none\" stroke=\"#9b8a69\" stroke-width=\".7\"><circle cx=\"230\" cy=\"84\" r=\"5\"/><circle cx=\"330\" cy=\"84\" r=\"5\"/><circle cx=\"230\" cy=\"116\" r=\"5\"/><circle cx=\"330\" cy=\"116\" r=\"5\"/><circle cx=\"176\" cy=\"100\" r=\"5\"/><circle cx=\"464\" cy=\"100\" r=\"5\"/><\/g>\n<g fill=\"#ece0c2\" stroke=\"#221d17\" stroke-width=\".8\"><rect x=\"216\" y=\"56\" width=\"28\" height=\"12\" rx=\"3\"/><rect x=\"316\" y=\"56\" width=\"28\" height=\"12\" rx=\"3\"/><rect x=\"216\" y=\"132\" width=\"28\" height=\"12\" rx=\"3\"/><rect x=\"316\" y=\"132\" width=\"28\" height=\"12\" rx=\"3\"/><rect x=\"142\" y=\"86\" width=\"12\" height=\"28\" rx=\"3\"/><rect x=\"486\" y=\"86\" width=\"12\" height=\"28\" rx=\"3\"/><\/g>\n<g fill=\"#b08d3c\" opacity=\".7\"><circle cx=\"390\" cy=\"100\" r=\"6\"/><circle cx=\"410\" cy=\"100\" r=\"6\"/><\/g>\n<g font-size=\"11\" text-anchor=\"middle\">\n<text x=\"105\" y=\"104\" font-weight=\"700\">L. Sýkora<\/text><text x=\"105\" y=\"118\" font-size=\"9\">(čelo stolu)<\/text>\n<text x=\"230\" y=\"45\">M. Danielová<\/text><text x=\"330\" y=\"45\">MUDr. K. Roubal<\/text>\n<text x=\"230\" y=\"162\">Ing. O. Pešek<\/text><text x=\"330\" y=\"162\">H. Roubalová<\/text>\n<text x=\"545\" y=\"104\" font-weight=\"700\">R. Sýkora<\/text><text x=\"545\" y=\"118\" font-size=\"9\">(konec stolu)<\/text>\n<\/g><\/svg><\/section>\n<section class=\"page \"><div class=\"tag\">Příloha 5<\/div><div class=\"ph\"><div class=\"a\">POLICEJNÍ ŘEDITELSTVÍ V PRAZE<\/div><div class=\"b\">Kriminální ústředna — oddělení pro trestné činy proti životu<\/div><\/div>\n<div class=\"ptitle\">HLÁŠENÍ<\/div><div class=\"psub\">o události ze dne 14. února 1936, sepsané policejním radou JUDr. Janem Kubešem<\/div><div class=\"tw\">\n<p>Dne 14. 2. 1936 ve 21.47 hod. oznámil telefonicky komorník František Bláha z vily Na Zátorce 9 v Bubenči náhlé úmrtí hosta. Na místo jsem se dostavil ve 22.10 s policejním lékařem MUDr. Stachem a dvěma strážníky.<\/p>\n<p>Zemřelý: Ing. Otakar PEŠEK, nar. 1878, vdovec, chemik, společník firmy Sýkora a spol., bytem Praha XVI, Holečkova 12.<\/p>\n<p>Dle souhlasných výpovědí přítomných přinesl komorník ve 21.30 do salonu na stříbrném podnosu karafu se slivovicí a dvě sklenky. Pan Sýkora oznámil, že ze zdravotních důvodů pít nesmí. Poté nalil jednu sklenku a podal ji Ing. Peškovi, který ji okolo 21.35 vypil naráz. Asi za dvě minuty se zhroutil. MUDr. Roubal, přítomný host, se mu snažil pomoci. Smrt nastala ve 21.44.<\/p>\n<p>Karafa, obě sklenky, šálky od kávy a láhev, ze které byla karafa plněna, byly zajištěny a zaslány k chemickému rozboru.<\/p>\n<p>Předběžný závěr: Vzhledem k tomu, že z karafy pije výhradně pan Sýkora, jde nejspíše o pokus o otravu pana Sýkory, při němž omylem zemřel Ing. Pešek. Pozornost je třeba věnovat synovi Robertu Sýkorovi (dluhy, dědic, přístup k jedům v galvanizovně otce).<\/p>\n<\/div>\n<h3 class=\"s\">Osoby přítomné ve vile<\/h3>\n<table class=\"t\">\n<tr><td><b>Ludvík Sýkora<\/b> (61)<\/td><td>továrník, hostitel, majitel firmy (60 %)<\/td><\/tr>\n<tr><td><b>Ing. Otakar Pešek<\/b> (58)<\/td><td>zemřelý; společník (40 %), vede galvanizovnu<\/td><\/tr>\n<tr><td><b>Mia (Marie) Danielová<\/b> (27)<\/td><td>herečka, snoubenka pana Sýkory; svatba plánována na červen<\/td><\/tr>\n<tr><td><b>Robert Sýkora<\/b> (31)<\/td><td>syn, prokurista firmy<\/td><\/tr>\n<tr><td><b>Helena Roubalová<\/b> (34)<\/td><td>dcera<\/td><\/tr>\n<tr><td><b>MUDr. Karel Roubal<\/b> (39)<\/td><td>zeť, praktický lékař na Vinohradech, od podzimu ošetřující lékař pana Sýkory a závodní lékař firmy<\/td><\/tr>\n<tr><td><b>František Bláha<\/b> (63)<\/td><td>komorník, ve službě u Sýkorů 30 let<\/td><\/tr>\n<tr><td><b>Anna Kučerová<\/b> (19)<\/td><td>služka<\/td><\/tr>\n<tr><td><b>Marie Vondrová<\/b> (55)<\/td><td>kuchařka<\/td><\/tr>\n<\/table>\n<div class=\"rstamp\" style=\"right:22mm;bottom:22mm\">POLICEJNÍ ŘEDITELSTVÍ V PRAZE · KRIMINÁLNÍ ÚSTŘEDNA<\/div>\n<div class=\"sig\"><div><span class=\"s\">Kubeš<\/span>JUDr. Jan Kubeš, policejní rada<\/div><div><span class=\"s\"><\/span>Praha, 15. 2. 1936<\/div><\/div><\/section>\n<section class=\"page \"><div class=\"tag\">Příloha 6<\/div><div class=\"ph\"><div class=\"a\">POLICEJNÍ ŘEDITELSTVÍ V PRAZE<\/div><div class=\"b\">Kriminální ústředna — oddělení pro trestné činy proti životu<\/div><\/div>\n<div class=\"ptitle\">LÉKAŘSKÝ NÁLEZ A CHEMICKÝ ROZBOR<\/div><div class=\"psub\">výtah ze zpráv policejního lékaře a Ústavu soudního lékařství Karlovy university<\/div><h3 class=\"s\">Ohledání mrtvoly (MUDr. Rudolf Stach, policejní lékař, 14. 2. 1936, 22.25)<\/h3>\n<div class=\"tw\"><p>Tělo v salonu na koberci. Obličej růžově zbarven, z úst nasládlý zápach po hořkých mandlích. Zornice rozšířené. Na těle žádná zranění. Nález odpovídá otravě kyanidem. Smrt dle svědků ve 21.44; nález tomu odpovídá. Kyanid draselný působí po požití ve smrtelné dávce během několika málo minut.<\/p><\/div>\n<h3 class=\"s\">Chemický rozbor (doc. Dr. V. Hanzlík, 17. 2. 1936)<\/h3>\n<table class=\"t\">\n<tr><th>Vzorek<\/th><th>Výsledek<\/th><\/tr>\n<tr><td>Křišťálová karafa, zbytek obsahu (cca 340 ml)<\/td><td><b>Kyanid draselný prokázán<\/b>, rozpuštěn rovnoměrně v celém obsahu; množství v jedné sklence (cca 40 ml) vysoce převyšuje smrtelnou dávku<\/td><\/tr>\n<tr><td>Sklenka vypitá Ing. Peškem<\/td><td>Kyanid draselný prokázán (zbytky téže slivovice)<\/td><\/tr>\n<tr><td>Druhá sklenka na podnosu (nepoužitá)<\/td><td>Negativní, čistá<\/td><\/tr>\n<tr><td>Láhev slivovice r. 1928 ze spíže, z níž byla karafa plněna<\/td><td>Negativní<\/td><\/tr>\n<tr><td>Šálky od kávy (6 ks), konvice, cukřenka<\/td><td>Negativní<\/td><\/tr>\n<tr><td>Obsah žaludku zemřelého<\/td><td>Kyanid prokázán; jinak zbytky večeře a dortu<\/td><\/tr>\n<\/table>\n<div class=\"box\">Poznámka znalce: Kyanid draselný je bílá krystalická látka, ve vodě se rozpouští velmi snadno, ve slivovici (zhruba z poloviny voda) během minuty. Jeho hořkomandlový pach je ve staré slivovici, pálené i s peckami, téměř nepostřehnutelný. Ke smrtelné otravě postačí asi 0,2 g. Do karafy bylo dle koncentrace přidáno přibližně 12–15 g, tedy mnohonásobně více. Kdo by z karafy upil kdykoli po přidání jedu, zemřel by do několika minut.<\/div><div class=\"sig\"><div><span class=\"s\">Stach<\/span>MUDr. Rudolf Stach<\/div><div><span class=\"s\">Hanzlík<\/span>doc. Dr. V. Hanzlík<\/div><\/div><\/section>\n<section class=\"page \"><div class=\"tag\">Příloha 7<\/div><div class=\"ph\"><div class=\"a\">POLICEJNÍ ŘEDITELSTVÍ V PRAZE<\/div><div class=\"b\">Kriminální ústředna — oddělení pro trestné činy proti životu<\/div><\/div>\n<div class=\"ptitle\">PROTOKOL<\/div><div class=\"psub\">sepsaný dne 15. února 1936 na Policejním ředitelství v Praze<\/div><p class=\"small\"><b>Vyslýchán(a):<\/b> Ludvík SÝKORA, nar. 1875, továrník, Praha XIX, Na Zátorce 9. Poučen(a) o povinnosti vypovídat pravdu udává:<\/p><div class=\"tw\">\n<p>Otakar byl můj nejbližší přítel. Firmu jsme založili spolu 14. února 1911. Každý rok v tento den si připíjíme z mé karafy, je to náš zvyk. Poslední týdny byl Otakar zamlklý. Ve středu mi řekl: „Ludvíku, v sobotu ti musím něco říct, ale až po výročí. Nechci ti kazit oslavu.“ Co to bylo, už se nedozvím.<\/p>\n<p class=\"q\">Proč jste ten večer nepil?<\/p><p>Můj zeť, Dr. Roubal, mě v pátek ve 4 odpoledne navštívil kvůli výsledkům moči. Mám cukrovku. Řekl, že výsledky nejsou dobré, že ten večer nesmím ani kapku alkoholu a že mi druhý den v 7 ráno nalačno udělá odběr krve. Dal mi to i písemně. Nikomu jsem to neřekl, styděl jsem se. Víno jsem si u večeře nechal nalít, ale nepil jsem; nikdo si toho nevšiml. Oznámil jsem to až při přípitku.<\/p>\n<p class=\"q\">Kdo navrhl, aby Ing. Pešek pil sám?<\/p><p>Už přesně nevím, kdo to řekl první. Snad Karel, snad Otakar sám. Padlo: „Ať se Otakar napije za vás oba, ať tradice nepřijde vniveč.“ Tak jsem mu nalil.<\/p>\n<p class=\"q\">Zajímal se o přípitek někdo předem?<\/p><p>Ve čtvrtek večer kolem šesté mi volal Karel. Ptal se, jestli i letos budeme s Otakarem pít z karafy.<\/p>\n<p class=\"q\">Opustil jste během večeře stůl?<\/p><p>Ne. Od půl osmé do přechodu do salonu jsem seděl u stolu.<\/p>\n<p class=\"q\">Kdo po Vás dědí?<\/p><p>Podle závěti syn a dcera rovným dílem. Slečna Danielová bude zahrnuta až po sňatku. Otakarův podíl podle společenské smlouvy připadá po jeho smrti firmě.<\/p><\/div><div class=\"sig\"><div><span class=\"s\">L. Sýkora<\/span>podpis vyslýchaného<\/div><div><span class=\"s\">Kubeš<\/span>JUDr. J. Kubeš, policejní rada<\/div><\/div><\/section>\n<section class=\"page \"><div class=\"tag\">Příloha 8<\/div><div class=\"ph\"><div class=\"a\">POLICEJNÍ ŘEDITELSTVÍ V PRAZE<\/div><div class=\"b\">Kriminální ústředna — oddělení pro trestné činy proti životu<\/div><\/div>\n<div class=\"ptitle\">PROTOKOL<\/div><div class=\"psub\">sepsaný dne 15. února 1936 na Policejním ředitelství v Praze<\/div><p class=\"small\"><b>Vyslýchán(a):<\/b> MUDr. Karel ROUBAL, nar. 1897, praktický lékař, Praha XII, Fochova 48. Poučen(a) o povinnosti vypovídat pravdu udává:<\/p><div class=\"tw\">\n<p>Tchána léčím od podzimu na cukrovku. V pátek odpoledne jsem mu přinesl výsledky. Byly špatné, proto jsem mu zakázal alkohol a na sobotu ráno nařídil odběr krve nalačno. To je běžný postup. Nikomu jinému jsem to neřekl, ani manželce — lékařské tajemství.<\/p>\n<p class=\"q\">Kdo navrhl, aby Ing. Pešek pil sám?<\/p><p>Už si přesně nevzpomínám. Myslím, že tchán sám.<\/p>\n<p class=\"q\">Opustil jste během večeře jídelnu?<\/p><p>Jednou, krátce, asi pět minut po deváté. Šel jsem si do kabátu v šatně pro cigarety. Pak jsem se vrátil ke stolu.<\/p>\n<p class=\"q\">Co se stalo po přípitku?<\/p><p>Ing. Pešek se po chvíli chytil za hrdlo a zhroutil se. Ucítil jsem hořké mandle a hned mi bylo jasné, že je to kyanid. Pomoci se už nedalo.<\/p>\n<p class=\"q\">Znáte galvanizovnu firmy?<\/p><p>Jako závodní lékař ji kontroluji. 7. února jsem tam prováděl prohlídku včetně skladu jedů. Doprovázel mě Ing. Pešek.<\/p>\n<p class=\"q\">Měl jste s Ing. Peškem nějaké finanční vztahy?<\/p><p>Ne. Žádné.<\/p>\n<p class=\"q\">Kdo podle Vás mohl chtít otrávit tchána?<\/p><p>Nerad to říkám, ale Robert dluží peníze nebezpečným lidem. A v galvanizovně si bere, co chce.<\/p><\/div><div><\/div><div class=\"sig\"><div><span class=\"s\">K. Roubal<\/span>podpis vyslýchaného<\/div><div><span class=\"s\">Kubeš<\/span>JUDr. J. Kubeš, policejní rada<\/div><\/div><\/section>\n<section class=\"page \"><div class=\"tag\">Příloha 9<\/div><div class=\"ph\"><div class=\"a\">POLICEJNÍ ŘEDITELSTVÍ V PRAZE<\/div><div class=\"b\">Kriminální ústředna — oddělení pro trestné činy proti životu<\/div><\/div>\n<div class=\"ptitle\">PROTOKOL<\/div><div class=\"psub\">sepsaný dne 15. února 1936 na Policejním ředitelství v Praze<\/div><p class=\"small\"><b>Vyslýchán(a):<\/b> Helena ROUBALOVÁ, roz. Sýkorová, nar. 1901, v domácnosti, Praha XII, Fochova 48. Poučen(a) o povinnosti vypovídat pravdu udává:<\/p><div class=\"tw\">\n<p>Na večeři jsme přišli s manželem v sedm. Celou večeři jsem seděla u stolu. Kolem deváté si Karel odskočil do kabátu pro cigarety, byl pryč chvilku.<\/p>\n<p class=\"q\">Věděla jste, že otec nesmí pít?<\/p><p>Ne, dozvěděla jsem se to až při přípitku, jako všichni. Karel o pacientech doma nemluví.<\/p>\n<p class=\"q\">Opustila jste salon po večeři?<\/p><p>Ano, asi tři minuty po čtvrt na deset jsem šla do šatny pro šál, v salonu byla zima. Robert šel za mnou do haly a zase po mně chtěl peníze. Pohádali jsme se. Stáli jsme u šatny, než se vrátil do salonu, mohlo to být nějakých pět, šest minut. Pak jsem se vrátila i já.<\/p>\n<p class=\"q\">Kdo navrhl, aby Ing. Pešek pil sám?<\/p><p>Tatínek, myslím. Nebo… nevím. Bylo to rychlé.<\/p>\n<p class=\"q\">Jak vychází Váš manžel s Ing. Peškem?<\/p><p>Dobře. Strýček Otakar — tak jsme mu odmalička říkali — byl můj kmotr. Karel si ho vážil.<\/p>\n<p class=\"q\">Jak vychází s otcem Váš bratr?<\/p><p>Robert je lehkomyslný. Ale tatínkovi by nikdy neublížil.<\/p><\/div><div class=\"sig\"><div><span class=\"s\">H. Roubalová<\/span>podpis vyslýchané<\/div><div><span class=\"s\">Kubeš<\/span>JUDr. J. Kubeš, policejní rada<\/div><\/div><\/section>\n<section class=\"page \"><div class=\"tag\">Příloha 10<\/div><div class=\"ph\"><div class=\"a\">POLICEJNÍ ŘEDITELSTVÍ V PRAZE<\/div><div class=\"b\">Kriminální ústředna — oddělení pro trestné činy proti životu<\/div><\/div>\n<div class=\"ptitle\">PROTOKOL<\/div><div class=\"psub\">sepsaný dne 15. února 1936 na Policejním ředitelství v Praze<\/div><p class=\"small\"><b>Vyslýchán(a):<\/b> Robert SÝKORA, nar. 1905, prokurista, Praha XIX, Na Zátorce 9. Poučen(a) o povinnosti vypovídat pravdu udává:<\/p><div class=\"tw\">\n<p>Vím, co si o mně myslíte. Ano, mám dluhy. Patnáct tisíc u sázkové kanceláře pana Krause. Ale otce bych nikdy neotrávil, a strýce Otakara už vůbec ne.<\/p>\n<p class=\"q\">Opustil jste během večeře jídelnu?<\/p><p>Ano. Asi deset minut po osmé mě Bláha zavolal k telefonu do haly, volal pan Kraus kvůli dluhu. Mluvil jsem s ním asi deset minut, Bláha stál celou dobu v hale u dveří jídelny. Pak jsem se vrátil ke stolu a už jsem neodešel až do přechodu do salonu.<\/p>\n<p class=\"q\">A po večeři?<\/p><p>Šel jsem za Helenou do haly, chtěl jsem si od ní půjčit. Pohádali jsme se u šatny. Celou dobu jsme stáli spolu. Pak jsem se vrátil do salonu.<\/p>\n<p class=\"q\">10. února jste v galvanizovně vyzvedl ze skladu jedů kyanid. Proč?<\/p><p>Dva gramy na zkoušku nové lázně. Vydával mi je mistr Hájek a stál u toho, je to zapsané. Celé dva gramy šly do lázně, mistr to potvrdí.<\/p>\n<p class=\"q\">Věděl jste, že otec ten večer nesmí pít?<\/p><p>Ne. Kdybych to věděl, řekl bych mu, ať si jednu sklenku dá, tradice je tradice.<\/p>\n<p class=\"q\">Kdo navrhl, aby Ing. Pešek pil sám?<\/p><p>Karel. Pamatuju si to dobře, protože mě to naštvalo — co se plete do tradice.<\/p><\/div><div class=\"sig\"><div><span class=\"s\">R. Sýkora<\/span>podpis vyslýchaného<\/div><div><span class=\"s\">Kubeš<\/span>JUDr. J. Kubeš, policejní rada<\/div><\/div><\/section>\n<section class=\"page \"><div class=\"tag\">Příloha 11<\/div><div class=\"ph\"><div class=\"a\">POLICEJNÍ ŘEDITELSTVÍ V PRAZE<\/div><div class=\"b\">Kriminální ústředna — oddělení pro trestné činy proti životu<\/div><\/div>\n<div class=\"ptitle\">PROTOKOL<\/div><div class=\"psub\">sepsaný dne 15. února 1936 na Policejním ředitelství v Praze<\/div><p class=\"small\"><b>Vyslýchán(a):<\/b> Mia (Marie) DANIELOVÁ, nar. 1909, herečka Vinohradského divadla, Praha XII, Mánesova 22. Poučen(a) o povinnosti vypovídat pravdu udává:<\/p><div class=\"tw\">\n<p>S Ludvíkem se známe rok. Zasnoubení jsme oznámili při večeři. Vím, co si lidé myslí — mladá herečka a bohatý vdovec. Ale dokud nejsme svoji, nemám z jeho peněz nic, a po jeho smrti bych neměla nic vůbec.<\/p>\n<p class=\"q\">Opustila jste během večeře jídelnu?<\/p><p>Jednou, asi ve 20.40, šla jsem se upravit. Vrátila jsem se asi za sedm minut, ještě před dezertem.<\/p>\n<p class=\"q\">Co jste viděla během večeře?<\/p><p>Pan doktor seděl vedle mě. Asi v půl deváté mi nabízel cigaretu ze své stříbrné tabatěrky, byla plná, vzala jsem si jednu. Tabatěrku si pak strčil zpátky do saka. Kolem deváté, když se nosil dort, se zvedl a odešel. Říkal, že jde pro cigarety. Byl pryč asi pět minut.<\/p>\n<p class=\"q\">Kdo navrhl, aby Ing. Pešek pil sám?<\/p><p>Pan doktor Roubal. Ludvík chvíli váhal, ale pak nalil.<\/p>\n<p class=\"q\">Je pravda, že jste studovala farmacii?<\/p><p>Dva semestry, než jsem odešla k divadlu. Ano, vím, co je kyanid. To ví každý, kdo čte detektivky.<\/p>\n<p class=\"q\">Sahal někdo v salonu na karafu, než nalil pan Sýkora?<\/p><p>Ne. Bláha postavil podnos na stolek, Ludvík vstal, promluvil a nalil. Všichni jsme se dívali.<\/p><\/div><div class=\"sig\"><div><span class=\"s\">M. Danielová<\/span>podpis vyslýchané<\/div><div><span class=\"s\">Kubeš<\/span>JUDr. J. Kubeš, policejní rada<\/div><\/div><\/section>\n<section class=\"page \"><div class=\"tag\">Příloha 12<\/div><div class=\"ph\"><div class=\"a\">POLICEJNÍ ŘEDITELSTVÍ V PRAZE<\/div><div class=\"b\">Kriminální ústředna — oddělení pro trestné činy proti životu<\/div><\/div>\n<div class=\"ptitle\">PROTOKOL<\/div><div class=\"psub\">sepsaný dne 15. února 1936, doplněn dne 17. února 1936<\/div><p class=\"small\"><b>Vyslýchán:<\/b> František BLÁHA, nar. 1873, komorník, Praha XIX, Na Zátorce 9.<\/p>\n<div class=\"tw\">\n<p><b>15. 2.:<\/b> Karafu jsem naplnil v půl sedmé večer z nové láhve slivovice z roku 1928 ze spíže. Postavil jsem ji do pracovny na psací stůl pana továrníka, jako každý rok. Během večeře jsem obsluhoval s Annou. Ve 20.10 zazvonil telefon, volal pan Kraus pro pana Roberta. Zavolal jsem ho a čekal jsem v hale u dveří jídelny, než domluvil, asi deset minut. Ve 21 hodin jsem podával dezert a víno. Pan doktor Roubal se hned, jak jsem začal podávat, zvedl a odešel do haly; vrátil se, když jsem doléval víno, tak za pět, šest minut. Během dezertu nikdo jiný od stolu neodešel. Od 21.10 jsem byl v pracovně a leštil sklenky na přípitek — pan inženýr byl na skleničky háklivý. Byl jsem tam sám až do 21.28, dveře do haly byly pootevřené. Nikdo do pracovny nevešel. Slyšel jsem, jak se v hale u šatny hádá milostpaní Helena s panem Robertem. Ve 21.30 jsem odnesl podnos s karafou a dvěma sklenkami do salonu.<\/p>\n<p><b>Na otázku:<\/b> Z karafy jsem nepil. Nikdy bych si to nedovolil.<\/p>\n<p><b>Na otázku:<\/b> Proč jsem připravil dvě sklenky? Jako každý rok. Nevěděl jsem, že pan továrník pít nesmí.<\/p>\n<p><b>17. 2. — doplnění po konfrontaci s výpovědí A. Kučerové:<\/b> Musím se přiznat a stydím se za to. Těsně předtím, než jsem šel podávat dezert, když jsem šel kolem pracovny, jsem si z karafy loknul. Přímo z hrdla, jeden pořádný lok. Dělám to tak, když se nikdo nedívá, je to stará slivovice a pan továrník ji pije málokdy. Nic mi nebylo. Pak jsem šel do jídelny podávat dezert.<\/p>\n<\/div><div class=\"sig\"><div><span class=\"s\">F. Bláha<\/span>podpis vyslýchaného<\/div><div><span class=\"s\">Kubeš<\/span>JUDr. J. Kubeš, policejní rada<\/div><\/div><\/section>\n<section class=\"page \"><div class=\"tag\">Příloha 13<\/div><div class=\"ph\"><div class=\"a\">POLICEJNÍ ŘEDITELSTVÍ V PRAZE<\/div><div class=\"b\">Kriminální ústředna — oddělení pro trestné činy proti životu<\/div><\/div>\n<div class=\"ptitle\">PROTOKOLY<\/div><div class=\"psub\">sepsané dne 16. února 1936 ve vile Na Zátorce 9<\/div><p class=\"small\"><b>Vyslýchána:<\/b> Anna KUČEROVÁ, nar. 1917, služka.<\/p>\n<div class=\"tw\">\n<p>Během večeře jsem nosila jídlo z kuchyně přes halu do jídelny. Těsně před devátou jsem nesla talířky na dezert. Dveře do pracovny byly pootevřené a viděla jsem pana Bláhu, jak pije z karafy pana továrníka, přímo z hrdla. Dělá to často, když se nikdo nedívá. Talířky jsem položila v jídelně a hned jsem běžela zpátky do kuchyně a řekla to paní Vondrové, smály jsme se tomu. Ještě předtím, tak ve tři čtvrtě na devět, jsem v hale viděla slečnu Danielovou u telefonu. Mluvila šeptem a hned zavěsila. Od deváté jsem byla v kuchyni a myla nádobí až do 21.20, kdy jsem nesla kávu do salonu. V hale u šatny se hádali milostpaní Helena a pan Robert, stáli spolu. Když jsem se asi ve 21.23 vracela, stáli tam pořád. Dveře pracovny byly pootevřené a v pracovně svítilo, pan Bláha tam leštil sklenky.<\/p>\n<p><b>Na otázku:<\/b> Pan doktor? Toho jsem v hale neviděla. Ale v pět minut po deváté jsem byla v kuchyni.<\/p>\n<\/div>\n<p class=\"small\" style=\"margin-top:4mm\"><b>Vyslýchána:<\/b> Marie VONDROVÁ, nar. 1881, kuchařka.<\/p>\n<div class=\"tw\">\n<p>Anna přiběhla do kuchyně a smála se, že Bláha zase upíjí panu továrníkovi z karafy. Vím přesně, kdy to bylo: měla jsem puštěné rádio a hned potom začaly zprávy v devět hodin. Anna pak byla se mnou v kuchyni od zpráv až do kávy, to vím jistě. Bláha se v kuchyni ukázal až po přípitku, celý bledý, že pan inženýr umírá. Ven z kuchyně jsem ten večer nešla.<\/p>\n<\/div><div class=\"sig\"><div><span class=\"s\">A. K.   M. V.<\/span>A. Kučerová / M. Vondrová<\/div><div><span class=\"s\">Kubeš<\/span>JUDr. J. Kubeš, policejní rada<\/div><\/div><\/section>\n<section class=\"page \"><div class=\"tag\">Příloha 14<\/div><div class=\"ptitle\" style=\"margin-top:2mm\">LISTINY ZAJIŠTĚNÉ U L. SÝKORY A V ORDINACI MUDr. ROUBALA<\/div><div class=\"psub\">opisy přiložené advokátem JUDr. Freyem<\/div>\n<div style=\"background:#fff;border:.5px solid #999;width:130mm;margin:3mm auto 0;padding:7mm 8mm;box-shadow:1px 2px 4px rgba(0,0,0,.2);transform:rotate(-1deg)\">\n<div style=\"display:flex;justify-content:space-between;border-bottom:1px solid #333;padding-bottom:2mm;margin-bottom:4mm\"><div><b>MUDr. Karel Roubal<\/b><br><span class=\"small\">praktický lékař<\/span><\/div><div class=\"small\" style=\"text-align:right\">Praha XII, Fochova 48<br>ordinace 8–11, 15–17, mimo neděli<\/div><\/div>\n<div class=\"hand\" style=\"font-size:14pt;line-height:1.5;color:#1f2a55\">Vážený pane továrníku,<br>výsledky moči nejsou dobré. Dnes ani kapku alkoholu — ani na přípitek! Zítra v sobotu 15. 2. v 7 h ráno nalačno odběr krve u mne v ordinaci. Insulin dnes večer místo obvyklých 20 jednotek 30. Prosím, nikomu nic neříkejte, ať se zbytečně nestrachují.<br><span style=\"float:right\">Roubal 14/2<\/span><\/div>\n<div style=\"clear:both\"><\/div><p class=\"small muted\" style=\"margin-top:3mm\">Nalezeno v náprsní tašce L. Sýkory.<\/p><\/div>\n\n<h3 class=\"s\" style=\"margin-top:9mm\">Objednávková kniha ordinace MUDr. Roubala — výňatek (zajištěno 19. 2. 1936)<\/h3>\n<div class=\"ledger\" style=\"padding:3mm\">\n<table><tr><th style=\"width:28mm\">Den<\/th><th>Zápis<\/th><\/tr>\n<tr><td>Čt 13. 2.<\/td><td>8.30 Nováková – kontrola · 9.15 Pospíšil – injekce · 15.00 Ing. Matějka · 16.30 p. Lukešová<\/td><\/tr>\n<tr><td>Pá 14. 2.<\/td><td>8.15 Svoboda · 9.00 Krejčí · 10.00 Vávrová · odpoledne ordinace zrušena — návštěva tchán (výsl. moči), večer Bubeneč<\/td><\/tr>\n<tr><td>So 15. 2.<\/td><td><b>ORDINACE ZAVŘENA.<\/b> Odjezd rychlíkem do Brna 6.40 — sjezd Ústřední jednoty čs. lékařů, návrat v neděli večer. Zástup: MUDr. Brož, Korunní 30.<\/td><\/tr>\n<tr><td>Po 17. 2.<\/td><td>8.00 Šťastná · 8.30 Kubíček – odběr · 9.30 Dvořák …<\/td><\/tr>\n<\/table><\/div>\n<div class=\"box\">Pozn. advokáta: Ústřední jednota čs. lékařů potvrdila, že MUDr. Roubal byl na sjezd v Brně přihlášen již 20. ledna 1936 a zaplatil ubytování na 15. a 16. února.<\/div><\/section>\n<section class=\"page \"><div class=\"tag\">Příloha 15<\/div><div class=\"ptitle\">KNIHA JEDŮ<\/div><div class=\"psub\">galvanizovna firmy Sýkora a spol., Smíchov — kyanid draselný (KCN), únor 1936 — opis<\/div>\n<div class=\"ledger\"><table>\n<tr><th>Datum<\/th><th>Pohyb<\/th><th>Množství<\/th><th>Účel / poznámka<\/th><th>Podpis<\/th><\/tr>\n<tr><td>3. 2.<\/td><td>výdej<\/td><td>20 g<\/td><td>lázeň č. 2<\/td><td>O. Pešek<\/td><\/tr>\n<tr><td>4. 2.<\/td><td>výdej<\/td><td>15 g<\/td><td>lázeň č. 3<\/td><td>O. Pešek<\/td><\/tr>\n<tr><td>6. 2.<\/td><td>inventura<\/td><td>stav 512 g<\/td><td>souhlasí<\/td><td>O. Pešek, J. Hájek<\/td><\/tr>\n<tr><td>7. 2.<\/td><td>—<\/td><td>—<\/td><td>prohlídka skladu jedů závodním lékařem MUDr. Roubalem (doprovod Ing. Pešek)<\/td><td>O. Pešek, K. Roubal<\/td><\/tr>\n<tr><td>10. 2.<\/td><td>výdej<\/td><td>2 g<\/td><td>zkouška nové lázně — vydal mistr Hájek, odvážil a do lázně vsypal za jeho přítomnosti<\/td><td>R. Sýkora, J. Hájek<\/td><\/tr>\n<tr><td>12. 2.<\/td><td>inventura<\/td><td>stav 495 g<\/td><td>má být 510 g — <b>CHYBÍ 15 g !!<\/b> Kdo? — O. P.<\/td><td>O. Pešek<\/td><\/tr>\n<\/table><\/div>\n<div class=\"box\" style=\"margin-top:5mm\">Pozn. policie (výpověď mistra Josefa Hájka, 17. 2.): Sklad jedů je uzamčen, klíče mají pouze Ing. Pešek a mistr Hájek. Výdej panu Robertovi 10. 2. proběhl za mé přítomnosti, oba gramy jsem sám vsypal do zkušební lázně. Pan Robert ve skladu jinak nebyl. 7. 2. byl pan doktor ve skladu s panem inženýrem; pana inženýra mezitím odvolali k telefonu do kanceláře a pan doktor zůstal ve skladu asi deset minut sám, já byl u lázní. Zamykal jsem až po jejich odchodu.<\/div>\n<div class=\"box\">Pozn. advokáta: Ing. Pešek chybějících 15 g nikomu neoznámil. Mistr Hájek uvádí, že Ing. Pešek byl od té doby „jako na trní“ a vyptával se ho, zda do skladu nechodil pan Robert.<\/div><\/section>\n<section class=\"page \"><div class=\"tag\">Příloha 16<\/div><div class=\"ptitle\">KAPESNÍ DIÁŘ ING. O. PEŠKA<\/div><div class=\"psub\">nalezen v náprsní kapse zemřelého; zápisy z února 1936 — opis<\/div>\n<div class=\"diary\">\n<div class=\"d\"><span>Ne 2. 2.<\/span><span>Hřbitov — Božena, 4 roky. Kytice.<\/span><\/div>\n<div class=\"d\"><span>Po 3. 2.<\/span><span style=\"letter-spacing:.06em\">Q. YZRD NCJKZCZ. OQX ZY ON UXQNBH.<\/span><\/div>\n<div class=\"d\"><span>St 5. 2.<\/span><span>Lázeň č. 3 — kontrola pH. Robert zas pozdě.<\/span><\/div>\n<div class=\"d\"><span>Pá 7. 2.<\/span><span>Prohlídka skladu — Dr. R.<\/span><\/div>\n<div class=\"d\"><span>Po 10. 2.<\/span><span style=\"letter-spacing:.06em\">RLDMJZ ID U LDL RDIET. JNLAHMZBD: CDM, LDRHB Z QNJ, JCX IRLD YZKNYHKH EHQLT.<\/span><\/div>\n<div class=\"d\"><span>St 12. 2.<\/span><span>Inventura KCN — chybí 15 g!!! Robert? Musím zjistit.<\/span><\/div>\n<div class=\"d\"><span>Čt 13. 2.<\/span><span style=\"letter-spacing:.06em\">MDYZOKZSH-KH, U RNANST QDJMT URD K. ZS UH, JNLT UDQH.<\/span><\/div>\n<div class=\"d\"><span>Pá 14. 2.<\/span><span>25 LET! Přípitek s L. ve 21.30.<\/span><\/div>\n<div class=\"d\"><span>So 15. 2.<\/span><span>L. — promluvit. Nejde to odkládat.<\/span><\/div>\n<\/div>\n<div style=\"display:flex;gap:10mm;margin-top:9mm;align-items:center;justify-content:center\">\n<div class=\"cardv\"><div class=\"deco\" style=\"font-size:15pt;letter-spacing:.1em\">Ing. Otakar Pešek<\/div><div style=\"font-size:9pt;font-style:italic\">chemik · Sýkora a spol.<\/div><div style=\"font-size:8.5pt;margin-top:2mm\">Praha XVI, Holečkova 12<\/div><\/div>\n<div class=\"cardv\" style=\"transform:rotate(3deg)\"><div class=\"hand\" style=\"font-size:15pt;color:#2a2547;line-height:1.3\">Klíč k zápiskům:<br>o tolik, kolik let<br>letos slaví firma.<\/div><\/div>\n<\/div>\n<p class=\"small muted\" style=\"text-align:center;margin-top:2mm\">Vizitka nalezená v peněžence zemřelého — líc a rub.<\/p><\/section>\n<section class=\"page \"><div class=\"tag\">Příloha 17<\/div><div class=\"ptitle\">ŠIFROVACÍ KOTOUČ<\/div><div class=\"psub\">rekvizita k vystřižení — oba kruhy vystřihněte a středy spojte připínáčkem nebo patentkou<\/div>\n<div style=\"display:flex;justify-content:center\"><svg viewBox=\"0 0 110 110\" style=\"width:110mm;height:110mm\" xmlns=\"http://www.w3.org/2000/svg\"><circle cx=\"55.0\" cy=\"55.0\" r=\"54\" fill=\"#fffaf0\" stroke=\"#221d17\" stroke-width=\".6\"/><circle cx=\"55.0\" cy=\"55.0\" r=\"42\" fill=\"none\" stroke=\"#221d17\" stroke-width=\".3\"/><text x=\"55.00\" y=\"7.00\" font-size=\"6.6\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Old Standard TT\" font-weight=\"700\" transform=\"rotate(0.0 55.00 7.00)\">A<\/text><line x1=\"60.06\" y1=\"13.31\" x2=\"61.51\" y2=\"1.39\" stroke=\"#221d17\" stroke-width=\".25\"/><text x=\"66.49\" y=\"8.39\" font-size=\"6.6\" text-anchor=\"middle\" dominant-baseline=\"central\" font-family=\"Old Standard TT\" font-weight=\"700\" transform=\"rotate(13.8 66.49 8.39)\">B<\/t ext-align:center;font-style:italic;margin:1mm 0 0\">malý kruh — šifra<\/p>\n<div class=\"box\" style=\"margin-top:4mm\">Jak se používá: Vnější kruh je otevřený text, vnitřní kruh šifra. Klíč <i>n<\/i> znamená, že pod vnější písmeno <b>A<\/b> natočíte vnitřní písmeno, které je v abecedě o <i>n<\/i> míst dál (po Z pokračuje opět A). Pak čtete: písmeno šifry najdete na vnitřním kruhu, nad ním je písmeno otevřeného textu. Čísla a interpunkce se nešifrují.<\/div><\/section>\n<section class=\"page \"><div class=\"tag\">Příloha 18<\/div><div class=\"ptitle\">PROTOKOL O PROHLÍDCE BYTU ZEMŘELÉHO<\/div><div class=\"psub\">Praha XVI, Holečkova 12 — 18. února 1936, za přítomnosti domovníka<\/div>\n<div class=\"tw\"><p>V pracovně zemřelého nalezena vkladní knížka Městské spořitelny pražské, dopisy zesnulé manželky a závěť (veškerý majetek odkázán Spolku pro péči o slepé).<\/p>\n<p>Ve zdi za obrazem malý ocelový sejf zn. Wertheim s číselným zámkem na tři dvojčíslí. Klíč k němu není, kombinace není nikde poznamenána a domovník ji nezná. Policejní zámečník je objednán na příští týden.<\/p>\n<p>Domovník uvádí: „Pan inženýr do toho sejfu chodil poslední měsíc často. Jednou jsem ho slyšel, jak si pro sebe říká: ‚Aspoň mám něco v ruce.‘“<\/p><\/div>\n<div style=\"display:flex;gap:10mm;align-items:center;margin-top:8mm\">\n<svg viewBox=\"0 0 200 200\" style=\"width:70mm\"><rect x=\"4\" y=\"4\" width=\"192\" height=\"192\" rx=\"10\" fill=\"#4b4f55\" stroke=\"#221d17\" stroke-width=\"3\"/><circle cx=\"100\" cy=\"100\" r=\"80\" fill=\"#d9d4c8\" stroke=\"#221d17\" stroke-width=\"2\"/><line x1=\"162.0\" y1=\"100.0\" x2=\"176.0\" y2=\"100.0\" stroke=\"#221d17\" stroke-width=\"1.4\"/><line x1=\"161.9\" y1=\"103.9\" x2=\"169.9\" y2=\"104.4\" stroke=\"#221d17\" stroke-width=\"0.6\"/><line x1=\"161.5\" y1=\"107.8\" x2=\"169.4\" y2=\"108.8\" stroke=\"#221d17\" stroke-width=\"0.6\"/><line x1=\"160.9\" y1=\"111.6\" x2=\"168.8\" y2=\"113.1\" stroke=\"#221d17\" stroke-width=\"0.6\"/><line x1=\"160.1\" ass=\"box\" style=\"margin:0\"><b>OBÁLKA „SEJF“.<\/b> Mezi obálkami je jedna nadepsaná SEJF. Smíte ji otevřít teprve tehdy, až budete znát kombinaci: tři dvojčíslí ve tvaru __ – __ – __.<br><br>Kontrola, že máte správnou kombinaci: <b>první číslo je o osm menší než dvojnásobek posledního.<\/b><\/div>\n<p class=\"small muted\" style=\"margin-top:3mm\">Sejf nelze otevřít hádáním. Kombinaci si Ing. Pešek někde poznamenal — svým způsobem.<\/p><\/div><\/div><\/section>\n<section class=\"page \"><div class=\"tag\">Příloha 19<\/div><div style=\"background:#fff;border:.5px solid #999;padding:8mm;box-shadow:1px 2px 4px rgba(0,0,0,.2);transform:rotate(.6deg);margin-top:4mm\">\n<div style=\"display:flex;justify-content:space-between;border-bottom:1px solid #222;padding-bottom:2mm\"><div class=\"deco\" style=\"font-size:16pt;letter-spacing:.08em\">SÁZKOVÁ KANCELÁŘ J. KRAUS<\/div><div class=\"small\" style=\"text-align:right\">Praha II, Na Poříčí 19<br>dostihy · kopaná · box<\/div><\/div>\n<p style=\"margin-top:4mm\">Vážený pane Sýkoro,<\/p>\n<p>dovolujeme si Vám připomenout, že Váš závazek vůči naší kanceláři činí ke dni 1. února 1936 <b>15.000 Kč<\/b>. Nebude-li tato částka uhrazena nejpozději do 28. února 1936, budeme nuceni obrátit se přímo na Vašeho pana otce, případně na soud.<\/p>\n<p>V očekávání Vaší odpovědi<\/p>\n<p class=\"script\" style=\"font-size:20pt;color:#2b2a63;margin:0\">J. Kraus<\/p>\n<p class=\"small muted\">Nalezeno v pokoji R. Sýkory při prohlídce 15. 2. 1936. Tamtéž v nočním stolku prázdná lahvička z lékárny U Černého orla, Praha II, signatura odlepená. Rozbor (doc. Hanzlík): stopy veronalu, kyanid negativní.<\/p><\/div>\n\n<div style=\"background:#f3ead0;border:1px solid #8a7a58;padding:6mm;margin-top:10mm;width:150mm;transform:rotate(-1deg)\">\n<div style=\"display:flex;justify-content:space-between;font:700 9pt 'Old Standard TT',serif;border-bottom:1px solid #8a7a58;padding-bottom:1.5mm\"><span>ČESKOSLOVENSKÝ TELEGRAF<\/span><span>PRAHA 1 · 13.II.36 · 14.05<\/span><\/div>\n<p style=\"font-family:'Special Elite',monospace;font-size:11pt;margin-top:4mm;line-height:1.6\">SLECNA MIA DANIELOVA VINOHRADSKE DIVADLO PRAHA = MILACKU NEZAPOMEN ZITRA NIC NEPODEPISUJ DOKUD NEBUDE SVATBA STOP MAMA<\/p>\n<p class=\"small muted\">Nalezeno v kabelce M. Danielové.<\/p><\/div>\n<div class=\"box\" style=\"margin-top:8mm\">Pozn. policie: Pan Kraus potvrdil, že dne 14. 2. ve 20.10 telefonoval do vily a s R. Sýkorou hovořil „dobrých deset minut, mladý pán sliboval, že zaplatí do konce měsíce“.<\/div><\/section>\n<section class=\"page paper2\"><div class=\"tag\">Příloha 20<\/div><div class=\"mast\"><h2>Pražský večerník<\/h2><div class=\"ln\"><span>Ročník XVII · č. 46<\/span><span>V Praze v sobotu 15. února 1936<\/span><span>Cena 30 h<\/span><\/div><\/div>\n<h2 style=\"font-family:'Old Standard TT',serif;font-size:21pt;line-height:1.1;margin:2mm 0\">Jed na zásnubní hostině v Bubenči. Měl zemřít továrník?<\/h2>\n<p style=\"font-style:italic;margin-bottom:3mm\">Policie vyslýchá členy rodiny. Podezření padá na blízkého příbuzného.<\/p>\n<div class=\"cols\">\n<p>Včerejší večer ve vile známého smíchovského továrníka L. S. v Bubenči měl být večerem oslav. Pan S. slavil pětadvacet let své firmy a zasnoubení s půvabnou herečkou Vinohradského divadla. Místo veselí však přišla smrt.<\/p>\n<p>Jeho dlouholetý společník, chemik Ing. O. P., vypil při tradičním přípitku sklenku slivovice a během několika minut zemřel. Podle našich informací šlo o otravu kyanidem. Slivovice pocházela z osobní karafy hostitele, z níž podle zvyklostí domu nepije nikdo jiný.<\/p>\n<p>Policejní rada JUDr. Kubeš odmítl cokoli potvrdit. Z dobře informovaných kruhů se však dozvídáme, že policie považuje za nejpravděpodobnější, že jed byl určen samotnému továrníkovi, a že se zájem soustředí na jeho syna, o jehož sázkových dluzích se v podnikatelských kruzích Smíchova dávno šeptá.<\/p>\n<p>Zesnulý Ing. P. byl vdovec a uznávaný odborník v oboru galvanického pokovování. Pohřeb se bude konat ve středu na Malvazinkách.<\/p>\n<div class=\"ad\"><b style=\"font-size:11pt\">KINO AVION<\/b><br>Dnes premiéra veselohry<br><i>Pan rada si vyjde<\/i><\/div>\n<div class=\"ad\"><b>ZUBNÍ PASTA PERLA<\/b><br>pro zuby bílé jako sníh!<\/div>\n<p><b>Mrazy neustupují.<\/b> Meteorologický ústav hlásí na neděli až minus 15 stupňů. Vltava pod Vyšehradem zamrzla.<\/p>\n<div class=\"ad\"><b>ŠKODA RAPID<\/b> — automobil pro moderního muže. Ukázky v Praze II, Vodičkova 30.<\/div>\n<p><b>Ze soudní síně.<\/b> Krajský soud projednává podvod s falešnými směnkami v celkové výši 120 000 Kč. Obžalovaný úředník vypověděl, že „chtěl jen přečkat zlé časy“.<\/p>\n<div class=\"ad\"><b>MALÁ OZNÁMENÍ<\/b><br>Hledá se spolehlivá kuchařka do vily v Dejvicích. Zn.: „Pořádek“.<\/div>\n<\/div><\/section>\n<section class=\"page \"><div class=\"tag\">Příloha 21<\/div><div class=\"ptitle\">FOTOGRAFIE OSOB<\/div><div class=\"psub\">z rodinného alba a policejní evidence — přiloženo advokátem<\/div><div class=\"portr\"><figure><svg viewBox=\"0 0 100 125\" xmlns=\"http://www.w3.org/2000/svg\"><defs><radialGradient id=\"bg1\" cx=\"50%\" cy=\"38%\" r=\"75%\"><stop offset=\"0\" stop-color=\"#fff\" stop-opacity=\".45\"/><stop offset=\"1\" stop-color=\"#000\" stop-opacity=\".18\"/><\/radialGradient><radialGradient id=\"sh1\" cx=\"45%\" cy=\"40%\" r=\"65%\"><stop offset=\".55\" stop-color=\"#000\" stop-opacity=\"0\"/><stop offset=\"1\" stop-color=\"#000\" stop-opacity=\".22\"/><\/radialGradient><filter id=\"f1\" color-interpolation-filters=\"sRGB\"><feColorMatrix type=\"matrix\" values=\"0.33 0.65 0.16 0 0  0.29 0.58 0.14 0 0  0.22 0.44 0.11 0 0  0 0 0 1 0\"/><\/filter><clipPath id=\"ov1\"><ellipse cx=\"50\" cy=\"62.5\" rx=\"47\" ry=\"60\"/><\/clipPath><\/defs><g filter=\"url(#f1)\"><g clip-path=\"url(#ov1)\"><rect width=\"100\" height=\"125\" fill=\"#cdb98f\"/><rect width=\"100\" height=\"125\" fill=\"url(#bg1)\"/><path d=\"M4 125 C6 100 22 92 50 91 C78 92 94 100 96 125Z\" fill=\"#2e2a26\"/><path ' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .3  0 0 0 0 .25  0 0 0 .5 0'/><\/filter><rect width='100%' height='100%' filter='url(%23n)'/><\/svg>\"),url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.012 .04' numOctaves='2' seed='7'/><feColorMatrix values='0 0 0 0 .4  0 0 0 0 .35  0 0 0 0 .28  0 0 0 .35 0'/><\/filter><rect width='100%' height='100%' filter='url(%23f)'/><\/svg>\"),radial-gradient(ellipse at 50% 45%,transparent 62%,rgba(90,70,40,0.086) 100%);\n  background-size:220px 220px,600px 600px,100% 100%}\n@media print{.page::before{opacity:.35}}\n", "html": "\n<section class=\"page cover nofoot\"><div class=\"pol\"><svg viewBox=\"0 0 300 230\" xmlns=\"http://www.w3.org/2000/svg\"><defs><radialGradient id=\"gc\" cx=\"50%\" cy=\"45%\" r=\"72%\"><stop offset=\"60%\" stop-color=\"#000\" stop-opacity=\"0\"/><stop offset=\"100%\" stop-color=\"#000\" stop-opacity=\".45\"/><\/radialGradient><\/defs><rect width=\"300\" height=\"230\" fill=\"#c9d6e3\"/><path d=\"M0 150 L60 90 L110 120 L170 60 L230 110 L300 70 L300 230 L0 230Z\" fill=\"#f4f7fa\"/><path d=\"M0 150 L60 90 L110 120 L170 60 L230 110 L300 70\" fill=\"none\" stroke=\"#9fb1c4\" stroke-width=\"2\"/>\n<g fill=\"#45604a\"><path d=\"M20 170 l7 22 h-14z\"/><path d=\"M38 180 l7 22 h-14z\"/><path d=\"M255 150 l7 22 h-14z\"/><path d=\"M272 160 l7 22 h-14z\"/><path d=\"M286 148 l7 22 h-14z\"/><path d=\"M60 190 l7 22 h-14z\"/><\/g><path d=\"M150 230 C150 190 160 150 170 120\" stroke=\"#b9c6d4\" stroke-width=\"5\" fill=\"none\" stroke-dasharray=\"6 4\"/><rect width=\"300\" height=\"230\" fill=\"url(#gc)\"/><defs><filter id=\"pg1\" x=\"0\" y=\"0\" width=\"100%\" height=\"100%\"><feTurbulence type=\"fractalNoise\" baseFrequency=\"1.4\" numOctaves=\"2\" seed=\"1\"/><feColorMatrix values=\"0 0 0 0 .4  0 0 0 0 .45  0 0 0 0 .55  0 0 0 1.2 -.35\"/><\/filter><radialGradient id=\"pv1\" cx=\"50%\" cy=\"48%\" r=\"72%\"><stop offset=\"55%\" stop-color=\"#000\" stop-opacity=\"0\"/><stop offset=\"100%\" stop-color=\"#000\" stop-opacity=\"0.44\"/><\/radialGradient><linearGradient id=\"pl1\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#fff\" stop-opacity=\".16\"/><stop offset=\".45\" stop-color=\"#fff\" stop-opacity=\"0\"/><\/linearGradient><\/defs><rect width=\"300\" height=\"230\" fill=\"url(#pl1)\"/><rect width=\"300\" height=\"230\" filter=\"url(#pg1)\" opacity=\"0.26\" style=\"mix-blend-mode:overlay\"/><rect width=\"300\" height=\"230\" fill=\"url(#pv1)\"/><text x=\"285\" y=\"218\" text-anchor=\"end\" font-family=\"VT323\" font-size=\"20\" fill=\"#ff9a3c\">'94 2 20<\/text><\/svg><\/div>\n<div class=\"sticky\" style=\"right:22mm;top:40mm;transform:rotate(6deg)\">NEHLEDEJTE MĚ.<\/div>\n<h1>Nehledejte mě<\/h1><div class=\"sub\">PŘÍPAD Č. 3 · BESKYDY · ÚNOR 1994<\/div>\n<div class=\"lab\">SPIS: POHŘEŠOVANÝ · LANG VIKTOR · 22 LISTŮ<\/div>\n<div style=\"margin-top:4mm;text-align:center;font-size:9pt;letter-spacing:.06em;color:#c9d3df\">obtížnost střední · asi 2–2,5 h · připravte si tužku a pravítko<\/div><div style=\"position:absolute;left:14mm;transform:rotate(-3deg);top:16mm;width:62mm;padding:5mm 5mm 4mm;background:#fbe88a;color:#1d2f6b;font:500 15pt/1.15 Caveat,cursive;box-shadow:0 3px 8px rgba(0,0,0,.35);z-index:60;text-align:left\">Tohle mi poslal kolega z Frýdku-Místku. Pohřešovaný, kterého prý nikdo nemusí hledat. Vezměte si k tomu tužku a mapu.<div style=\"text-align:right;margin-top:2mm\">K. D.<\/div><\/div><\/section>\n<section class=\"page \"><div style=\"display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #b3121b;padding-bottom:2mm;margin-bottom:6mm\"><div style=\"font:700 22pt 'Oswald',sans-serif;color:#b3121b\">OSTRAVSKÝ VEČERNÍK<\/div><div class=\"small\" style=\"text-align:right\">redakce · Ostrava 1, Nádražní 8<br>tel. 069/23 11 40 · fax 069/23 11 49<\/div><\/div>\n<p style=\"text-align:right\">Ostrava, 1. března 1994<\/p>\n<p>Dobrý den,<\/p>\n<p>jmenuji se Lenka Hájková a jsem redaktorka Ostravského večerníku. Kontakt na Vás mám od známého z policie, který mi taky — neoficiálně, prosím — sehnal kopie spisu, které posílám.<\/p>\n<p>V sobotu 19. února 1994 zmizel na hřebeni Beskyd Viktor Lang, předseda investičního privatizačního fondu Beskyd Invest. Fond od té doby tvrdí, že Viktor utekl s penězi akcionářů do Vídně, a policie to bere jako hotovou věc: převod na rakouský účet, letenka do Toronta, auto na nádraží, dopis na rozloučenou. Akcionáři — většinou obyčejní lidé, kteří do fondu vložili kupóny — ho mají za zloděje.<\/p>\n<p>Já tomu nevěřím. Dva dny předtím mi Viktor volal. Chtěl mi v pondělí 21. února přinést důkazy o tom, kdo z fondu vyvádí peníze. Na tu schůzku už nepřišel.<\/p>\n<p>Prosím Vás o pomoc se třemi otázkami:<\/p>\n<ol style=\"margin:2mm 0 3mm 6mm\">\n<li><b>Úkol A — Utekl Viktor Lang?<\/b> Pokud ne, dokažte, že jeho útěk někdo narafičil.<\/li>\n<li><b>Úkol B — Kde Viktor je?<\/b> Určete na mapě (list 3) čtverec, kde má Horská služba hledat, a kdy přibližně se to stalo.<\/li>\n<li><b>Úkol C — Kdo za tím stojí a proč?<\/b> A pozor: jednal ten člověk sám?<\/li>\n<\/ol>\n<p>Děkuji. Pokud máte pravdu Vy a ne policie, napíšu to já.<\/p>\n<p style=\"font:22pt 'Patrick Hand',cursive;color:#1b2a5e;margin:4mm 0 0\">Lenka Hájková<\/p>\n<div class=\"box\" style=\"margin-top:7mm\"><b>Jak postupovat.<\/b> Je rok 1994: pevné linky, pagery, faxy, kinofilm. Přečtěte všechny listy. Tentokrát nejde jen o čas, ale i o <b>prostor<\/b>: kreslete si do mapy (list 3), kudy kdo šel a kde ležel jaký sníh. Pomůže i porovnávat rukopisy. Úkoly řešte popořadě, odpověď vždy napište a pak otevřete obálku se stejným písmenem. Ke každému úkolu je nápověda — po jedné.<\/div><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 3 — MAPA<\/div><div class=\"pt\">TURISTICKÁ MAPA — HŘEBEN SMRKU<\/div><div class=\"ps\">výřez, schematicky · čtverce A–F / 1–5 slouží k určení místa pro Horskou službu<\/div><svg class=\"map3\" viewBox=\"0 0 660 610\" style=\"width:100%;font-family:'Barlow Condensed',sans-serif\" xmlns=\"http://www.w3.org/2000/svg\">\n<defs><clipPath id=\"mc\"><rect x=\"40\" y=\"30\" width=\"600\" height=\"500\"/><\/clipPath>\n<pattern id=\"les\" width=\"22\" height=\"22\" patternUnits=\"userSpaceOnUse\"><circle cx=\"5\" cy=\"6\" r=\"2.2\" fill=\"#9cc08b\" opacity=\".55\"/><circle cx=\"16\" cy=\"16\" r=\"2.2\" fill=\"#9cc08b\" opacity=\".55\"/><\/pattern>\n<pattern id=\"kos\" width=\"10\" height=\"10\" patternUnits=\"userSpaceOnUse\"><path d=\"M2 7 q3 -4 6 0\" fill=\"none\" stroke=\"#8fae7a\" stroke-width=\".8\"/><\/pattern>\n<pattern id=\"skal\" width=\"5\" height=\"5\" patternUnits=\"userSpaceOnUse\" patternTransform=\"rotate(30)\"><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"5\" stroke=\"#5a5048\" stroke-width=\".9\"/><\/pattern><\/defs>\n<style>.map3 .h{paint-order:stroke;stroke:#fbfaf3;stroke-width:3px;stroke-linejoin:round}<\/style>\n<g clip-path=\"url(#mc)\">\n<rect x=\"40\" y=\"30\" width=\"600\" height=\"500\" fill=\"#d8e8cc\"/>\n<rect x=\"40\" y=\"30\" width=\"600\" height=\"500\" fill=\"url(#les)\"/>\n<path d=\"M300 140 C 360 120, 430 80, 520 40 L640 40 L640 120 C 600 110, 560 120, 500 140 C 440 160, 380 180, 300 175Z\" fill=\"#f4f5ec\"/>\n<path d=\"M300 140 C 360 120, 430 80, 520 40 L640 40 L640 120 C 600 110, 560 120, 500 140 C 440 160, 380 180, 300 175Z\" fill=\"url(#kos)\" opacity=\".8\"/>\n<ellipse cx=\"150\" cy=\"292\" rx=\"46\" ry=\"30\" fill=\"#f1f3e6\"/>\n<path d=\"M290 470 C 320 460, 380 470, 420 500 L420 530 L270 530Z\" fill=\"#eef0e2\"/>\n<polygon points=\"434.6,136.7 433.1,135.7 432.0,134.4 431.6,132.8 431.7,130.9 432.4,128.8 433.4,126.5 434.7,124.2 436.1,121.9 437.4,119.6 438.7,117.4 439.8,115.3 440.8,113.2 441.8,111.1 442.8,109.1 444.0,106.9 445.5,104.8 447.3,102.5 449.5,100.2 452.0,97.8 454.8,95.4 457.7 Předběžný závěr: Pohřešovaný se pravděpodobně úmyslně skrývá v souvislosti s majetkovou trestnou činností v IPF Beskyd Invest. Věc předána k šetření hospodářské kriminalitě.<\/p><\/div>\n<h3 class=\"s\">Osoby na chatě Na Kamenci, 18.–20. 2. 1994<\/h3>\n<table class=\"t\">\n<tr><td><b>Viktor Lang<\/b> (34)<\/td><td>pohřešovaný; předseda představenstva Beskyd Invest, IPF, a.s., Ostrava<\/td><\/tr>\n<tr><td><b>Petra Langová<\/b> (31)<\/td><td>manželka, učitelka ZŠ<\/td><\/tr>\n<tr><td><b>Ing. Aleš Holub<\/b> (35)<\/td><td>místopředseda představenstva fondu, spolužák pohřešovaného z VŠB, spoluzakladatel<\/td><\/tr>\n<tr><td><b>JUDr. Simona Kratochvílová<\/b> (29)<\/td><td>právnička fondu<\/td><\/tr>\n<tr><td><b>Dušan Kollár<\/b> (41)<\/td><td>podnikatel, Žilina; jeho firma Kollár Trade s.r.o. je velkým investorem fondu<\/td><\/tr>\n<tr><td><b>Jaroslav Mikeš<\/b> (52)<\/td><td>chatař, bývalý člen Horské služby<\/td><\/tr>\n<\/table>\n<div class=\"box\">Pozn.: Fond nechal pro členy vedení ušít červené lyžařské bundy s bílým nápisem BESKYD INVEST na zádech. Na chatě je měli V. Lang, A. Holub, P. Langová a S. Kratochvílová.<\/div>\n<div class=\"sig\"><div><span class=\"s\">Bartoš<\/span>kpt. Ing. Zdeněk Bartoš<\/div><div><span class=\"s\"><\/span>Frýdek-Místek, 22. 2. 1994<\/div><\/div><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 5<\/div><div class=\"pt\">NÁVŠTĚVNÍ KNIHA CHATY NA KAMENCI<\/div><div class=\"ps\">fotokopie stránky, zajištěno 20. 2. 1994<\/div>\n<div class=\"gb\"><table>\n<tr><th style=\"width:18mm\">Datum<\/th><th style=\"width:16mm\">Čas<\/th><th>Jméno, bydliště<\/th><th style=\"width:44mm\">Podpis / vzkaz<\/th><\/tr>\n<tr><td class=\"pe\">17.2.<\/td><td class=\"pe\">11:20<\/td><td class=\"pe\">Hana a Jirka Bártovi, Havířov<\/td><td class=\"pe\">Díky za čaj!<\/td><\/tr>\n<tr><td class=\"v\">18.2.<\/td><td class=\"v\">16:05<\/td><td class=\"v\">Viktor Lang, Ostrava<\/td><td class=\"v\">V. Lang<\/td><\/tr>\n<tr><td class=\"pe\">18.2.<\/td><td class=\"pe\">17:10<\/td><td class=\"pe\">Petra Langová, Ostrava<\/td><td class=\"pe\">Petra L.<\/td><\/tr>\n<tr><td class=\"si\">18.2.<\/td><td class=\"si\">17:10<\/td><td class=\"si\">Simona Kratochvílová, Ostrava<\/td><td class=\"si\">S. Kratochvílová<\/td><\/tr>\n<tr><td class=\"du\">18.2.<\/td><td class=\"du\">18:20<\/td><td class=\"du\">Dušan Kollár, Žilina<\/td><td class=\"du\">D. Kollár<\/td><\/tr>\n<tr><td class=\"a\">18.2.<\/td><td class=\"a\">22:50<\/td><td class=\"a\">ALEŠ HOLUB, OSTRAVA<\/td><td class=\"a\">A. Holub — ZASE TADY!<\/td><\/tr>\n<tr><td class=\"pe\">19.2.<\/td><td class=\"pe\">08:40<\/td><td class=\"pe\">Tomáš K., Frenštát<\/td><td class=\"pe\">čaj, jdu dolů do Ostravice a pak na Lysou<\/td><\/tr>\n<tr><td class=\"pe\">20.2.<\/td><td class=\"pe\">10:15<\/td><td class=\"pe\">Horská služba – pátrání<\/td><td class=\"pe\">J. Vyvial<\/td><\/tr>\n<\/table><\/div>\n<p class=\"small\" style=\"margin:3mm 0 1mm\">Z téže knihy, list ze září 1993 (fotokopie výřezu):<\/p>\n<div class=\"gb\"><table><tr><td class=\"a\" style=\"width:18mm\">7.9.<\/td><td class=\"a\" style=\"width:16mm\">19:30<\/td><td class=\"a\">ALEŠ HOLUB + PARTA, OSTRAVA<\/td><td class=\"a\" style=\"width:44mm\">35! A POŘÁD NA KOPCI. A.<\/td><\/tr><\/table><\/div>\n<div style=\"margin-top:7mm;display:flex;gap:8mm;align-items:flex-start\">\n<div style=\"background:#fff;border:1px solid #bbb;padding:5mm;width:84mm;transform:rotate(-1.5deg);box-shadow:1px 2px 4px rgba(0,0,0,.2)\"><div class=\"small muted\" style=\"font-family:'Barlow Condensed'\">POHLEDNICE · PRAHA HRAD · zadní strana (vzorek písma V. Langa od manželky)<\/div><div class=\"v\" style=\"font-size:20pt;line-height:1.15;color:#1e2a5c;margin-top:2mm\">Péťo, Praha je krásná, ale bez Tebe nuda. Zítra ve 2 jsem doma. Tvůj Viktor<\/div><\/div>\n<div style=\"background:#fff;border:1px solid #bbb;padding:5mm;flex:1;transform:rotate(1deg);box-shadow:1px 2px 4px rgba(0,0,0,.2)\"><div class=\"small muted\" style=\"font-family:'Barlow Condensed'\">LÍSTEK Z KANCELÁŘE FONDU · vzorek písma A. Holuba (zajištěno 23. 2.)<\/div><div class=\"a\" style=\"font-size:15pt;line-height:1.3;color:#1e2a5c;margin-top:2mm\">SIMONO — SMLOUVY PRO KOLLÁRA DO PÁTKU NA STŮL. DÍKY, A.<\/div><\/div>\n<\/div><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 6<\/div><div class=\"pcr\"><div><b>POLICIE ČESKÉ REPUBLIKY<\/b><span>Okresní ředitelství Frýdek-Místek · Služba kriminální policie<\/span><\/div><div style=\"text-align:right\"><span>ČTS: ORFM-418/OK-94<\/span><\/div><\/div><div class=\"pt\">PROTOKOL O VÝSLECHU SVĚDKA<\/div><div class=\"ps\">sepsaný dne 20. 2. 1994 v 11.30 hod. na chatě Na Kamenci, doplněn 22. 2. 1994<\/div><table class=\"t\" style=\"margin-bottom:3mm\"><tr><td style=\"width:30mm\"><b>Svědek<\/b><\/td><td>Ing. Aleš HOLUB, nar. 1958, místopředseda představenstva Beskyd Invest, IPF, a.s., Ostrava-Poruba<\/td><\/tr><\/table><div class=\"cp\">\n<p>V pátek jsem do večera dodělával práci v kanceláři fondu v Ostravě, odcházel jsem asi ve čtvrt na devět. Na chatu jsem došel asi za deset minut jedenáct.<\/p>\n<p>V sobotu ve 12 jsme s Viktorem vyrazili na skialpech po červené na hřeben. Hustě sněžilo. Na Rozcestí U Kříže jsme byli asi ve 12.40, chvíli jsme stáli a povídali. Asi ve 13.15 Viktor řekl, že ho bolí koleno — letos v lednu byl na operaci — a že se vrátí na chatu. Já jsem pokračoval sám po hřebeni na Smrk, byl jsem tam asi ve dvě. Ze Smrku jsem sjel po červené do Čeladné, tam jsem dlouho čekal na autobus do Ostravice Z Čeladné jsem ještě volal na chatu, ať o mě nemají strach. Z Ostravice jsem po zelené vyšel nahoru. Byl jsem tam ve 18.45. Divil jsem se, že Viktor není zpátky.<\/p>\n<p class=\"q\">Kdy jste naposledy viděl pohřešovaného?<\/p><p>Ve 13.15 na rozcestí, jak odjíždí směrem k chatě.<\/p>\n<p class=\"q\">Měli jste v pátek nějaký spor?<\/p><p>V noci jsme se trochu pohádali o strategii fondu. Nic vážného. Viktor byl poslední dobou nervózní, divně se choval. Teď už chápu proč.<\/p>\n<p><b>Doplnění 22. 2. 1994<\/b> (na OŘ Frýdek-Místek):<\/p>\n<p class=\"q\">Víte o převodu 4,2 mil. Kč do Vídně?<\/p><p>Dozvěděl jsem se to včera od Simony. Převody nad milion podepisují dva členové představenstva. Ten jsem nepodepisoval, takže to Viktor musel udělat sám, s padělaným druhým podpisem nebo přes někoho v bance.<\/p>\n\n<\/div><div class=\"sig\"><div><span class=\"s\">A. Holub<\/span>podpis svědka<\/div><div><span class=\"s\">Bartoš<\/span>kpt. Ing. Z. Bartoš<\/div><\/div><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 7<\/div><div class=\"pcr\"><div><b>POLICIE ČESKÉ REPUBLIKY<\/b><span>Okresní ředitelství Frýdek-Místek · Služba kriminální policie<\/span><\/div><div style=\"text-align:right\"><span>ČTS: ORFM-418/OK-94<\/span><\/div><\/div><div class=\"pt\">PROTOKOL O VÝSLECHU SVĚDKA<\/div><div class=\"ps\">sepsaný dne 20. 2. 1994 v 9.00 hod. na chatě Na Kamenci, doplněn 22. 2. 1994 na OŘ Frýdek-Místek<\/div><table class=\"t\" style=\"margin-bottom:3mm\"><tr><td style=\"width:30mm\"><b>Svědek<\/b><\/td><td>Petra LANGOVÁ, nar. 1962, učitelka, Ostrava 1, Jurečkova 14<\/td><\/tr><\/table><div class=\"cp\">\n<p>Viktor přijel na chatu v pátek už odpoledne, já se Simonou jsme dojely kolem páté. V sobotu hned ráno, ještě za tmy, Viktor hledal klíčky od auta a pager, obojí nechává v bundě v sušárně. Nemohl je najít, říkal, že je asi nechal v autě dole na parkovišti. Ve 12 odjel s Alešem na túru. Já jsem celé odpoledne byla na chatě se Simonou a panem Mikešem, byla sauna, hrály jsme karty.<\/p>\n<p class=\"q\">Kontaktoval Vás odpoledne někdo?<\/p><p>Ano. Ve čtvrt na pět volal Aleš na chatu z automatu v Čeladné, vzala jsem to já. Řekl, že je dole a jede autobusem do Ostravice, ať nemáme strach. Ptal se, jestli je Viktor zpátky.<\/p>\n<p class=\"q\">Kdy jste našla dopis?<\/p><p>V půl osmé večer, na naší posteli. Hned jsem poznala, že Viktor odešel. Chtěla jsem volat policii hned, ale pak jsme si řekli, že počkáme, jestli se třeba neozve. Volala jsem po deváté.<\/p>\n<p class=\"q\">Nosil manžel cestovní pas u sebe?<\/p><p>Ano, vždycky. V náprsní kapse bundy. Je to jeho zvyk z cest.<\/p>\n<p class=\"q\">Věděla jste o problémech ve fondu?<\/p><p>Ne. Viktor o práci doma nemluvil. Jen poslední měsíc špatně spal, bral na noc Rohypnol. Předepsala mu ho ta jeho ortopedka.<\/p>\n<p><b>Doplnění 22. 2. 1994<\/b> (po domovní prohlídce v bytě manželů): Na otázku, jak vysvětlí, že cestovní pas manžela byl nalezen v jeho psacím stole v bytě, uvádí: To nevím. Asi jsem se spletla. Byla jsem v šoku.<\/p><\/div><div class=\"box\">Výňatek z protokolu o domovní prohlídce 22. 2. 1994, Ostrava 1, Jurečkova 14: V pracovně v zásuvce psacího stolu nalezen platný cestovní pas č. 1/0432177 na jméno Viktor Lang.<\/div><div class=\"sig\"><div><span class=\"s\">P. Langová<\/span>podpis svědka<\/div><div><span class=\"s\">Bartoš<\/span>kpt. Ing. Z. Bartoš<\/div><\/div><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 8<\/div><div class=\"pcr\"><div><b>POLICIE ČESKÉ REPUBLIKY<\/b><span>Okresní ředitelství Frýdek-Místek · Služba kriminální policie<\/span><\/div><div style=\"text-align:right\"><span>ČTS: ORFM-418/OK-94<\/span><\/div><\/div><div class=\"pt\">PROTOKOL O VÝSLECHU SVĚDKA<\/div><div class=\"ps\">sepsaný dne 20. 2. 1994 ve 12.40 hod. na chatě Na Kamenci, doplněn 22. 2. 1994<\/div><table class=\"t\" style=\"margin-bottom:3mm\"><tr><td style=\"width:30mm\"><b>Svědek<\/b><\/td><td>JUDr. Simona KRATOCHVÍLOVÁ, nar. 1965, právnička Beskyd Invest, IPF, a.s., Ostrava 2<\/td><\/tr><\/table><div class=\"cp\">\n<p>V pátek ve tři jsme s Petrou odjely z Ostravy mým autem, v kanceláři zůstal jen Aleš. V noci, asi o půl dvanácté, jsem šla do kuchyně pro vodu a ze společenské místnosti jsem slyšela Viktora a Aleše. Viktor byl rozčilený, mluvil potichu, ale ostře. Rozuměla jsem: „Do pondělka to všechno vrátíš. A s Petrou si to vyřídím zvlášť.“ Aleš odpověděl něco jako „Nevíš, do čeho se pouštíš.“ Pak jsem šla rychle pryč.<\/p>\n<p class=\"q\">Co jste dělala v sobotu odpoledne?<\/p><p>Byla jsem na chatě s Petrou a panem Mikešem. Od tří jsme seděly u krbu a hrály karty. Ve 16.45 jsem z telefonu u výčepu poslala Viktorovi zprávu na pager, že začíná sněžit, ať se ozve. Neozval se.<\/p>\n<p class=\"q\">Volal odpoledne někdo na chatu?<\/p><p>Ne. Telefon je u výčepu kousek od krbu, celé odpoledne nezazvonil, to bych slyšela. Petra seděla celou dobu vedle mě.<\/p>\n<p class=\"q\">Všimla jste si mezi přítomnými něčeho neobvyklého?<\/p><p>Nechci pomlouvat. Ale v pátek kolem jedenácté jsem v sušárně zahlédla Petru a Aleše. Stáli moc blízko u sebe. Když mě uviděli, odskočili od sebe.<\/p>\n<p><b>Doplnění 22. 2. 1994<\/b> (na OŘ Frýdek-Místek):<\/p>\n<p class=\"q\">Jak se k převodu do Vídně mohl dostat pohřešovaný?<\/p><p>Převody nad milion musí podepsat dva členové představenstva, Viktor a Aleš. Kopie pasů členů představenstva máme v kanceláři ve složce k bankovní agendě, k té mají přístup oba.<\/p><\/div><div class=\"sig\"><div><span class=\"s\">S. Kratochvílová<\/span>podpis svědka<\/div><div><span class=\"s\">Bartoš<\/span>kpt. Ing. Z. Bartoš<\/div><\/div><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 9<\/div><div class=\"pcr\"><div><b>POLICIE ČESKÉ REPUBLIKY<\/b><span>Okresní ředitelství Frýdek-Místek · Služba kriminální policie<\/span><\/div><div style=\"text-align:right\"><span>ČTS: ORFM-418/OK-94<\/span><\/div><\/div><div class=\"pt\">PROTOKOL O VÝSLECHU SVĚDKA<\/div><div class=\"ps\">sepsaný dne 20. 2. 1994 ve 14.00 hod. na chatě Na Kamenci (tlumočení nebylo třeba)<\/div><table class=\"t\" style=\"margin-bottom:3mm\"><tr><td style=\"width:30mm\"><b>Svědek<\/b><\/td><td>Dušan KOLLÁR, nar. 1952, podnikatel, Žilina, SR<\/td><\/tr><\/table><div class=\"cp\">\n<p>Moja firma vložila do fondu Beskyd Invest dvanásť miliónov. Od jesene sa z fondu strácajú peniaze, chcel som ich späť. V piatok pri večeri som Langovi povedal, že ak do pondelka neuvidím peniaze, budem to riešiť inak. Áno, bol som nahnevaný. Ale on mi potom vonku povedal: „Pán Kollár, ja vás neokrádam. Viem, kto. V pondelok to praskne.“<\/p>\n<p class=\"q\">Co jste dělal v sobotu odpoledne?<\/p><p>O jednej som šiel pešo dole po zelenej do Ostravice, potreboval som cigarety a zavolať do Žiliny. Sedel som v hostinci U Lomu, telefonoval som z automatu. Okolo štvrť na päť som bol späť na chate, do kopca to trvá.<\/p>\n<p class=\"q\">Viděl jste někoho cestou?<\/p><p>Na zelenej nikoho, hustý sneh. V Ostravici na parkovisku stálo Langovo strieborné Audi, to si pamätám, lebo som si pomyslel, že by som mu ho najradšej zobral.<\/p>\n<\/div><div class=\"tix\" style=\"margin-top:3mm\"><div class=\"tk\"><b>HOSTINEC U LOMU<\/b><br>Ostravice 142<br>------------------------<br>19.02.94    14:44<br>2x pivo 12°      16,00<br>1x Becherovka     9,00<br>1x cigarety Start 9,50<br>------------------------<br>CELKEM          34,50<br>------------------------<br>Děkujeme!<\/div>\n<div class=\"box\" style=\"flex:1;margin:0\">Pozn.: Hostinský Josef Pavlík potvrdil, že pan Kollár seděl v hostinci zhruba od 14.00 do 14.45, dvakrát telefonoval z automatu a pak odešel „nahoru na chatu“. Slovenská policie sdělila, že Kollár Trade s.r.o. je od prosince 1993 prověřována pro daňové úniky.<\/div><\/div><div class=\"sig\"><div><span class=\"s\">D. Kollár<\/span>podpis svědka<\/div><div><span class=\"s\">Bartoš<\/span>kpt. Ing. Z. Bartoš<\/div><\/div><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 10<\/div><div class=\"pcr\"><div><b>POLICIE ČESKÉ REPUBLIKY<\/b><span>Okresní ředitelství Frýdek-Místek · Služba kriminální policie<\/span><\/div><div style=\"text-align:right\"><span>ČTS: ORFM-418/OK-94<\/span><\/div><\/div><div class=\"pt\">PROTOKOL O VÝSLECHU SVĚDKA<\/div><div class=\"ps\">sepsaný dne 20. 2. 1994 v 10.00 hod., doplněn 21. 2. 1994<\/div><table class=\"t\" style=\"margin-bottom:3mm\"><tr><td style=\"width:30mm\"><b>Svědek<\/b><\/td><td>Jaroslav MIKEŠ, nar. 1941, chatař, Ostravice, chata Na Kamenci<\/td><\/tr><\/table><div class=\"cp\">\n<p>Ve 12 odešli pan Lang a pan Holub po červené nahoru, oba v těch červených bundách fondu. Ve 13 odešel pan Kollár dolů po zelené, vrátil se kolem čtvrt na pět. Dámy byly celé odpoledne se mnou v chatě, jejich červené bundy visely v předsíni.<\/p>\n<p>Asi ve 14.35 jsem stál na terase s dalekohledem a díval se na protější svah. Na modré pod Smrkem jel dolů lyžař v červené bundě. Jel jako závodník, velké oblouky, žádný pluh. Říkal jsem si, že je to asi pan Lang, takovou bundu měli jen ti z fondu. Divil jsem se, že s tím kolenem takhle jezdí.<\/p>\n<p>V 16.00 se u mě zastavila hlídka Horské služby, Radek Polák, na čaj. Říkal, že se nahoře u Čertova žlebu ulomila převěj a že cestou z Čeladné po červené nikoho nepotkali. Ve 16.30 začalo zase hustě sněžit.<\/p>\n<p>Ve 16.45 slečna Simona telefonovala od výčepu, posílala něco na pager. Jinak celé odpoledne na chatu nikdo nevolal, telefon je hned u mě.<\/p>\n<p>Pan Holub přišel ve 18.45 od Ostravice po zelené, s čelovkou. Byl úplně propocený, šel rychle.<\/p>\n<p><b>Doplnění 21. 2.:<\/b> Při úklidu sušárny jsem v odpadkovém koši našel zmačkanou autobusovou jízdenku. Nevím, čí je. V sobotu večer si tam sušili věci všichni. Předávám ji.<\/p><\/div><div class=\"tix\" style=\"margin-top:3mm\"><div class=\"tk\" style=\"transform:rotate(-3deg)\"><b>ČSAD Frýdek-Místek s.p.<\/b><br>JÍZDENKA  č. 0418772<br>Frýdek-Místek,aut.st.<br>   → Ostravice,pošta<br>19.02.94  16:35  linka 860<br>Obyčejné   9,00 Kč<\/div><\/div><div class=\"sig\"><div><span class=\"s\">J. Mikeš<\/span>podpis svědka<\/div><div><span class=\"s\">Bartoš<\/span>kpt. Ing. Z. Bartoš<\/div><\/div><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 11<\/div><div class=\"hsf\"><div class=\"hd\"><div class=\"cross\"><\/div><div><b style=\"font:700 14pt 'Barlow Condensed'\">HORSKÁ SLUŽBA BESKYDY<\/b><br><span class=\"small\">Záznam o hlídkové činnosti · oblast Smrk – Lysá hora<\/span><\/div><\/div>\n<table class=\"t\" style=\"margin-bottom:3mm\"><tr><td style=\"width:35mm\">Datum<\/td><td class=\"hs\" style=\"font-size:14pt\">19. 2. 1994 (sobota)<\/td><\/tr><tr><td>Hlídka<\/td><td class=\"hs\" style=\"font-size:14pt\">Radek Polák + Ondra Šebesta<\/td><\/tr><tr><td>Trasa<\/td><td class=\"hs\" style=\"font-size:14pt\">Čeladná → Smrk → hřebenovka → Rozcestí U Kříže → chata Na Kamenci → Ostravice<\/td><\/tr><\/table>\n<div class=\"hsrow\"><span class=\"hs\" style=\"font-size:13pt\">13.25<\/span><span class=\"hs\">Výstup z Čeladné po červené na Smrk. Ve stoupání žádná stopa sjezdu, sníh neporušený.<\/span><\/div><div class=\"hsrow\"><span class=\"hs\" style=\"font-size:13pt\">14.45<\/span><span class=\"hs\"><b>Smrk, vrchol.<\/b> Od hřebene (od Čertova žlebu) přichází 1 lyžařská stopa, ostrá. Na vrcholu odbočuje sjezdem na MODROU do Ostravice. Jiné stopy na vrcholu nejsou.<\/span><\/div><div class=\"hsrow\"><span class=\"hs\" style=\"font-size:13pt\">15.00<\/span><span class=\"hs\"><b>Kamenný žleb.<\/b> Převěj ulomená v délce cca 2 m, sesutý sníh pod souvislou vrstvou nového sněhu. Jedna lyžařská stopa vede nad žlebem bez zastavení.<\/span><\/div><div class=\"hsrow\"><span class=\"hs\" style=\"font-size:13pt\">15.20<\/span><span class=\"hs\"><b>Čertův žleb.<\/b> Převěj nad žlebem čerstvě ulomená v délce cca 4 m. Na hraně rozšlapaný, rozrytý sníh. Nalezen talířek od lyžařské hole (černý, Komperdell) — zajištěn. Od rozcestí sem přichází DVOJSTOPA (2 lyžaři), mírně zapadaná. Směrem ke Smrku pokračuje jen JEDNA stopa — u žlebu ještě mírně zapadaná, dál ostrá. Do žlebu nesestupováno — lav. nebezpečí 3.<\/span><\/div><div class=\"hsrow\"><span class=\"hs\" style=\"font-size:13pt\">15.40<\/span><span class=\"hs\"><b>Rozcestí U Kříže.<\/b> Mezi rozcestím a chatou jen starší dvojstopa směrem OD chaty, silně zapadaná. Zpětná stopa od rozcestí k chatě ŽÁDNÁ.<\/span><\/div><div class=\"hsrow\"><span class=\"hs\" style=\"font-size:13pt\">16.00<\/span><span class=\"hs\">Chata Na Kamenci — čaj. Informován chatař o převěji.<\/span><\/div><div class=\"hsrow\"><span class=\"hs\" style=\"font-size:13pt\">16.30<\/span><span class=\"hs\">Začíná hustě sněžit. Sjezd do Ostravice, konec hlídky.<\/span><\/div>\n<div class=\"sig\"><div><span class=\"s\">R. Polák<\/span>velitel hlídky<\/div><div>předáno PČR 22. 2. 1994<\/div><\/div><\/div><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 12<\/div><div class=\"fax\"><div class=\"faxhd\"><span>20.02.94 FAX ČHMÚ POBOČKA OSTRAVA<\/span><span>STR. 01/01<\/span><\/div>\n<div class=\"dot\">ČESKÝ HYDROMETEOROLOGICKÝ ÚSTAV<br>METEOROLOGICKÁ STANICE LYSÁ HORA (1322 M)<br>PŘEHLED POČASÍ ZA DEN 19.02.1994<br><br>\nČAS        SRÁŽKY           TEPLOTA  VÍTR<br>\n00-06      BEZ SRÁŽEK       -9 C     SZ 4 M/S<br>\n06-13.40   SNĚŽENÍ, HUSTÉ   -7 C     SZ 6 M/S<br>\n           NOVÝ SNÍH 14 CM<br>\n13.40-16.30 BEZ SRÁŽEK,     -6 C     Z 3 M/S<br>\n           OBLAČNO, VIDITELNOST DOBRÁ<br>\n16.30-24   SNĚŽENÍ, HUSTÉ   -8 C     SZ 7 M/S<br>\n           NOVÝ SNÍH 22 CM<br><br>\nVÝCHOD SLUNCE 06.58  ZÁPAD 17.21<br>\nLAVINOVÉ NEBEZPEČÍ (HS): 3 - ZNAČNÉ<br>\nPOZOR: TVORBA PŘEVĚJÍ NA ZÁVĚTRNÝCH HŘEBENECH<br>\n<\/div><\/div>\n<\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 13<\/div><div class=\"pcr\"><div><b>POLICIE ČESKÉ REPUBLIKY<\/b><span>Okresní ředitelství Frýdek-Místek · Obvodní oddělení Frýdek<\/span><\/div><div style=\"text-align:right\"><span>ČTS: ORFM-418/OK-94<\/span><\/div><\/div><div class=\"pt\">PROTOKOL O OHLEDÁNÍ VOZIDLA<\/div><div class=\"ps\">21. 2. 1994, 10.30 – 11.40 hod., parkoviště u železniční stanice Frýdek-Místek<\/div>\n<table class=\"t\" style=\"margin-bottom:3mm\"><tr><td style=\"width:40mm\">Vozidlo<\/td><td>Audi 80, stříbrná metalíza, SPZ OVA 47-12, provozovatel Viktor Lang<\/td><\/tr><tr><td>Oznámil<\/td><td>správce parkoviště ČD, vozidlo stojí od soboty<\/td><\/tr><\/table>\n<div class=\"cp\">\n<p>1. Vozidlo nezamčeno, klíček zasunut ve spínací skříňce. Bez známek násilí.<\/p>\n<p>2. Sedadlo řidiče posunuto výrazně dopředu, opěradlo ve strmé poloze, vnitřní zpětné zrcátko natočeno dolů. Technik uvádí, že poloha odpovídá řidiči výšky cca 165–175 cm.<\/p>\n<p>3. Na sedadle spolujezdce pager Motorola (příjem zpráv, viz list 18) a parkovací lístek (viz níže).<\/p>\n<p>4. Ve vozidle ani v zavazadlovém prostoru nenalezena žádná zavazadla, oblečení, doklady, peníze. <b>Lyže, hole ani lyžařské boty ve vozidle nejsou<\/b>, střešní nosič lyží prázdný. Na parkovišti v Ostravici rovněž nic nenalezeno.<\/p>\n<p>5. Na koberečku řidiče rozteklý sníh a drť. Daktyloskopické stopy na volantu a řadicí páce setřené.<\/p>\n<\/div>\n<div class=\"tix\" style=\"margin-top:4mm\"><div class=\"tk\" style=\"transform:rotate(-2deg)\"><b>ČD PARKOVIŠTĚ F-M<\/b><br>Lístek č. 004417<br>VJEZD:  19.02.94  15:58<br>VÝJEZD: ---<br>Sazba 5,- Kč / den<br>Lístek si uschovejte!<\/div>\n<div class=\"box\" style=\"flex:1;margin:0\">Pozn.: Spoj do Vídně (přestup v Ostravě) odjíždí z Frýdku-Místku v 16.52.<\/div><\/div>\n<div class=\"sig\"><div><span class=\"s\">Kaluža<\/span>nprap. Josef Kaluža<\/div><div><span class=\"s\">Bartoš<\/span>kpt. Ing. Z. Bartoš<\/div><\/div><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 14<\/div><div class=\"pt\">KANCELÁŘ FONDU — BUDOVA OSTRAVA, 28. ŘÍJNA 117<\/div><div class=\"ps\">zajištěno 23. 2. 1994<\/div>\n<h3 class=\"s\">Kniha vrátnice — pátek 18. 2. 1994 (výňatek)<\/h3>\n<div class=\"gb\" style=\"padding:3mm 5mm\"><table>\n<tr><th>Čas<\/th><th>Kdo<\/th><th>Příchod / odchod<\/th><th>Pozn.<\/th><\/tr>\n<tr><td class=\"du\">13.30<\/td><td class=\"du\">Ing. Lang (Beskyd Invest)<\/td><td class=\"du\">odchod<\/td><td class=\"du\">„na hory“<\/td><\/tr>\n<tr><td class=\"du\">15.00<\/td><td class=\"du\">JUDr. Kratochvílová + p. Langová<\/td><td class=\"du\">odchod<\/td><td class=\"du\"><\/td><\/tr>\n<tr><td class=\"du\">20.15<\/td><td class=\"du\">Ing. Holub<\/td><td class=\"du\">odchod<\/td><td class=\"du\">kancelář zamčena, klíč u sebe<\/td><\/tr>\n<\/table><p class=\"small\" style=\"margin:1.5mm 0 0\">Pozn. vrátného (doplněno 23. 2.): Ve čtvrtek 17. 2. kolem 18.40 se na vrátnici ptal po Ing. Langovi neznámý muž, mluvil lámanou češtinou s německým přízvukem. Jméno nenechal, řekl, že „to počká“.<\/p><\/div>\n<h3 class=\"s\">Žurnál faxového přístroje Panasonic UF-322 v kanceláři fondu (výtisk)<\/h3>\n<div class=\"fax\" style=\"padding:4mm 5mm\"><div class=\"dot\" style=\"font-size:12pt\">*** ZURNAL ODESLANYCH ***   BESKYD INVEST 069/612345<br>\nCIS  DATUM   CAS    PRIJEMCE           STR  VYSL.<br>\n041  17.02  09.14  069/22 13 30 KB     02   OK<br>\n042  17.02  11.50  02/2416 7711 RMS    01   OK<br>\n043  18.02  10.05  069/22 13 30 KB     01   OK<br>\n044  18.02  17.42  069/23 31 88 ZB-RAIFF 01  OK<br>\n<\/div><\/div>\n<div class=\"box\">Pozn.: Číslo 069/23 31 88 patří ostravské pobočce Živnostenské banky, která pro fond vyřizuje zahraniční platby.<\/div><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 15<\/div><div class=\"fax\"><div class=\"faxhd\"><span>18-02-94 17:42  BESKYD INVEST → ŽB OSTRAVA<\/span><span>P.01<\/span><\/div>\n<div style=\"font-family:'Barlow Condensed';font-size:13pt;font-weight:700;text-align:center;margin:2mm 0 3mm\">PŘÍKAZ K ÚHRADĚ DO ZAHRANIČÍ<\/div>\n<table class=\"t\" style=\"background:#fff\">\n<tr><td style=\"width:45mm\">Plátce<\/td><td>Beskyd Invest, investiční privatizační fond, a.s., Ostrava<\/td><\/tr>\n<tr><td>Z účtu<\/td><td>čís. 19-4471280217/0400<\/td><\/tr>\n<tr><td>Příjemce<\/td><td>Viktor Lang<\/td><\/tr>\n<tr><td>Banka příjemce<\/td><td>Raiffeisen Zentralbank Österreich AG, Wien 3., Am Stadtpark 9<\/td><\/tr>\n<tr><td>Účet příjemce<\/td><td>Konto Nr. 4-08.155.672 (otevřen 7. 2. 1994 korespondenčně, s kopií pasu majitele)<\/td><\/tr>\n<tr><td>Částka<\/td><td><b>4 200 000,– Kč<\/b> (v ATS dle kurzu)<\/td><\/tr>\n<tr><td>Účel<\/td><td>vypořádání odměn představenstva<\/td><\/tr>\n<tr><td>Splatnost<\/td><td>21. 2. 1994<\/td><\/tr>\n<\/table>\n<div style=\"display:flex;justify-content:space-around;margin-top:6mm;text-align:center\">\n<div><div class=\"a\" style=\"font-size:21pt;color:#111\">V. Lang<\/div><div class=\"small\" style=\"border-top:.5px solid #333\">předseda představenstva<\/div><\/div>\n<div><div class=\"a\" style=\"font-size:21pt;color:#111\">A. Holub<\/div><div class=\"small\" style=\"border-top:.5px solid #333\">místopředseda představenstva<\/div><\/div>\n<\/div><\/div>\n<div class=\"box\" style=\"margin-top:6mm\">Pozn. SKP – hospodářská kriminalita (25. 2.): Převod byl bankou pozastaven 21. 2. po oznámení pohřešování. Z vídeňského účtu nebyly nikdy vybrány žádné peníze. Rakouská banka uvádí, že účet založil korespondenčně „Viktor Lang“ dopisem z Ostravy, k němuž přiložil kopii pasu. Ing. Holub tvrdí, že svůj podpis na příkaz nedal a že jde o padělek.<\/div><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 16<\/div><div class=\"pt\">PLATBY FONDU DO RAKOUSKA, ZÁŘÍ 1993 – LEDEN 1994<\/div><div class=\"ps\">přehled zpracovaný SKP, oddělením hospodářské kriminality z výpisů Živnostenské banky, 25. 2. 1994<\/div>\n<table class=\"t\">\n<tr><th>Datum<\/th><th>Příjemce<\/th><th>Účel<\/th><th>Částka (Kč)<\/th><th>Podpisy na příkazu<\/th><\/tr>\n<tr><td>14.09.93<\/td><td>Alpen Consulting GmbH, Wien<\/td><td>poradenské služby – analýza trhu<\/td><td>2 800 000<\/td><td>V. Lang, A. Holub<\/td><\/tr>\n<tr><td>22.10.93<\/td><td>Alpen Consulting GmbH, Wien<\/td><td>poradenské služby – 2. etapa<\/td><td>3 100 000<\/td><td>V. Lang, A. Holub<\/td><\/tr>\n<tr><td>30.11.93<\/td><td>Alpen Consulting GmbH, Wien<\/td><td>konzultace – akvizice<\/td><td>2 450 000<\/td><td>V. Lang, A. Holub<\/td><\/tr>\n<tr><td>19.01.94<\/td><td>Alpen Consulting GmbH, Wien<\/td><td>závěrečná zpráva<\/td><td>3 250 000<\/td><td>V. Lang, A. Holub<\/td><\/tr>\n<tr><td colspan=\"3\"><b>Celkem<\/b><\/td><td><b>11 600 000<\/b><\/td><td><\/td><\/tr>\n<\/table>\n<div style=\"display:flex;gap:6mm;margin-top:3mm;align-items:center\"><div class=\"box\" style=\"margin:0;flex:1\">Podpisy „V. Lang“ na všech čtyřech příkazech (zvětšený výřez z příkazu ze 14. 9. 1993):<\/div><div class=\"a\" style=\"font-size:24pt;padding:0 6mm\">V. Lang<\/div><\/div>\n<div class=\"box\">Fond od Alpen Consulting nikdy neobdržel žádnou analýzu ani zprávu (sdělení JUDr. Kratochvílové, 24. 2.).<\/div>\n<h3 class=\"s\">Firmenbuch — Handelsgericht Wien (výpis z obchodního rejstříku, s vysvětlivkami)<\/h3>\n<div class=\"fax\" style=\"padding:4mm 5mm\"><div class=\"dot\" style=\"font-size:12.5pt\">FIRMENBUCHNUMMER: FN 104 211 x<br>FIRMA:     ALPEN CONSULTING GMBH<br>SITZ:      WIEN 1., SCHUBERTRING 6 (POSTANSCHRIFT)<br>EINGETRAGEN: 02.08.1993<br>STAMMKAPITAL: ATS 500.000<br>GESELLSCHAFTER: MAG. GERHARD PICHLER, WIEN — 100 %<br>GESCHÄFTSFÜHRER: MAG. GERHARD PICHLER<\/div><\/div>\n<div class=\"fax\" style=\"padding:3mm 5mm;margin-top:2mm\"><div class=\"dot\" style=\"font-size:12pt\">CREDITANSTALT-BANKVEREIN, WIEN · RECHTSHILFE 24.02.1994<br>KONTO: ALPEN CONSULTING GMBH<br>WIRTSCHAFTLICH BERECHTIGTER (§ 40 BWG): NATÜRLICHE PERSON,<br>                GEB. 07.09.1958, WOHNHAFT OSTRAVA (CZ)<br>NAME: NUR AUF GERICHTLICHE ANORDNUNG<\/div><\/div>\n<p class=\"small muted\">Gesellschafter = společník, Geschäftsführer = jednatel, wirtschaftlich Berechtigter = skutečný majitel (pro koho firma a účet ve skutečnosti jsou), geb. = narozen, Rechtshilfe = právní pomoc. Mag. Pichler je vídeňský advokát, který podobné „schránkové“ firmy zakládá na zakázku. Jméno skutečného majitele banka sdělí jen na příkaz soudu; zatím uvedla datum narození a bydliště.<\/p><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 17<\/div><div style=\"border:1px solid #888;padding:5mm 6mm;background:#fff\">\n<div style=\"display:flex;justify-content:space-between;border-bottom:1.5px solid #333;padding-bottom:2mm\"><div><b style=\"font-family:'Barlow Condensed';font-size:13pt\">MĚSTSKÁ NEMOCNICE OSTRAVA<\/b><br><span class=\"small\">Ortopedické oddělení · ambulance<\/span><\/div><div class=\"small\" style=\"text-align:right\">Ostrava-Fifejdy<\/div><\/div>\n<div class=\"cp\" style=\"margin-top:3mm\">\n<p><b>Pacient:<\/b> Viktor Lang, nar. 3. 5. 1959<\/p>\n<p><b>12. 1. 1994:<\/b> artroskopie pravého kolena, parciální meniscektomie mediálního menisku.<\/p>\n<p><b>Kontrola 17. 2. 1994, 13.50–14.40 hod.<\/b> (MUDr. Dana Kubíková): Hojení přiměřené, kolenní kloub stabilní, bez výpotku. Pacient se táže na víkendovou túru na skialpech. Chůze a výstup na skialpech v mírném tempu povoleny. Sjezdy pouze pomalu, v pluhu, bez prudkých oblouků. Rychlé sjezdy a skoky zakázány do 15. 3. 1994. Pacient slibuje dodržovat. Medikace: Ibalgin 400 mg nejvýše 3× denně při bolesti. Jiné léky nepředepsány, pacient jiné léky neužívá. Kontrola za 4 týdny.<\/p><\/div>\n<div class=\"sig\"><div><span class=\"s\">Kubíková<\/span>MUDr. Dana Kubíková<\/div><div>razítko oddělení<\/div><\/div><\/div>\n<div style=\"border:1px solid #888;padding:5mm 6mm;background:#fff;margin-top:8mm\">\n<div style=\"display:flex;justify-content:space-between;border-bottom:1.5px solid #c0392b;padding-bottom:2mm\"><b style=\"font:700 18pt 'Oswald';color:#c0392b\">ČEDOK<\/b><span class=\"small\">pobočka Ostrava, Nádražní 9 · letecké jízdenky<\/span><\/div>\n<div class=\"dot\" style=\"margin-top:3mm;font-size:12.5pt\">REZERVACE PNR 7KX4QW<br>CESTUJICI:   LANG/VIKTOR MR<br>LET:         LH 3471 WIEN-FRANKFURT 20FEB 07.10<br>             LH 470  FRANKFURT-TORONTO 20FEB 10.30<br>TRIDA:       Y   JEDNOSMERNA<br>CENA:        24 870 KC   UHRADA FAKTUROU - BESKYD INVEST IPF<br>OBJEDNANO:   17FEB94  14.20  TELEFONICKY<br>             VOLAJICI: \"PAN LANG\", ZPETNE CISLO 069/612345 (KANCELAR FONDU)<br>VYZVEDNUTI:  NA LETISTI WIEN-SCHWECHAT<\/div>\n<p class=\"small\" style=\"margin-top:2mm\">Pozn. úřednice Čedoku (výpověď 24. 2.): „Pána osobně neznám, mluvil česky, bez přízvuku, tiše a spěchal. Volal na naši linku, nikoli ze zahraničí. Ve 14.30 jsem rezervaci potvrzovala zpětným voláním na to číslo a telefon vzal zase on.“<\/p><\/div>\n<div class=\"box\">Pozn. policie: V kanceláři fondu byli ve čtvrtek 17. 2. odpoledne podle vrátnice Ing. Holub a JUDr. Kratochvílová (ta odešla ve 14.00 k soudu, pobyt u soudu potvrzen 14.05–16.30).<\/div><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 18<\/div><div class=\"pt\">PAGER POHŘEŠOVANÉHO — PŘIJATÉ ZPRÁVY<\/div><div class=\"ps\">výpis od operátora Paging Morava, s.r.o., pro pager č. 0600 41 772, 18.–19. 2. 1994<\/div>\n<div class=\"fax\" style=\"padding:4mm 5mm\"><div class=\"dot\" style=\"font-size:12.5pt\">DATUM  CAS    ODESILATEL (VOLAJICI CISLO)      TEXT<br>\n18.02  12.10  069/23 11 40 (REDAKCE OV)          POTVRZUJI PO 10.00 U NAS. L.H.<br>\n18.02  19.55  069/612345 (KANCELAR BI)         V KANCELARI VSE HOTOVO. DORAZIM POZDE. A.<br>\n19.02  16.45  0658/97 113 (CHATA NA KAMENCI)    VIKTORE KDE JSTE? ZACINA SNEZIT. OZVI SE. S.<br><\/div><\/div>\n<p class=\"small muted\">Pager přijímá zprávy, ale nemůže je odesílat. Byl nalezen ve voze na nádraží (list 13).<\/p>\n\n<h3 class=\"s\" style=\"margin-top:8mm\">Dopis na rozloučenou<\/h3>\n<div style=\"background:#fff;width:125mm;margin:2mm auto;padding:8mm 9mm;box-shadow:1px 2px 5px rgba(0,0,0,.25);transform:rotate(-1.5deg);border:1px solid #ccc\">\n<div class=\"a\" style=\"font-size:19pt;line-height:1.45;color:#16224f\">NEHLEDEJTE MĚ.<br>MUSEL JSEM ZMIZET, JINAK TO NEŠLO.<br>PROMIŇ, PETRO.<br>V.<\/div><\/div>\n<p class=\"small muted\" style=\"text-align:center\">List z poznámkového bloku chaty, nalezen 19. 2. ve 19.30 na posteli manželů Langových. Psáno modrou propisovací tužkou, hůlkovým písmem.<\/p><\/section>\n<section class=\"page np\"><div class=\"lbl\">LIST 19<\/div><div class=\"npm\"><h2>OSTRAVSKÝ VEČERNÍK<\/h2><div class=\"small\" style=\"text-align:right\">čtvrtek 17. února 1994 · ročník V · cena 3 Kč<\/div><\/div>\n<h2 class=\"hl\">Kam mizí peníze z fondu Beskyd Invest?<\/h2>\n<p style=\"font:italic 10pt 'Merriweather';margin-bottom:3mm\">Desítky tisíc drobných akcionářů svěřily fondu své kupóny. Teď se ptají, kde jsou jejich miliony. — Lenka Hájková<\/p>\n<div class=\"cols\">\n<p>Investiční privatizační fond Beskyd Invest patřil v první vlně kupónové privatizace k nejúspěšnějším na severní Moravě. Lákal na slib desetinásobného výnosu a od lidí z Ostravska, Frýdecko-Místecka a Karvinska získal přes 41 tisíc investičních kupónových knížek.<\/p>\n<p>Podle informací Večerníku však fond od loňského září posílá velké částky do zahraničí za „poradenské služby“. Kdo je dostává a za co, vedení fondu odmítá říct. „Jde o standardní obchodní spolupráci,“ uvedl stručně místopředseda představenstva Ing. Aleš Holub.<\/p>\n<p>Předseda představenstva Viktor Lang nebyl do uzávěrky k zastižení. Z kruhů blízkých fondu se ale dozvídáme, že se ve vedení vyostřují spory a že „někdo velmi brzy promluví“.<\/p>\n<p>Ministerstvo financí, které fondy dozoruje, nemá podle mluvčího k věci „žádné signály“. Akcionáři, se kterými jsme mluvili, jsou nervózní. „Dal jsem tam kupóny za celou rodinu,“ řekl nám důchodce z Frýdku.<\/p>\n<div class=\"adv\"><b style=\"font-size:14pt\">PRIOR SLEVY!<\/b><br>Zimní výprodej, Ostrava, Masarykovo nám.<\/div>\n<div class=\"adv\"><b>GOLDSTAR<\/b> barevný TV 51 cm<br>s dálkovým ovládáním — jen 11 990 Kč!<\/div>\n<p><b>Lillehammer:<\/b> Zimní olympijské hry začaly v sobotu 12. února. Čeští hokejisté hrají ve skupině s Ruskem a Finskem.<\/p>\n<div class=\"adv\"><b>MOBILNÍ TELEFON NMT<\/b><br>Eurotel — volejte odkudkoli!<br>Akční cena aparátu 49 900 Kč<\/div>\n<p><b>Lyžaři pozor:<\/b> Horská služba Beskydy varuje před převějemi na hřebenech Smrku a Lysé hory. Přes víkend se čeká husté sněžení.<\/p>\n<div class=\"adv\"><b>PAGER<\/b> — buďte vždy k zastižení!<br>Paging Morava, tel. 069/44 22 11<\/div>\n<\/div><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 20<\/div><div class=\"pt\">POZNÁMKY L. HÁJKOVÉ Z TELEFONÁTU<\/div><div class=\"ps\">čtvrtek 17. 2. 1994, cca 15.30 — kopie z redakčního bloku<\/div>\n<div class=\"legal\">\nV. Lang volal po vyjití článku!<br>\n— „Nejsem to já. Já jsem ty převody do Vídně nikdy nepodepsal.“<br>\n— podpisy pod příkazy nejsou jeho → pozná to každý, kdo zná jeho písmo<br>\n— ví, kdo za tím je. „Někdo, komu jsem věřil.“<br>\n— na chatě se s ním chce v pátek „vyříkat z očí do očí“<br>\n— přinese kopie příkazů + dopis z Vídně (?)<br>\n— <u>PONDĚLÍ 21. 2. v 10:00 u nás v redakci<\/u><br>\n— mluvil rozrušeně<br>\n— „Doma taky není všechno v pořádku. Řeknu vám, až to skončí.“<br>\n— volal z budky na Fifejdách (nemocnice?)<br>\n— potvrzeno na pager v pátek ve 12.10\n<\/div><\/section>\n<section class=\"page \"><div class=\"lbl\">LIST 21<\/div><div class=\"pt\">FOTOGRAFIE<\/div><div class=\"ps\">fotografie PČR a Horské služby (kinofilm) — datum vpravo dole vtiskl fotoaparát<\/div><div class=\"ph\"><div class=\"p\"><svg viewBox=\"0 0 300 230\" xmlns=\"http://www.w3.org/2000/svg\"><defs><radialGradient id=\"ga\" cx=\"50%\" cy=\"45%\" r=\"72%\"><stop offset=\"60%\" stop-color=\"#000\" stop-opacity=\"0\"/><stop offset=\"100%\" stop-color=\"#000\" stop-opacity=\".45\"/><\/radialGradient><\/defs><rect width=\"300\" height=\"230\" fill=\"#dfe7ee\"/><path d=\"M0 120 L120 95 L170 100 L300 80 L300 230 L0 230Z\" fill=\"#f6f8fa\"/><path d=\"M120 95 q20 -14 50 5 l-6 30 q-20 8 -40 -6z\" fill=\"#cdd8e3\"/><path d=\"M118 95 L176 100\" stroke=\"#8aa0b6\" stroke-width=\"2\"/><path d=\"M140 108 l-10 70 M150 104 l-4 90 M162 108 l6 80\" stroke=\"#aebfcf\" stroke-width=\"3\"/><g fill=\"#9fb3c8\"><ellipse cx=\"90\" cy=\"140\" rx=\"8\" ry=\"4\"/><ellipse cx=\"100\" cy=\"152\" rx=\"8\" ry=\"4\"/><ellipse cx=\"80\" cy=\"160\" rx=\"8\" ry=\"4\"/><ellipse cx=\"205\" cy=\"150\" rx=\"8\" ry=\"4\"/><\/g><path d=\"M70 230 C 80 180, 100 140, 115 100\" stroke=\"#c4d1de\" stroke-width=\"7\" fill=\"none\"/><path d=\"M90 230 C 100 180, 115 140, 125 100\" stroke=\"#c4d1de\" stroke-width=\"7\" fill=\"none\"/><path d=\"M180 102 C 210 90, 250 85, 300 78\" stroke=\"#c4d1de\" stroke-width=\"7\" fill=\"n
